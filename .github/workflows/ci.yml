name: CI

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # 依赖从 pyproject.toml 装，单一来源——避免这里手写的清单
          # 与项目依赖脱节（M0-11 加了 fastapi/uvicorn，硬编码清单会漏）
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest tests/ -q
