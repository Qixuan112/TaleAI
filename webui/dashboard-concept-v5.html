<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>林星遥 · 今日 · 概念 v5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A//www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%236b7fd7'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fffdfa'/%3E%3C/svg%3E">
<script>
// 首屏前定主题，避免亮→暗闪一下。默认跟随系统，手动切过就记住。
// 这是整页唯一一段非 Vue 的命令式代码：主题必须在 CSS 解析前落到 <html> 上。
(function () {
  try {
    var saved = localStorage.getItem("taleai.dashboard.theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
  } catch (e) {}
})();
</script>
<style>
/* ============================================================
   TaleAI · 仪表盘样式
   ------------------------------------------------------------
   设计语言和设置页同一套：暖白纸面 + 靛蓝，信息优先、少卡片阴影。
   仪表盘只用**一个**数据色（--series-1）：活动量是单序列的"多少"，
   顺序色就够，不需要分类调色板；平台分布才用第二个色（--mark-2）。

   为什么单独一个 CSS 文件：这页开始用 Vue 组件化，模板和逻辑已经
   分开，样式再内联回去会变成一锅粥。其他页仍是单文件，互不影响。
   ============================================================ */

:root,
:root[data-theme="light"] {
  color-scheme: light;

  --paper: #f2efe9;
  --surface: #fffdfa;
  --surface-2: #f8f5ef;
  --ink: #1f1e1b;
  --ink-2: #3b3934;
  --muted: #6d6960;
  --faint: #9b968b;
  --line: #e3ded3;
  --line-soft: #ede8df;

  --accent: #4f5fb5;
  --accent-strong: #3f4f9e;
  --accent-soft: #eef0fa;

  --series-1: #6b7fd7;
  --series-strong: #4f5fb5;
  --series-track: #e3ded3;
  --mark-2: #b07d3a;

  --good: #3f8a5f;
  --good-soft: #ecf6ef;
  --warn: #a8732a;
  --warn-soft: #fdf5e6;
  --bad: #b04a43;
  --bad-soft: #fbeeed;

  --shadow: 0 1px 0 rgba(30, 29, 26, .03), 0 20px 60px rgba(30, 29, 26, .06);
  --radius-card: 12px;
  --radius-control: 9px;
  --radius-item: 7px;
  --dur: .18s;
  --ease: cubic-bezier(.22, .7, .3, 1);
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --paper: #0d0c0a;
  --surface: #191815;
  --surface-2: #131210;
  --ink: #f3f0e8;
  --ink-2: #d5d0c4;
  --muted: #9e988c;
  --faint: #746f65;
  --line: #2c2a25;
  --line-soft: #24221e;

  --accent: #a4b0ef;
  --accent-strong: #bcc5f6;
  --accent-soft: rgba(107, 127, 215, .16);

  --series-1: #7a89dd;
  --series-strong: #a4b0ef;
  --series-track: #2c2a25;
  --mark-2: #b9823f;

  --good: #7cc098;
  --good-soft: rgba(63, 138, 95, .16);
  --warn: #d3a05a;
  --warn-soft: rgba(168, 115, 42, .16);
  --bad: #dd8a83;
  --bad-soft: rgba(176, 74, 67, .16);

  --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 24px 70px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink-2);
  font: 14px/1.65 "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
  overflow: hidden;
  transition: background-color .3s var(--ease), color .3s var(--ease);
}
button { font: inherit; color: inherit; }
a { color: inherit; }
[v-cloak] { display: none !important; }
::selection { background: var(--accent-soft); color: var(--ink); }

.skip-link {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 100;
  padding: 7px 12px;
  border-radius: 7px;
  background: var(--ink);
  color: var(--surface);
  font-size: 12px;
  text-decoration: none;
  transform: translateY(-160%);
  transition: transform .15s var(--ease);
}
.skip-link:focus { transform: translateY(0); outline: 2px solid var(--accent); outline-offset: 2px; }

.noscript {
  max-width: 560px;
  margin: 18vh auto 0;
  padding: 20px 24px;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
  text-align: center;
}

#app {
  width: 100%;
  max-width: 1240px;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

/* ============ 顶栏 ============ */
.topbar {
  flex: none;
  height: 60px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  z-index: 10;
}
.titles { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.titles h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
  white-space: nowrap;
}
.titles .sub {
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 34ch;
}
.spacer { flex: 1; }

.sync {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.sync-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--good); }
.sync.syncing .sync-dot { animation: blink .6s var(--ease) infinite alternate; }
.sync.bad { color: var(--bad); }
.sync.bad .sync-dot { background: var(--bad); }
.demo-badge {
  flex: none;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--warn-soft);
  color: var(--warn);
  font-size: 9.5px;
  white-space: nowrap;
}
@keyframes blink { from { opacity: .3; } to { opacity: 1; } }

.chat-link {
  font-size: 11.5px;
  color: var(--accent);
  text-decoration: none;
  white-space: nowrap;
  padding: 4px 2px;
}
.chat-link:hover { text-decoration: underline; }
.chat-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.icon-btn {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: var(--radius-item);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.refresh-btn {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  background: var(--surface);
  color: var(--muted);
  font-size: 11.5px;
  cursor: pointer;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease),
              background var(--dur) var(--ease);
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.refresh-btn:disabled { opacity: .55; cursor: default; }
.spin { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ 侧栏 ============ */
.shell { flex: 1; min-height: 0; display: flex; position: relative; }

.sidebar {
  width: 240px;
  flex: none;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow: hidden;
  transition: width .22s var(--ease), transform .22s var(--ease);
  z-index: 20;
}
/* flex 项要显式归零 flex-basis / min-width，否则 width:0 顶不住自动最小尺寸 */
.sidebar.collapsed {
  width: 0;
  min-width: 0;
  flex: 0 0 0;
  transform: translateX(-100%);
  border-right: 0;
}

.side-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 20px 16px 14px;
  min-height: 68px;
  white-space: nowrap;
}
.brand-mark { flex: none; width: 26px; height: 26px; color: var(--accent); }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand-text strong {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-text small {
  margin-top: 3px;
  font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  font-size: 9px;
  letter-spacing: .16em;
  color: var(--faint);
  text-transform: uppercase;
}

.side-nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.side-nav a {
  display: flex;
  align-items: center;
  gap: 11px;
  height: 38px;
  padding: 0 10px;
  border-radius: var(--radius-item);
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.side-nav a svg { flex: none; color: var(--faint); transition: color var(--dur) var(--ease); }
.side-nav a:hover { background: var(--surface-2); color: var(--ink); }
.side-nav a:hover svg { color: var(--ink); }
.side-nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.side-nav a.active {
  color: var(--accent);
  background: var(--accent-soft);
  font-weight: 500;
  box-shadow: inset 2px 0 0 var(--accent);
}
.side-nav a.active svg { color: var(--accent); }

.side-foot {
  margin-top: auto;
  padding: 14px 16px 18px;
  border-top: 1px solid var(--line-soft);
  white-space: nowrap;
}
.life { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
.life .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--good);
  animation: life 3.2s var(--ease) infinite;
}
.life.bad .dot { background: var(--bad); animation: none; }
.life.warn .dot { background: var(--warn); animation: none; }
@keyframes life {
  0%, 100% { box-shadow: 0 0 0 0 rgba(63, 138, 95, .34); }
  50% { box-shadow: 0 0 0 5px rgba(63, 138, 95, 0); }
}
.side-version {
  margin-top: 4px;
  font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  font-size: 9px;
  letter-spacing: .1em;
  color: var(--faint);
}

.backdrop { display: none; }

/* ============ 主区 ============ */
.stage {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 24px clamp(20px, 3.2vw, 34px) 40px;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.stage::-webkit-scrollbar { width: 10px; }
.stage::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 999px;
  border: 3px solid var(--paper);
}
.stage::-webkit-scrollbar-track { background: transparent; }
.stage-inner { width: 100%; max-width: 1040px; margin: 0 auto; }

.loading-bar {
  position: fixed;
  top: 60px;
  left: 0;
  right: 0;
  height: 2px;
  z-index: 50;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size: 40% 100%;
  background-repeat: no-repeat;
  transition: opacity .15s var(--ease);
}
.loading-bar.on { opacity: .8; animation: sweep 1.1s linear infinite; }
@keyframes sweep { from { background-position: -40% 0; } to { background-position: 140% 0; } }

.inline-error {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding: 9px 13px;
  border: 1px solid var(--bad);
  border-radius: var(--radius-control);
  background: var(--bad-soft);
  color: var(--bad);
  font-size: 12px;
}
.inline-error span { flex: 1; min-width: 0; }
.inline-error button {
  flex: none;
  border: 1px solid currentColor;
  border-radius: 6px;
  background: transparent;
  color: inherit;
  font-size: 11px;
  padding: 2px 9px;
  cursor: pointer;
}

.fatal-card {
  max-width: 520px;
  margin: 12vh auto 0;
  padding: 26px 28px;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  text-align: left;
}
.fatal-card h2 { margin: 0 0 6px; font-size: 17px; color: var(--ink); }
.fatal-card p { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.fatal-card .fatal-hint { font-size: 12px; color: var(--faint); }
.fatal-actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
.primary {
  display: inline-flex;
  align-items: center;
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-control);
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  cursor: pointer;
}
.primary:hover { filter: brightness(1.06); }
.fatal-actions a { font-size: 12px; color: var(--accent); text-decoration: none; }
.fatal-actions a:hover { text-decoration: underline; }

/* ============ 状态条 ============ */
.status-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  overflow: hidden;
}
.status-item {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 12px 14px;
  text-decoration: none;
  transition: background var(--dur) var(--ease);
}
.status-item + .status-item { border-left: 1px solid var(--line-soft); }
.status-item:hover { background: var(--surface-2); }
.status-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.s-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.s-dot.ok { background: var(--good); }
.s-dot.warn { background: var(--warn); }
.s-dot.bad { background: var(--bad); }
.s-label {
  flex: none;
  font-size: 10px;
  letter-spacing: .05em;
  color: var(--muted);
  white-space: nowrap;
}
.s-value {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.status-item.bad .s-value { color: var(--bad); }
.status-item.warn .s-value { color: var(--warn); }
.s-note {
  flex: none;
  font-size: 9.5px;
  color: var(--faint);
  white-space: nowrap;
}

/* ============ 首屏：今天 + 脉搏 ============ */
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 14px;
  margin-top: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
}

.today-card { padding: 20px 22px; min-width: 0; }
.card-kicker {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  color: var(--muted);
}
.delta-badge {
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font-size: 10px;
  white-space: nowrap;
}
.delta-badge.up { background: var(--good-soft); color: var(--good); }
.delta-badge.down { background: var(--surface-2); color: var(--muted); }
.delta-badge.flat { background: var(--surface-2); color: var(--faint); }
.today-line { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.today-line .big {
  font-size: 46px;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -.03em;
  color: var(--ink);
  font-variant-numeric: proportional-nums;
}
.today-line .unit { font-size: 14px; color: var(--muted); }
.today-sub {
  margin: 8px 0 0;
  min-height: 1.6em;
  font-size: 12.5px;
  color: var(--muted);
  max-width: 46ch;
}
.today-mini {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
}
.mini-item { font-size: 11px; color: var(--muted); white-space: nowrap; }
.mini-item b {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: proportional-nums;
}

/* ---- 柱状图 ---- */
.pulse-card { padding: 18px 20px 14px; min-width: 0; display: flex; flex-direction: column; }
.pulse-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.pulse-head h2 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); flex: none; }
.metric-tabs {
  display: inline-flex;
  gap: 2px;
  margin-left: auto;
  padding: 2px;
  border-radius: 999px;
  background: var(--surface-2);
}
.metric-tab {
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  padding: 3px 9px;
  cursor: pointer;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.metric-tab:hover { color: var(--ink); }
.metric-tab.active {
  background: var(--surface);
  color: var(--accent);
  font-weight: 500;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06);
}
.metric-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.note { font-size: 10px; color: var(--faint); white-space: nowrap; }

.pulse-body { display: flex; gap: 8px; }
.pulse-y {
  width: 30px;
  height: 102px;
  margin-top: 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
  font-size: 9.5px;
  line-height: 1;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.pulse-plot { position: relative; flex: 1; height: 116px; min-width: 0; }
.gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line-soft); }
.pulse-cols { position: absolute; left: 0; right: 0; top: 14px; bottom: 0; display: flex; align-items: flex-end; }
.pulse-col {
  position: relative;
  flex: 1;
  height: 100%;
  min-width: 0;
  padding: 0 2px;
  border: 0;
  background: transparent;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
  border-radius: 4px;
}
.pulse-col:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pulse-bar {
  width: min(72%, 16px);
  max-height: 100%;
  background: var(--series-1);
  border-radius: 3px 3px 0 0;
  transform-origin: bottom;
  animation: grow .5s var(--ease) both;
  transition: background var(--dur) var(--ease), height .25s var(--ease);
}
.pulse-col:hover .pulse-bar,
.pulse-col.active .pulse-bar { background: var(--series-strong); }
.pulse-col.today .pulse-bar { background: var(--accent); }
.pulse-bar.zero { background: var(--series-track); border-radius: 1px; }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.bar-label {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  padding: 0 2px;
  background: var(--surface);
  color: var(--ink-2);
  font-size: 9.5px;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.pulse-foot {
  display: flex;
  justify-content: space-between;
  margin: 6px 0 0 38px;
  font-size: 9.5px;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}
.pulse-readout {
  min-height: 17px;
  margin-top: 3px;
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pulse-table { margin-top: 6px; border-top: 1px solid var(--line-soft); padding-top: 5px; }
.pulse-table summary {
  font-size: 10px;
  color: var(--muted);
  cursor: pointer;
  list-style: none;
  width: max-content;
}
.pulse-table summary::-webkit-details-marker { display: none; }
.pulse-table summary:hover { color: var(--accent); }
.pulse-table summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.pulse-table table {
  width: 100%;
  margin-top: 6px;
  border-collapse: collapse;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.pulse-table th, .pulse-table td {
  padding: 3px 4px;
  text-align: left;
  border-bottom: 1px solid var(--line-soft);
}
.pulse-table th { color: var(--faint); font-weight: 500; }
.pulse-table td { color: var(--muted); }
.pulse-table td:last-child, .pulse-table th:last-child { text-align: right; }

.pulse-empty {
  flex: 1;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.pulse-empty-mark { font-size: 22px; line-height: 1; color: var(--faint); }
.pulse-empty p { margin: 0; }
.pulse-empty a { color: var(--accent); text-decoration: none; }
.pulse-empty a:hover { text-decoration: underline; }

/* ============ 需要你 ============ */
.alerts-card { margin-top: 14px; padding: 15px 18px; }
.alerts-card.all-good { padding-bottom: 13px; }
.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}
.card-head h2 { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.alert-list { display: flex; flex-direction: column; }
.alert {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
}
.alert:last-child { border-bottom: 0; padding-bottom: 0; }
.a-dot {
  flex: none;
  width: 6px;
  height: 6px;
  margin-top: 7px;
  border-radius: 50%;
  background: var(--warn);
}
.alert.bad .a-dot { background: var(--bad); }
.alert.info .a-dot { background: var(--accent); }
.a-body { flex: 1; min-width: 0; }
.a-title { margin: 0; font-size: 12.5px; color: var(--ink); line-height: 1.5; }
.a-detail { margin: 1px 0 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
.a-action {
  flex: none;
  margin-top: 1px;
  font-size: 11px;
  color: var(--accent);
  text-decoration: none;
  white-space: nowrap;
}
.a-action:hover { text-decoration: underline; }
.a-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.all-clear {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 3px 0 1px;
  font-size: 12px;
  color: var(--muted);
}
.all-clear .check {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--good-soft);
  color: var(--good);
}
.all-clear b { color: var(--ink); font-weight: 500; }
.all-clear small { display: block; font-size: 11px; color: var(--faint); }

/* ============ KPI ============ */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 14px;
}
.kpi { padding: 14px 18px; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line-soft); }
.kpi-label { font-size: 10px; letter-spacing: .06em; color: var(--muted); }
.kpi-value {
  margin-top: 2px;
  font-size: 27px;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -.02em;
  color: var(--ink);
  font-variant-numeric: proportional-nums;
}
.kpi-foot {
  margin-top: 2px;
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kpi-foot .up { color: var(--good); }
.kpi-foot .down { color: var(--muted); }
.kpi-foot .flat { color: var(--faint); }

/* ============ 第二屏：LLM / 平台 / 快捷 ============ */
.scan-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, .9fr);
  gap: 14px;
  margin-top: 14px;
}
.scan-card { padding: 16px 18px; min-width: 0; }

.llm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.l-label { font-size: 10px; letter-spacing: .04em; color: var(--muted); }
.l-value {
  margin-top: 2px;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.l-note { font-size: 10px; color: var(--muted); }
.l-note.bad { color: var(--bad); }
.empty-note {
  margin: 0;
  padding: 8px 0 2px;
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--faint);
}
.empty-note a { color: var(--accent); text-decoration: none; }
.empty-note a:hover { text-decoration: underline; }

.dist-bar { display: flex; gap: 2px; height: 10px; margin: 4px 0 10px; }
.dist-seg { height: 100%; border-radius: 999px; transition: width .3s var(--ease); }
.dist-seg.web { background: var(--series-1); }
.dist-seg.qq { background: var(--mark-2); }
.dist-legend { display: flex; flex-direction: column; gap: 5px; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.legend-dot.web { background: var(--series-1); }
.legend-dot.qq { background: var(--mark-2); }
.legend-item .l-name { color: var(--ink-2); }
.legend-item .l-num {
  margin-left: auto;
  font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  font-size: 9.5px;
  color: var(--faint);
}
.dist-note {
  margin: 8px 0 0;
  font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  font-size: 9px;
  color: var(--faint);
}

.onboard { display: flex; flex-direction: column; gap: 1px; }
.step {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 7px 2px;
  border-radius: 6px;
  text-decoration: none;
  transition: background var(--dur) var(--ease);
}
.step:hover { background: var(--surface-2); }
.step:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.step-index {
  flex: none;
  width: 18px;
  height: 18px;
  margin-top: 1px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 10px;
  font-weight: 600;
}
.step b { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink); line-height: 1.5; }
.step small { display: block; font-size: 10px; color: var(--faint); line-height: 1.5; }
.ready { display: flex; flex-direction: column; gap: 10px; }
.ready-note { margin: 2px 0 0; font-size: 11.5px; line-height: 1.7; color: var(--muted); }
.ready-note b { font-weight: 500; color: var(--ink); }
.quick-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.quick-card-body { display: flex; flex-direction: column; gap: 8px; }
.quick-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.quick-actions { display: flex; gap: 6px; }
.quick-actions .quick-action { flex: 1; justify-content: center; }
.quick-card { display: flex; flex-direction: column; }
.quick-note {
  margin: auto 0 0;
  padding-top: 8px;
  font-size: 9px;
  letter-spacing: .03em;
  color: var(--faint);
}
.quick-links a,
.quick-nav a {
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 11px;
  text-decoration: none;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease),
              background var(--dur) var(--ease);
}
.quick-action {
  display: inline-flex;
  align-items: center;
  height: 28px;
  padding: 0 11px;
  border: 1px dashed var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease),
              background var(--dur) var(--ease);
}
.quick-links a:hover, .quick-nav a:hover, .quick-action:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.quick-links a.quick-primary {
  border-color: var(--accent);
  background: var(--accent);
  color: var(--surface);
}
.quick-links a.quick-primary:hover {
  background: var(--accent);
  color: var(--surface);
  filter: brightness(1.06);
}
.quick-links a:focus-visible, .quick-nav a:focus-visible, .quick-action:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ============ 细节栏 ============ */
.section-rule {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0 2px;
  font-size: 9px;
  letter-spacing: .14em;
  color: var(--faint);
}
.section-rule::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.columns {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  gap: 46px;
  padding-top: 14px;
}
.col { min-width: 0; }
.chapter { margin-bottom: 32px; }
.chapter:last-child { margin-bottom: 0; }
.chapter-head {
  display: flex;
  align-items: baseline;
  gap: 9px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.chapter-head .index {
  flex: none;
  font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  font-size: 9px;
  color: var(--faint);
}
.chapter-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink); flex: none; }
.chapter-head .note {
  margin-left: auto;
  font-size: 9.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.chapter-head .head-link {
  flex: none;
  font-size: 10.5px;
  color: var(--accent);
  text-decoration: none;
  white-space: nowrap;
}
.chapter-head .head-link:hover { text-decoration: underline; }
.chapter-head .head-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* ---- 记忆 ---- */
.memory { border-bottom: 1px solid var(--line-soft); }
.memory:last-child { border-bottom: 0; }
.memory-head {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 11px 2px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
  border-radius: 6px;
  transition: background var(--dur) var(--ease);
}
.memory-head:hover { background: var(--surface-2); }
.memory-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.memory-text {
  flex: 1;
  min-width: 0;
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--ink-2);
}
.memory-side {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  padding-top: 2px;
}
.ticks { display: inline-flex; gap: 2px; }
.ticks i { width: 3px; height: 7px; border-radius: 1px; background: var(--line); }
.ticks i.on { background: var(--series-1); }
.memory-time { font-size: 9.5px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chevron {
  flex: none;
  align-self: center;
  margin-left: 1px;
  font-size: 13px;
  line-height: 1;
  color: var(--faint);
  transition: transform .2s var(--ease), color .2s var(--ease);
}
.memory:hover .chevron { color: var(--muted); }
.memory.open .chevron { transform: rotate(90deg); color: var(--accent); }
.memory-body {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .24s var(--ease);
}
.memory.open .memory-body { grid-template-rows: 1fr; }
.memory-body-inner { overflow: hidden; min-height: 0; }
.memory-detail { padding: 0 2px 12px 0; }
.memory-quote {
  margin: 0 0 8px;
  padding-left: 12px;
  border-left: 2px solid var(--accent-soft);
  font-size: 12px;
  line-height: 1.7;
  color: var(--muted);
}
.memory-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-size: 9.5px;
  color: var(--faint);
}
.memory-meta span:first-child:not(:only-child) { color: var(--accent); }

/* ---- 事件 ---- */
.ledger { list-style: none; margin: 0; padding: 0; }
.entry {
  display: grid;
  grid-template-columns: 56px 48px minmax(0, 1fr);
  gap: 8px;
  align-items: baseline;
  padding: 8px 2px;
  border-bottom: 1px solid var(--line-soft);
}
.entry:last-child { border-bottom: 0; }
.entry time {
  font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  font-size: 9.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.kind {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.kind::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.kind.recv::before { background: var(--series-1); }
.kind.sent::before { background: var(--good); }
.kind.closed::before { background: var(--line); }
.entry p {
  margin: 0;
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.entry p.quiet { color: var(--faint); }

/* ---- 会话 ---- */
.session {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 9px 2px;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  text-align: left;
  cursor: pointer;
  border-radius: 5px;
  transition: background var(--dur) var(--ease);
}
.session:last-child { border-bottom: 0; }
.session:hover { background: var(--surface-2); }
.session:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.session-title {
  flex: 1;
  min-width: 0;
  font-size: 12.5px;
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.session-meta { flex: none; font-size: 9.5px; color: var(--faint); white-space: nowrap; }
.session .arrow {
  flex: none;
  color: var(--faint);
  opacity: 0;
  transform: translateX(-3px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.session:hover .arrow, .session:focus-visible .arrow { opacity: 1; transform: translateX(0); }

/* ---- 系统 ---- */
.system { margin: 0; padding-top: 2px; }
.system .row {
  display: grid;
  grid-template-columns: 58px minmax(0, 1fr);
  gap: 12px;
  padding: 6px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: 11px;
}
.system .row:last-child { border-bottom: 0; }
.system dt { color: var(--muted); font-size: 9.5px; letter-spacing: .03em; }
.system dd {
  margin: 0;
  color: var(--muted);
  font-size: 10.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.status-line { display: inline-flex; align-items: center; gap: 6px; }
.status-line .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.status-line.ok .dot { background: var(--good); }
.status-line.warn .dot { background: var(--warn); }
.status-line.bad .dot { background: var(--bad); }

/* ============ 页脚 / 浮层 ============ */
.colophon {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 38px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  font-size: 9px;
  letter-spacing: .04em;
  color: var(--faint);
}
.colophon .sep { opacity: .5; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%) translateY(7px);
  max-width: min(86vw, 420px);
  padding: 8px 15px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--surface);
  font-size: 11.5px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--ease), transform .2s var(--ease);
  z-index: 60;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ 中等宽度：先保信息，再保并排 ============ */
@media (max-width: 1100px) {
  .scan-grid { grid-template-columns: 1fr 1fr; }
  .quick-card { grid-column: 1 / -1; }
  .quick-links { margin-top: 0; }
  /* 这一档图表卡被压到 ~290px：标题 + 三个指标页签已经占满，
     合计放不下就藏掉（读数行仍有当天数字，信息不丢）。 */
  .pulse-head .note { display: none; }
}

@media (max-width: 980px) {
  .stage { padding: 20px 20px 32px; }
  .hero-grid { grid-template-columns: 1fr; }
  .kpi-row { grid-template-columns: 1fr 1fr; }
  .kpi:nth-child(3) { border-left: 0; border-top: 1px solid var(--line-soft); }
  .kpi:nth-child(4) { border-top: 1px solid var(--line-soft); }
  .columns { grid-template-columns: 1fr; gap: 0; }
}

/* ============ 窄屏：侧栏变抽屉 ============ */
@media (max-width: 900px) {
  #app { max-width: none; box-shadow: none; }
  .sidebar {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 240px;
    transform: translateX(-100%);
    box-shadow: 0 0 40px rgba(0, 0, 0, .16);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar.collapsed { width: 240px; min-width: 0; flex: 0 0 auto; transform: translateX(-100%); border-right: 1px solid var(--line); }
  .backdrop.show {
    display: block;
    position: absolute;
    inset: 0;
    z-index: 15;
    background: rgba(0, 0, 0, .27);
  }
  .status-strip { grid-template-columns: 1fr 1fr; }
  .status-item:nth-child(3) { border-left: 0; border-top: 1px solid var(--line-soft); }
  .status-item:nth-child(4) { border-top: 1px solid var(--line-soft); }
  .scan-grid { grid-template-columns: 1fr; }
  .quick-card { grid-column: auto; }
}

@media (max-width: 620px) {
  .topbar { height: 56px; padding: 0 12px; gap: 7px; }
  .titles h1 { font-size: 15px; }
  .titles .sub { max-width: 22ch; font-size: 10.5px; }
  .sync { display: none; }
  .chat-link { display: none; }
  .refresh-btn { padding: 0 9px; }
  .refresh-btn span { display: none; }
  .stage { padding: 14px 13px 28px; }
  .today-card { padding: 16px; }
  .today-line .big { font-size: 38px; }
  .today-sub { font-size: 12px; }
  .pulse-card { padding: 14px 14px 12px; }
  .pulse-head { gap: 8px; }
  .pulse-head .note { display: none; }
  .metric-tabs { margin-left: auto; }
  .status-item { padding: 10px 11px; }
  .s-note { display: none; }
  .kpi { padding: 12px 14px; }
  .kpi-value { font-size: 23px; }
  .scan-card { padding: 14px 15px; }
  .chapter-head .note { display: none; }
  .entry { grid-template-columns: 50px 44px minmax(0, 1fr); gap: 7px; }
  .colophon { margin-top: 28px; }
}

@media (prefers-contrast: more) {
  :root,
  :root[data-theme="light"] {
    --faint: #6d6960;
    --line: #cfc8ba;
    --line-soft: #ddd6c9;
  }
  :root[data-theme="dark"] {
    --faint: #b3ac9f;
    --line: #3b3831;
    --line-soft: #302d27;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .life .dot { animation: none; }
}

@media print {
  body { background: #fff; overflow: visible; }
  #app { box-shadow: none; max-width: none; height: auto; overflow: visible; }
  .topbar, .sidebar, .backdrop, .refresh-btn, .toast, .loading-bar { display: none !important; }
  .stage { overflow: visible; padding: 0; }
  .memory-body { grid-template-rows: 1fr; }
  .pulse-bar { animation: none; }
}

</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<noscript>
  <div class="noscript">仪表盘需要 JavaScript。请用现代浏览器打开，或在设置页检查浏览器设置。</div>
</noscript>
<div id="app" v-cloak>

  <!-- ============ 顶栏：页面身份 + 全局动作 ============ -->
  <header class="topbar">
    <button class="icon-btn" id="sidebarToggle" type="button"
            @click="toggleSidebar" :aria-expanded="sidebarAria"
            aria-label="侧栏导航" title="侧栏导航">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" aria-hidden="true">

<!-- ============================================================
     组件模板：用 <script type="text/x-template"> 放在页面里，
     不引构建工具也能享受 Vue 的组件化。所有用户数据都走 {{ }}，

     ============================================================ -->

<script type="text/x-template" id="tpl-status-strip">
  <section class="status-strip" aria-label="系统状态">
    <a v-for="item in items" :key="item.label" class="status-item" :class="item.level"
       :href="safeHref(item.href)" :title="item.title || item.value">
      <span class="s-dot" :class="item.level"></span>
      <span class="s-label">{{ item.label }}</span>
      <span class="s-value">{{ item.value }}</span>
      <span class="s-note" v-if="item.note">{{ item.note }}</span>
    </a>
  </section>
</script>

<script type="text/x-template" id="tpl-today-panel">
  <section class="card today-card">
    <div class="card-kicker">
      <span>今天的对话</span>
      <span class="delta-badge" :class="deltaClass">{{ deltaText }}</span>
    </div>

      <span class="big">{{ fmtNum(today.messages) }}</span>

      </span>

</script>

<script type="text/x-template" id="tpl-pulse-chart">
  <section class="card pulse-card">
    <div class="card-head pulse-head">
      <h2>近十四日</h2>
      <div class="metric-tabs" role="group" aria-label="活动指标">
        <button v-for="m in metrics" :key="m.key" type="button" class="metric-tab"
                :class="{ active: metric === m.key }" :aria-pressed="metric === m.key"
                @click="select(m.key)">{{ m.label }}</button>
      </div>
      <span class="note">合计 {{ fmtNum(total) }} {{ unit }}</span>
    </div>

    <div v-if="hasData" class="pulse-body">
      <div class="pulse-y" aria-hidden="true">
        <span>{{ fmtNum(max) }}</span>
        <span>{{ fmtNum(Math.round(max / 2)) }}</span>
        <span>0</span>
      </div>
      <div class="pulse-plot" role="group" aria-label="近十四天活动柱状图">
        <div class="pulse-cols">
          <div class="gridline" v-for="level in gridLevels" :key="level"
               :style="{ bottom: (level * 100) + '%' }"></div>
          <button v-for="(day, i) in series" :key="day.date + '-' + i" type="button"
                  class="pulse-col" :class="{ today: i === series.length - 1, active: hovered === i }"
                  :aria-label="ariaLabel(day)"
                  @pointerenter="hovered = i" @pointerleave="hovered = -1"
                  @focus="hovered = i" @blur="hovered = -1"
                  @keydown="onKey($event, i)">
            <span class="pulse-bar" :class="{ zero: !day[metric] }"
                  :style="{ height: barHeight(day), animationDelay: (i * 18) + 'ms' }"></span>
            <span class="bar-label" v-if="i === series.length - 1 && day[metric]"
                  :style="{ bottom: labelBottom(day) }">
              {{ fmtNum(day[metric]) }}
            </span>
          </button>
        </div>
      </div>
    </div>

    <div class="pulse-foot" v-if="hasData">
      <span>{{ series.length ? series[0].date : "" }}</span><span>今天</span>
    </div>
    <div class="pulse-readout" aria-live="polite" v-if="hasData">{{ readout }}</div>

    <details class="pulse-table" v-if="hasData">
      <summary>数据表</summary>
      <table>
        <thead><tr><th>日期</th><th>事件</th><th>消息</th><th>记忆</th></tr></thead>
        <tbody>
          <tr v-for="day in reversedSeries" :key="day.date">
            <td>{{ day.date }}</td>
            <td>{{ fmtNum(day.events) }}</td>
            <td>{{ fmtNum(day.messages) }}</td>
            <td>{{ fmtNum(day.memories) }}</td>
          </tr>
        </tbody>
      </table>
    </details>

    <div class="pulse-empty" v-else>
      <span class="pulse-empty-mark" aria-hidden="true">—</span>
      <p>近十四日还没有活动。<a href="/">去聊一句 →</a></p>
    </div>
  </section>
</script>

<script type="text/x-template" id="tpl-alerts-panel">
  <section class="card alerts-card" :class="{ 'all-good': !alerts.length }">
    <div class="card-head">
      <h2>需要你</h2>
      <span class="note" v-if="alerts.length">{{ alerts.length }} 项</span>
    </div>

    <div v-if="!alerts.length" class="all-clear">
      <span class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 12.5 9.5 18 20 6.5"/>
        </svg>
      </span>
      <div><b>没有需要你处理的事</b><small>它自己在跑。</small></div>
    </div>

    <div v-else class="alert-list">
      <div v-for="(a, i) in alerts" :key="i" class="alert" :class="a.level">
        <span class="a-dot" aria-hidden="true"></span>
        <div class="a-body">
          <p class="a-title">{{ a.title }}</p>
          <p class="a-detail" v-if="a.detail">{{ a.detail }}</p>
        </div>
        <a v-if="a.action" class="a-action" :href="safeHref(a.href)">{{ a.action }} →</a>
      </div>
    </div>
  </section>
</script>

<script type="text/x-template" id="tpl-kpi-row">
  <section class="card kpi-row" aria-label="累计数据">
    <div v-for="item in items" :key="item.label" class="kpi">
      <div class="kpi-label">{{ item.label }}</div>

<script type="text/x-template" id="tpl-llm-panel">
  <section class="card scan-card llm-card">
    <div class="card-head"><h2>LLM 用量</h2><span class="note">今天</span></div>
    <p v-if="!llm || !llm.calls" class="empty-note">
      今天还没有调用。发一条消息，这里就会亮起来。
    </p>
    <div v-else class="llm-grid">
      <div class="llm-stat">
        <div class="l-label">调用</div>
        <div class="l-value">{{ fmtNum(llm.calls) }}</div>
        <div class="l-note" :class="{ bad: llm.errors }">
          {{ llm.errors ? llm.errors + " 次失败" : "全部成功" }}
        </div>
      </div>
      <div class="llm-stat">
        <div class="l-label">Token</div>
        <div class="l-value">{{ compact(llm.tokens_total) }}</div>
        <div class="l-note">in {{ compact(llm.tokens_in) }} / out {{ compact(llm.tokens_out) }}</div>
      </div>
      <div class="llm-stat">
        <div class="l-label">平均响应</div>
        <div class="l-value">{{ latencyText }}</div>
        <div class="l-note">端到端</div>
      </div>
      <div class="llm-stat">
        <div class="l-label">成功率</div>
        <div class="l-value">{{ llm.success_rate == null ? "—" : llm.success_rate + "%" }}</div>
        <div class="l-note">今天</div>
      </div>
    </div>
  </section>
</script>

<script type="text/x-template" id="tpl-distribution-panel">
  <section class="card scan-card dist-card">
    <div class="card-head"><h2>平台分布</h2><span class="note">消息</span></div>
    <template v-if="total">

        <div class="legend-item">

<script type="text/x-template" id="tpl-memory-list">
  <section class="chapter">
    <div class="chapter-head">
      <span class="index">01</span><h2>记忆</h2>
      <span class="note">{{ total ? "共 " + fmtNum(total) + " 条 · 今日 +" + fmtNum(todayCount) : "" }}</span>
    </div>

    <p v-if="!memories.length" class="empty-note">
      还没有提炼出记忆——聊一会儿，静默之后会自动提炼。
      <a href="/">去聊天 →</a>
    </p>

    <div v-else>
      <article v-for="(m, i) in memories" :key="m.id || i" class="memory" :class="{ open: isOpen(m, i) }">
        <button class="memory-head" type="button" :aria-expanded="isOpen(m, i)"
                @click="toggle(m, i)">
          <span class="memory-text">{{ m.content || "（空记忆）" }}</span>
          <span class="memory-side">
            <span class="ticks" :aria-label="'重要度 ' + (m.importance || 0) + ' / 5'"
                  :title="'重要度 ' + (m.importance || 0) + ' / 5'">
              <i v-for="n in 5" :key="n" :class="{ on: n <= (m.importance || 0) }"></i>
            </span>
            <span class="memory-time">{{ relTime(m.created_at) }}</span>
          </span>
          <span class="chevron" aria-hidden="true">›</span>
        </button>

        <div class="memory-body">
          <div class="memory-body-inner">
            <div class="memory-detail">
              <p v-if="m.quote" class="memory-quote">“{{ m.quote }}”</p>
              <div class="memory-meta">
                <span v-for="t in (m.tags || [])" :key="t">#{{ t }}</span>
                <span>来自 {{ titles[m.session_id] || m.session_id || "一段对话" }}</span>
                <span>重要度 {{ m.importance || 0 }}/5</span>
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>
  </section>
</script>

<script type="text/x-template" id="tpl-event-list">
  <section class="chapter">
    <div class="chapter-head">
      <span class="index">02</span><h2>最近发生</h2>
      <span class="note">{{ fmtNum(todayCount) }} 起 · 今日</span>
      <a class="head-link" href="/logs">全部 →</a>
    </div>

    <p v-if="!events.length" class="empty-note">
      还没有事件记录——发一条消息，这里就会有动静。
      <a href="/">去聊天 →</a>
    </p>

    <ol v-else class="ledger">
      <li v-for="(ev, i) in events" :key="ev.seq || i" class="entry">
        <time>{{ eventTime(ev.ts) }}</time>
        <span class="kind" :class="eventDot(ev.type)">{{ eventLabel(ev.type) }}</span>
        <p :class="{ quiet: !ev.preview }">{{ ev.preview || fallbackText(ev) }}</p>
      </li>
    </ol>
  </section>
</script>

<script type="text/x-template" id="tpl-session-list">
  <section class="chapter">
    <div class="chapter-head">
      <span class="index">03</span><h2>会话</h2>
      <span class="note">网页 {{ fmtNum(total) }} 个</span>
      <a class="head-link" href="/">打开聊天 →</a>
    </div>

    <p v-if="!sessions.length" class="empty-note">
      还没有网页会话。<a href="/">去聊第一句 →</a>
    </p>

    <div v-else>
      <button v-for="s in sessions" :key="s.id" type="button" class="session"
              :title="'打开「' + (s.title || s.id) + '」'" @click="$emit('open', s)">
        <span class="session-title">{{ s.title || s.id }}</span>
        <span class="session-meta">{{ fmtNum(s.count) }} 条 · {{ relTime(s.last_active) }}</span>
        <svg class="arrow" viewBox="0 0 24 24" width="13" height="13" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 6 15 12 9 18"/>
        </svg>
      </button>
    </div>
  </section>
</script>

<script type="text/x-template" id="tpl-system-panel">
  <section class="chapter">
    <div class="chapter-head">
      <span class="index">04</span><h2>系统</h2>
    </div>
    <dl class="system">
      <div v-for="row in rows" :key="row.label" class="row">
        <dt>{{ row.label }}</dt>
        <dd :title="row.title || row.value">
          <span v-if="row.status" class="status-line" :class="row.status">
            <span class="dot"></span><span>{{ row.value }}</span>
          </span>
          <template v-else>{{ row.value }}</template>
        </dd>
      </div>
    </dl>
  </section>
</script>

<script>
/* ============================================================
   TaleAI · 仪表盘（Vue 3 · Composition API · 自包含概念页 v5）
   ------------------------------------------------------------
   为什么用 Vue 而不是继续手写 DOM：
     · 仪表盘有 12 个区块、几十个数字，手写 render 函数很容易漏同步；
     · Vue 的 ref/computed 让"一份数据 → 多处展示"的推导关系显式化；
     · 组件模板留在 HTML 里（text/x-template），不需要构建工具。
   仍然守住的两条项目纪律：
     · 不引 CDN、不引构建链：Vue 本体 vendored 在 webui/vendor/；
     · 不把字符串当 HTML 塞进 DOM：用户数据一律走 {{ }}，由 Vue 转义。

   数据接口是 /api/overview；概念页在没有后端时退回示例数据（v5 的约定）。
   ============================================================ */

const { createApp, ref, computed, onMounted, onBeforeUnmount } = Vue;

const REFRESH_MS = 30000;
const FETCH_TIMEOUT_MS = 10000;
const NAV_KEY = "taleai.nav_collapsed";
const THEME_KEY = "taleai.dashboard.theme";

/* ---------- 格式化：所有展示口径只在这里写一遍 ---------- */

function pad2(n) {
  return n < 10 ? "0" + n : "" + n;
}

function fmtNum(n) {
  return Number(n || 0).toLocaleString("zh-CN");
}

// 1,234 / 12.9K / 1.2M —— 卡片里不撑破
function compact(n) {
  n = Number(n || 0);
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K";
  return fmtNum(n);
}

function clockOf(ts) {
  const d = new Date(ts * 1000);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
}

function relTime(ts) {
  if (!ts) return "—";
  const diff = Math.max(0, Date.now() / 1000 - ts);
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
  if (diff < 172800) return "昨天";
  const d = new Date(ts * 1000);
  return (d.getMonth() + 1) + "-" + d.getDate();
}

function monthDay(ts) {
  const d = new Date(ts * 1000);
  return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
}

function weekday(ts) {
  return ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][new Date(ts * 1000).getDay()];
}

function greeting(h) {
  if (h < 6) return "凌晨好";
  if (h < 9) return "早上好";
  if (h < 12) return "上午好";
  if (h < 14) return "中午好";
  if (h < 18) return "下午好";
  return "晚上好";
}

function clip(s, n) {
  s = String(s || "");
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

function signed(n) {
  return (n > 0 ? "+" : "") + fmtNum(n);
}

// 只允许站内路径。即使接口被替换成恶意响应，javascript: / //evil.com 也进不来。
function safeHref(href) {
  if (typeof href !== "string") return "#";
  if (!href.startsWith("/") || href.startsWith("//")) return "#";
  return href;
}

function qqView(qq) {
  if (!qq || !qq.state) return { text: "未接入", level: "" };
  if (qq.state === "running") {
    return qq.connected
      ? { text: "已连接", level: "ok" }
      : { text: "等待 SnowLuma", level: "warn" };
  }
  if (qq.state === "starting") return { text: "启动中", level: "warn" };
  if (qq.state === "failed") return { text: "启动失败", level: "bad" };
  if (qq.enabled === false) return { text: "未启用", level: "" };
  return { text: "已停止", level: "warn" };
}

/* ---------- 空数据：接口还没回来时，模板也能安全渲染 ---------- */

function emptyData() {
  return {
    now: Date.now() / 1000,
    generated_ms: 0,
    demo: false,
    bot: { name: "塔利", model: "", base_url: "" },
    counts: {
      sessions: 0, web_sessions: 0, messages: 0,
      events: 0, memories: 0, memories_forgotten: 0,
    },
    today: { events: 0, memories: 0, messages: 0 },
    previous: { events: 0, memories: 0, messages: 0 },
    deltas: { messages: 0, events: 0, memories: 0 },
    series: [],
    recent_events: [],
    recent_memories: [],
    sessions: [],
    platforms: {},
    platform_counts: {},
    llm: {},
    alerts: [],
    memory: { last_at: null, active: 0, forgotten: 0 },
    llm_key_set: false,
    events_window: { first_at: null, last_at: null },
  };
}

// 旧版接口 / 局部降级时，把缺的键补上——前端不为"字段还没加"写第二套分支。
function normalize(raw) {
  const base = emptyData();
  const out = Object.assign({}, base, raw || {});
  out.bot = Object.assign({}, base.bot, (raw && raw.bot) || {});
  out.counts = Object.assign({}, base.counts, (raw && raw.counts) || {});
  out.today = Object.assign({}, base.today, (raw && raw.today) || {});
  out.previous = Object.assign({}, base.previous, (raw && raw.previous) || {});
  out.deltas = Object.assign({}, base.deltas, (raw && raw.deltas) || {});
  out.memory = Object.assign({}, base.memory, (raw && raw.memory) || {});
  out.events_window = Object.assign({}, base.events_window, (raw && raw.events_window) || {});
  out.series = Array.isArray(raw && raw.series)
    ? raw.series.map(function (day) {
        return Object.assign({ date: "", events: 0, messages: 0, memories: 0 }, day);
      })
    : [];
  out.recent_events = Array.isArray(raw && raw.recent_events) ? raw.recent_events : [];
  out.recent_memories = Array.isArray(raw && raw.recent_memories) ? raw.recent_memories : [];
  out.sessions = Array.isArray(raw && raw.sessions) ? raw.sessions : [];
  out.alerts = Array.isArray(raw && raw.alerts) ? raw.alerts : [];
  out.platforms = raw && raw.platforms && typeof raw.platforms === "object" ? raw.platforms : {};
  out.platform_counts = raw && raw.platform_counts && typeof raw.platform_counts === "object"
    ? raw.platform_counts : {};
  out.llm = raw && raw.llm && typeof raw.llm === "object" ? raw.llm : {};
  return out;
}

async function fetchOverview() {
  // 概念页的约定：没有后端也要能看。
  //   file:// 直接给示例数据（双击打开即可）；
  //   http 下接口不存在/请求失败，同样退回示例数据。
  if (location.protocol === "file:") {
    await new Promise(function (resolve) { setTimeout(resolve, 260); });
    return normalize(mockData());
  }
  const controller = new AbortController();
  const timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
  try {
    const resp = await fetch("/api/overview", {
      cache: "no-store",
      signal: controller.signal,
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const json = await resp.json();
    if (!json || json.ok !== true) {
      throw new Error((json && json.error) || "接口返回异常");
    }
    return normalize(json);
  } catch (e) {
    await new Promise(function (resolve) { setTimeout(resolve, 260); });
    return normalize(mockData());
  } finally {
    clearTimeout(timer);
  }
}

const StatusStrip = {

const TodayPanel = {

    summary: { type: String, default: "" },
    mini: { type: Array, default: function () { return []; } },
  },
  template: "#tpl-today-panel",
};

const PulseChart = {
  props: {
    series: { type: Array, default: function () { return []; } },
    metric: { type: String, default: "events" },
  },
  emits: ["update:metric"],
  data: function () {
    return { hovered: -1 };
  },
  computed: {
    metrics: function () {
      return [
        { key: "events", label: "事件", unit: "起" },
        { key: "messages", label: "消息", unit: "条" },
        { key: "memories", label: "记忆", unit: "条" },
      ];
    },
    current: function () {
      const key = this.metric;
      return this.metrics.find(function (m) { return m.key === key; }) || this.metrics[0];
    },
    unit: function () { return this.current.unit; },
    max: function () {
      let max = 1;
      const key = this.metric;
      this.series.forEach(function (day) {
        const v = Number(day[key] || 0);
        if (v > max) max = v;
      });
      return max;
    },
    total: function () {
      const key = this.metric;
      return this.series.reduce(function (sum, day) {
        return sum + Number(day[key] || 0);
      }, 0);
    },
    hasData: function () {
      return this.total > 0;
    },
    gridLevels: function () { return [1, 0.5, 0]; },
    reversedSeries: function () { return this.series.slice().reverse(); },
    activeDay: function () {
      if (this.hovered >= 0 && this.series[this.hovered]) return this.series[this.hovered];
      return this.series[this.series.length - 1] || null;
    },
    readout: function () {
      const day = this.activeDay;
      if (!day) return "";
      return day.date + " · " + fmtNum(day.events) + " 起事件 · " +
             fmtNum(day.messages) + " 条消息 · " + fmtNum(day.memories) + " 条记忆";
    },
  },
  methods: {
    select: function (key) {
      this.$emit("update:metric", key);
      this.hovered = -1;
    },
    barHeight: function (day) {
      const v = Number(day[this.metric] || 0);
      if (!v) return "2px";
      return Math.max(3, (v / this.max) * 100) + "%";
    },
    labelBottom: function (day) {
      const v = Number(day[this.metric] || 0);
      if (!v) return "3px";
      const pct = Math.max(3, (v / this.max) * 100);
      return "calc(" + Math.min(pct, 100) + "% + 2px)";
    },
    ariaLabel: function (day) {
      return day.date + "，" + fmtNum(day.events) + " 起事件，" +
             fmtNum(day.messages) + " 条消息，" + fmtNum(day.memories) + " 条记忆";
    },
    onKey: function (event, index) {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const step = event.key === "ArrowRight" ? 1 : -1;
      const next = (index + step + this.series.length) % this.series.length;
      const cols = event.currentTarget.parentElement.querySelectorAll(".pulse-col");
      if (cols[next]) cols[next].focus();
      this.hovered = next;
    },
  },
  template: "#tpl-pulse-chart",
};

const AlertsPanel = {
  props: { alerts: { type: Array, default: function () { return []; } } },
  template: "#tpl-alerts-panel",
};

const KpiRow = {
  props: { items: { type: Array, default: function () { return []; } } },
  template: "#tpl-kpi-row",
};

const LlmPanel = {
  props: { llm: { type: Object, default: function () { return {}; } } },
  computed: {
    latencyText: function () {
      const ms = this.llm && this.llm.avg_latency_ms;
      if (ms == null) return "—";
      if (ms >= 1000) return (ms / 1000).toFixed(2) + "s";
      return ms + "ms";
    },
  },
  template: "#tpl-llm-panel",
};

const DistributionPanel = {
  props: { counts: { type: Object, default: function () { return {}; } } },
  computed: {
    web: function () {
      return Number((this.counts.web && this.counts.web.messages) || 0);
    },
    qq: function () {
      return Number((this.counts.qq && this.counts.qq.messages) || 0);
    },
    total: function () { return this.web + this.qq; },
    webPct: function () {
      if (!this.total) return 0;
      return Math.round(this.web * 1000 / this.total) / 10;
    },
    qqPct: function () {
      if (!this.total) return 0;
      return Math.round((100 - this.webPct) * 10) / 10;
    },
  },
  template: "#tpl-distribution-panel",
};

const QuickPanel = {

const MemoryList = {

const EventList = {

    sessions: { type: Array, default: function () { return []; } },
    botName: { type: String, default: "塔利" },
    todayCount: { type: Number, default: 0 },
  },
  methods: {
    eventLabel: function (type) {
      if (type === "message.received") return "收到";
      if (type === "message.sent") return "回复";
      if (type === "session.closed") return "结束";
      return type || "事件";
    },
    eventDot: function (type) {
      if (type === "message.received") return "recv";
      if (type === "message.sent") return "sent";
      if (type === "session.closed") return "closed";
      return "";
    },
    eventTime: function (ts) {
      if (!ts) return "—";
      const d = new Date(ts * 1000);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return clockOf(ts);
      return (d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + clockOf(ts);
    },
    fallbackText: function (ev) {
      return ev.type === "session.closed" ? "这条会话先搁下了" : "—";
    },
  },
  template: "#tpl-event-list",

/* ============================================================
   根应用
   ============================================================ */

const App = {
  components: {
    StatusStrip,
    TodayPanel,
    PulseChart,
    AlertsPanel,
    KpiRow,
    LlmPanel,
    DistributionPanel,
    QuickPanel,
    MemoryList,
    EventList,
    SessionList,
    SystemPanel,
  },

  setup: function () {
    const data = ref(null);
    const loading = ref(false);
    const error = ref("");
    const lastSync = ref(0);
    const metric = ref("events");
    const theme = ref(document.documentElement.getAttribute("data-theme") || "light");
    const drawerOpen = ref(false);
    const toast = ref({ show: false, text: "" });
    // 视口宽度要进响应式系统：否则从桌面拖到窄屏时，抽屉的 aria-expanded
    // 还停留在桌面态的 true，读屏会把"已展开"念给用户听。
    const narrow = ref(window.matchMedia("(max-width: 900px)").matches);

    let savedCollapsed = false;
    try {
      savedCollapsed = !narrow.value && localStorage.getItem(NAV_KEY) === "1";
    } catch (e) {}
    const sidebarCollapsed = ref(savedCollapsed);

    let refreshTimer = null;
    let toastTimer = null;

    const d = computed(function () { return data.value || emptyData(); });
    const botName = computed(function () { return d.value.bot.name || "塔利"; });
    const series = computed(function () { return d.value.series || []; });

    /* ---------- 页头 / 同步状态 ---------- */

    const headerSub = computed(function () {
      const now = d.value.now || Date.now() / 1000;
      return greeting(new Date(now * 1000).getHours()) + " · " +
             monthDay(now) + " " + weekday(now);
    });

    const syncText = computed(function () {
      if (loading.value) return data.value ? "同步中…" : "正在读取…";
      if (error.value) return data.value ? "刷新失败，显示上次数据" : "读取失败";
      if (lastSync.value) return "更新于 " + clockOf(lastSync.value);
      return "正在读取…";
    });
    const syncClass = computed(function () {
      return {
        syncing: loading.value,
        bad: !!error.value && !loading.value,
      };
    });

    const lifeText = computed(function () {
      if (error.value) return data.value ? "上次同步失败" : "连接失败";
      return data.value ? "运行中" : "连接中…";
    });
    const lifeClass = computed(function () {
      if (error.value) return "bad";
      return data.value ? "" : "warn";
    });

    /* ---------- 首屏 ---------- */

    const todayDeltaText = computed(function () {
      const n = Number(d.value.deltas.messages || 0);
      if (n === 0) return "与昨天持平";
      return "较昨天 " + signed(n);
    });
    const todayDeltaClass = computed(function () {
      const n = Number(d.value.deltas.messages || 0);
      if (n > 0) return "up";
      if (n < 0) return "down";
      return "flat";
    });

    const todaySummary = computed(function () {
      const t = d.value.today;
      if (!t.messages) return "今天还很安静——说句话，它就醒了。";
      const parts = ["今天有 " + fmtNum(t.events) + " 起事件"];
      parts.push(t.memories ? "新记住 " + fmtNum(t.memories) + " 件事" : "还没有新记忆");
      let text = parts.join("，") + "。";
      const first = d.value.recent_memories[0];
      if (first && t.memories) text += "最近记住「" + clip(first.content, 22) + "」。";
      return text;
    });

    const todayMini = computed(function () {
      const t = d.value.today;
      const c = d.value.counts;
      return [
        { label: "事件", value: t.events },
        { label: "记忆", value: t.memories },
        { label: "会话", value: c.sessions },
        { label: "网页", value: c.web_sessions },
      ];
    });

    /* ---------- 状态条 ---------- */

    const statusItems = computed(function () {
      if (!data.value) {
        const text = error.value ? "读取失败" : "连接中…";
        const level = error.value ? "bad" : "";
        return [
          { label: "服务", value: text, level: level, note: "", href: "/dashboard" },
          { label: "QQ", value: "—", level: "", note: "", href: "/settings" },
          { label: "模型", value: "—", level: "", note: "", href: "/settings" },
          { label: "记忆", value: "—", level: "", note: "", href: "/logs" },
        ];
      }

      const qq = qqView((d.value.platforms || {}).qq);
      const modelReady = !!d.value.llm_key_set && !!d.value.bot.model && !!d.value.bot.base_url;
      const mem = d.value.memory || {};
      const stalled = !!mem.last_at &&
        (Date.now() / 1000 - mem.last_at) > 48 * 3600 &&
        d.value.today.events > 0;

      return [
        {
          label: "服务", value: "运行中", level: "ok", note: "本机",
          href: "/logs", title: "Web 服务在跑；点开看实时日志",
        },
        {
          label: "QQ", value: qq.text, level: qq.level,
          note: qq.level === "ok" ? "SnowLuma" : "",
          href: "/settings", title: "QQ 平台状态与开关",
        },
        {
          label: "模型", value: d.value.bot.model || "未配置",
          level: modelReady ? "ok" : "bad",
          note: d.value.llm_key_set ? "密钥已设置" : "密钥未设置",
          href: "/settings", title: "模型与网关配置",
        },
        {
          label: "记忆", value: mem.last_at ? relTime(mem.last_at) : "未提炼",
          level: mem.last_at ? (stalled ? "warn" : "ok") : "warn",
          note: fmtNum(mem.active) + " 条",
          href: "/logs", title: "最近一次提炼记忆的时间",
        },
      ];
    });

    /* ---------- KPI / 分布 ---------- */

    const kpis = computed(function () {
      const c = d.value.counts;
      const del = d.value.deltas;
      const qqSessions = Number((d.value.platform_counts.qq || {}).sessions || 0);

      function cls(n) {
        if (n > 0) return "up";
        if (n < 0) return "down";
        return "flat";
      }

      return [
        {
          label: "会话", value: c.sessions,
          foot: "网页 " + fmtNum(c.web_sessions) + " · QQ " + fmtNum(qqSessions),
          footClass: "flat",
        },
        {
          label: "消息", value: c.messages,
          foot: "较昨天 " + signed(del.messages),
          footClass: cls(del.messages),
        },
        {
          label: "事件", value: c.events,
          foot: "较昨天 " + signed(del.events),
          footClass: cls(del.events),
        },
        {
          label: "记忆", value: c.memories,
          foot: "较昨天 " + signed(del.memories) +
            (c.memories_forgotten ? " · 遗忘 " + fmtNum(c.memories_forgotten) : ""),
          footClass: cls(del.memories),
        },
      ];
    });

    const alerts = computed(function () { return d.value.alerts || []; });
    const memories = computed(function () { return d.value.recent_memories || []; });
    const events = computed(function () { return d.value.recent_events || []; });
    const sessions = computed(function () { return d.value.sessions || []; });

    const sessionTitles = computed(function () {
      const map = {};
      sessions.value.forEach(function (s) {
        map[s.id] = s.title || s.id;
      });
      return map;
    });

    const isEmpty = computed(function () {
      const c = d.value.counts;
      return !c.messages && !c.events && sessions.value.length === 0;
    });

    const needsSetup = computed(function () {
      const bot = d.value.bot || {};
      return !d.value.llm_key_set || !bot.model || !bot.base_url;
    });

    const systemRows = computed(function () {
      const bot = d.value.bot || {};
      const qq = qqView((d.value.platforms || {}).qq);
      const mem = d.value.memory || {};
      const win = d.value.events_window || {};
      return [
        { label: "角色", value: bot.name || "塔利", title: bot.name || "" },
        { label: "模型", value: bot.model || "未配置", title: bot.model || "" },
        { label: "网关", value: bot.base_url || "未配置", title: bot.base_url || "" },
        { label: "密钥", value: d.value.llm_key_set ? "已设置" : "未设置" },
        { label: "QQ 服务", value: qq.text, status: qq.level },
        {
          label: "记忆",
          value: mem.last_at
            ? relTime(mem.last_at) + "（" + fmtNum(mem.active) + " 条）"
            : "还没有提炼",
        },
        { label: "存储", value: "SQLite + JSONL" },
        {
          label: "数据始于",
          value: win.first_at ? monthDay(win.first_at) + " " + clockOf(win.first_at) : "—",
        },
      ];
    });

    /* ---------- 数据加载 ---------- */

    function schedule() {
      clearTimeout(refreshTimer);
      // 页面在后台时不自转：省电，也免得回来看到一帧旧数据。
      // 回到前台由 onVisibility 重新排。
      if (document.hidden) return;
      refreshTimer = setTimeout(function () {
        load();
      }, REFRESH_MS);
    }

    async function load() {
      if (loading.value) return;
      clearTimeout(refreshTimer);
      loading.value = true;
      error.value = "";
      try {
        const json = await fetchOverview();
        data.value = json;
        lastSync.value = json.now || Date.now() / 1000;
      } catch (e) {
        if (e && e.name === "AbortError") {
          error.value = "请求超时（10 秒），服务可能正忙。";
        } else if (e instanceof TypeError) {
          error.value = "连不上服务：" + (e.message || "网络错误");
        } else {
          error.value = (e && e.message) || "读取失败";
        }
      } finally {
        loading.value = false;
        schedule();
      }
    }

    function onVisibility() {
      if (document.hidden) {
        clearTimeout(refreshTimer);
        return;
      }
      if (!data.value) {
        load();
        return;
      }
      if (Date.now() / 1000 - lastSync.value > REFRESH_MS / 1000) load();
      else schedule();
    }

    function onResize() {
      narrow.value = window.matchMedia("(max-width: 900px)").matches;
      if (!narrow.value && drawerOpen.value) {
        drawerOpen.value = false;
      }
    }

    function onKeydown(event) {
      if (event.key === "Escape" && drawerOpen.value) {
        closeDrawer();
        return;
      }
      if (event.key !== "r" && event.key !== "R") return;
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      load();
    }

    /* ---------- 侧栏 / 主题 ---------- */

    function isNarrow() {
      return narrow.value;
    }

    function toggleSidebar() {
      if (isNarrow()) {
        drawerOpen.value = !drawerOpen.value;
        return;
      }
      sidebarCollapsed.value = !sidebarCollapsed.value;
      try {
        localStorage.setItem(NAV_KEY, sidebarCollapsed.value ? "1" : "0");
      } catch (e) {}
    }

    function closeDrawer() {
      drawerOpen.value = false;
    }

    const sidebarAria = computed(function () {
      return isNarrow() ? String(drawerOpen.value) : String(!sidebarCollapsed.value);
    });

    function toggleTheme() {
      theme.value = theme.value === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme.value);
      try {
        localStorage.setItem(THEME_KEY, theme.value);
      } catch (e) {}
    }

    /* ---------- 摘要 / 会话 / 提示 ---------- */

    function showToast(text) {
      toast.value = { show: true, text: text };
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () {
        toast.value = { show: false, text: "" };
      }, 2200);
    }

    async function copySummary() {
      const current = data.value;
      if (!current) {
        showToast("数据还没读出来");
        return;
      }
      const lines = [
        monthDay(current.now) + " " + weekday(current.now),
        "今天和" + botName.value + "说了 " + fmtNum(current.today.messages) + " 句话，" +
          fmtNum(current.today.events) + " 起事件，新记住 " +
          fmtNum(current.today.memories) + " 件事。",
      ];
      if (current.alerts.length) {
        lines.push("待处理：" + current.alerts.map(function (a) { return a.title; }).join("；"));
      }
      if (current.recent_memories[0]) {
        lines.push("最近记住：「" + current.recent_memories[0].content + "」");
      }
      if (current.llm && current.llm.calls) {
        lines.push("模型调用 " + fmtNum(current.llm.calls) + " 次，成功率 " +
          (current.llm.success_rate == null ? "—" : current.llm.success_rate + "%") + "。");
      }
      const text = lines.join("\n");

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          showToast("今日摘要已复制");
          return;
        }
        throw new Error("no clipboard");
      } catch (e) {
        // 浏览器不给剪贴板权限时的退路：临时 textarea + execCommand
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch (err) {}
        ta.remove();
        showToast(ok ? "今日摘要已复制" : "复制失败，浏览器没给权限");
      }
    }

    function openSession(session) {
      try {
        localStorage.setItem("taleai.session_id", session.id);
      } catch (e) {}
      location.href = "/";
    }

    onMounted(function () {
      load();
      window.addEventListener("keydown", onKeydown);
      window.addEventListener("resize", onResize);
      document.addEventListener("visibilitychange", onVisibility);
    });

    onBeforeUnmount(function () {
      clearTimeout(refreshTimer);
      clearTimeout(toastTimer);
      window.removeEventListener("keydown", onKeydown);
      window.removeEventListener("resize", onResize);
      document.removeEventListener("visibilitychange", onVisibility);
    });

    return {
      d: d,
      data: data,
      loading: loading,
      error: error,
      metric: metric,
      theme: theme,
      toast: toast,
      drawerOpen: drawerOpen,
      sidebarCollapsed: sidebarCollapsed,
      sidebarAria: sidebarAria,
      headerSub: headerSub,
      syncText: syncText,
      syncClass: syncClass,
      lifeText: lifeText,
      lifeClass: lifeClass,
      botName: botName,
      series: series,
      statusItems: statusItems,
      todayDeltaText: todayDeltaText,
      todayDeltaClass: todayDeltaClass,
      todaySummary: todaySummary,
      todayMini: todayMini,
      kpis: kpis,
      alerts: alerts,
      memories: memories,
      events: events,
      sessions: sessions,
      sessionTitles: sessionTitles,
      isEmpty: isEmpty,

      systemRows: systemRows,

      closeDrawer: closeDrawer,

    };
  },
};

</script>
