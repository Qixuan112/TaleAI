<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔利 · 设置</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8a8a;
    --tale: #6b7fd7;
    --tale-soft: #eef0fb;
    --line: #e6e3dc;
    --ok: #5fbf7f;
    --bad: #d9534f;
    --shadow: 0 12px 36px rgba(43,43,43,.07);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #fbfaf7 0%, var(--bg) 55%);
    color: var(--ink);
    font: 15px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: var(--shadow);
  }
  header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .titles { display: flex; flex-direction: column; gap: 2px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }

  /* ---- 顶部导航：聊天 / 设置 / 日志（当前页高亮）---- */
  .nav {
    display: flex;
    gap: 2px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .nav a {
    padding: 8px 12px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .nav a:hover { color: var(--ink); }
  .nav a:focus-visible { outline: 2px solid var(--tale); outline-offset: 2px; border-radius: 4px; }
  .nav a.active { color: var(--tale); border-bottom-color: var(--tale); font-weight: 600; }

  main { flex: 1; overflow-y: auto; padding: 20px; }
  .empty { color: var(--muted); }

  fieldset {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin: 0 0 18px;
  }
  legend { font-size: 13px; font-weight: 600; color: var(--tale); padding: 0 6px; }

  .field { margin: 0 0 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: 500; }
  .field .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .field input[type=text],
  .field input[type=password],
  .field input[type=number],
  .field select {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font: inherit;
    color: inherit;
    outline: none;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input[type=number] { font-variant-numeric: tabular-nums; }
  .field input:hover, .field select:hover { border-color: #d8d4cb; }
  .field input:focus, .field select:focus {
    border-color: var(--tale);
    box-shadow: 0 0 0 3px var(--tale-soft);
  }
  .field input[type=checkbox] { width: auto; }

  /* ---- 吸底操作栏：滚动时始终够得着保存；有未保存改动时亮红点 ---- */
  .actions {
    display: flex; align-items: center; gap: 12px;
    position: sticky; bottom: 0; z-index: 5;
    margin: 20px -20px -20px;
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
    box-shadow: 0 -10px 24px rgba(43,43,43,.05);
  }
  .actions button {
    border: 0; background: var(--tale); color: #fff;
    padding: 10px 22px; border-radius: 10px; font: inherit; cursor: pointer;
    min-width: 96px;
    box-shadow: 0 4px 12px rgba(107,127,215,.25);
    transition: background .15s, transform .12s, box-shadow .15s, opacity .15s;
  }
  .actions button:hover:not(:disabled) { background: #5f73cf; transform: translateY(-1px); }
  .actions button:active:not(:disabled) { transform: translateY(0); }
  .actions button:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--tale-soft), 0 4px 12px rgba(107,127,215,.25);
  }
  .actions button:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .actions .dirty-hint {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .actions .hint-text { display: none; }
  .actions.dirty .hint-text { display: inline; }
  .actions .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--bad); display: none;
  }
  .actions.dirty .dot { display: inline-block; }
  .result {
    flex: 1; min-width: 0; font-size: 13px;
    opacity: 0; transition: opacity .2s;
  }
  .result.show { opacity: 1; }
  .result.ok { color: var(--ok); }
  .result.bad { color: var(--bad); }

  /* ---- 加载骨架：首屏别只留一行"加载中…" ---- */
  .skeleton {
    height: 58px; border-radius: 12px; margin: 0 0 14px;
    background: linear-gradient(90deg, #f1efe9 25%, #f8f7f3 37%, #f1efe9 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  /* ---- 抽屉分组：标题条常驻，内容向下滑出 / 收起 ---- */
  .drawer {
    border: 1px solid var(--line); border-radius: 12px; margin: 0 0 14px;
    overflow: hidden; transition: border-color .15s, box-shadow .15s;
  }
  .drawer:hover { border-color: #dcd8cf; }
  .drawer-head {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 12px 16px; border: 0; background: var(--panel);
    font: inherit; font-size: 13px; font-weight: 600; color: var(--tale); cursor: pointer;
    transition: background .15s;
  }
  .drawer-head:hover, .drawer-head:focus-visible { background: #fbfaf7; outline: none; }
  .drawer-head .caret { color: var(--muted); transition: transform .2s; }
  .drawer.collapsed .caret { transform: rotate(-90deg); }
  .drawer-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .25s ease; }
  .drawer.collapsed .drawer-body { grid-template-rows: 0fr; }
  .drawer-inner { overflow: hidden; min-height: 0; }
  .drawer-pad { padding: 2px 16px 14px; }

  /* ---- QQ 服务：开关 + 状态 ---- */
  .qq-row { display: flex; align-items: center; gap: 12px; }
  .qq-row label { margin: 0; }
  .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex: none; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; inset: 0; background: #c9c9c9; border-radius: 26px;
    transition: background .2s;
  }
  .switch .slider::before {
    content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform .2s;
  }
  .switch input:checked + .slider { background: var(--ok); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .switch input:disabled + .slider { opacity: .6; }
  .qq-status { font-size: 13px; color: var(--muted); }

  /* ---- 顶部黄色告示条（QQ 启动失败时显示：#滚动字 + #重试）---- */
  .banner {
    display: flex; align-items: center; gap: 10px;
    margin: 14px 20px 0; padding: 8px 12px;
    background: #fff6d8; border: 1px solid #e8d48a; border-radius: 10px;
    overflow: hidden;
  }
  .banner[hidden] { display: none; }
  .ticker-wrap { flex: 1; overflow: hidden; white-space: nowrap; }
  .ticker {
    display: inline-block; padding-left: 100%;
    animation: ticker 14s linear infinite;
    font-size: 13px; color: #8a6d1a;
  }
  @keyframes ticker { to { transform: translateX(-100%); } }
  .banner button {
    flex: none; border: 1px solid #d9bd63; background: #fffdf2; color: #8a6d1a;
    padding: 4px 12px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="titles">
      <h1>塔利 · 设置</h1>
      <span class="sub">改完保存，下一句对话生效</span>
    </div>
    <span class="spacer"></span>
  </header>

  <nav class="nav">
    <a href="/">聊天</a>
    <a class="active" href="/settings">设置</a>
    <a href="/logs">日志</a>
  </nav>

  <div class="banner" id="banner" hidden>
    <span class="ticker-wrap"><span class="ticker" id="bannerText"></span></span>
    <button id="bannerRetry" type="button">重试</button>
  </div>

  <main id="body">
    <p class="empty" id="placeholder">加载中…</p>
  </main>
</div>

<script>
// 一律用 textContent 写入文本、用 createElement 造节点——不把内容拼进 HTML 字符串
// （跟 index/logs 同一条 XSS 纪律）。
//
// 表单**由字段定义驱动**：拉 /api/settings/fields 拿到每个字段的 key/label/type，
// 据此渲染；拉 /api/settings/values 填初值。加配置项只改后端 config/fields.py，
// 这个页面自动跟着变——不在这里硬编码任何字段名。
//
// 每个分组是一个"抽屉"（可折叠区块：点标题滑出/收起）；"QQ 服务"是本页
// 第一个手写区块（开关 + 状态 + 失败告示条）——表单之外的**运行控制**住这里。

var bodyEl = document.getElementById("body");

// 首屏骨架：三个抽屉形状的占位，比一行"加载中…"更像"马上就好"
(function showSkeleton() {
  for (var i = 0; i < 3; i++) bodyEl.appendChild(el("div", "skeleton"));
})();

// 要展示的域（本批范围：config 全部 + secrets 的密钥）。
// 顺序即页面上的分组顺序。
var DOMAINS = [
  { domain: "config", title: "模型与行为" },
  { domain: "secrets", title: "密钥" }
];

// 每个字段的输入控件记在这里：key → (读值/写值)
var controls = {};

// 保存基线：key → 初始值字符串。用来判断"有没有未保存的改动"。
var baseline = {};
var actionsEl = null, saveBtn = null, resultEl = null, saving = false;

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function makeControl(spec, value) {
  var wrap = el("div", "field");
  var lab = el("label", null, spec.label);
  wrap.appendChild(lab);

  var input;
  if (spec.type === "select") {
    input = document.createElement("select");
    (spec.choices || []).forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      input.appendChild(opt);
    });
    input.value = value;
  } else if (spec.type === "bool") {
    input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!value;
    input.style.width = "auto";
  } else if (spec.type === "password") {
    input = document.createElement("input");
    input.type = "password";
    // 密钥不回明文：只提示"已设置/未设置"，留空 = 不改
    input.placeholder = (value && value.set) ? "已设置（留空则不修改）" : "未设置";
    input.value = "";
  } else if (spec.type === "number") {
    input = document.createElement("input");
    input.type = "number";
    input.value = (value == null ? "" : value);
  } else {
    input = document.createElement("input");
    input.type = "text";
    // list 默认值（wake.words）在面板里是逗号分隔的文本框
    if (Array.isArray(value)) input.value = value.join(", ");
    else input.value = (value == null ? "" : value);
  }
  wrap.appendChild(input);
  if (spec.help) wrap.appendChild(el("div", "help", spec.help));

  controls[spec.domain + "|" + spec.key] = {
    spec: spec,
    input: input,
    read: function () {
      if (spec.type === "bool") return input.checked;
      if (spec.type === "password") return input.value;   // 空 = 不动
      return input.value;
    },
    // 把当前值写回控件（原地刷新用，不重建 DOM）
    apply: function (value) {
      if (spec.type === "bool") { input.checked = !!value; return; }
      if (spec.type === "password") {
        input.placeholder = (value && value.set) ? "已设置（留空则不修改）" : "未设置";
        input.value = "";
        return;
      }
      if (Array.isArray(value)) input.value = value.join(", ");
      else input.value = (value == null ? "" : value);
    }
  };

  // 整数配置用 step=1，避免出现 10.5 这种"看起来能填"的值
  if (spec.type === "number" && typeof spec.default === "number") {
    input.step = Number.isInteger(spec.default) ? "1" : "any";
  }
  input.addEventListener("input", onEdit);
  input.addEventListener("change", onEdit);
  return wrap;
}

// ---------- 未保存改动：按钮状态 / 离开提醒 / Ctrl+S ----------

function onEdit() {
  if (resultEl) { resultEl.className = "result"; resultEl.textContent = ""; }
  updateDirtyUI();
}

function isDirty() {
  return Object.keys(controls).some(function (k) {
    var c = controls[k];
    // 密钥框留空 = "不修改"，不算改动
    if (c.spec.type === "password") return c.input.value !== "";
    return String(c.read()) !== baseline[k];
  });
}

function snapshotBaseline() {
  baseline = {};
  Object.keys(controls).forEach(function (k) {
    var c = controls[k];
    baseline[k] = c.spec.type === "password" ? "" : String(c.read());
  });
}

function updateDirtyUI() {
  var dirty = isDirty();
  if (actionsEl) actionsEl.classList.toggle("dirty", dirty);
  if (saveBtn) {
    saveBtn.disabled = saving || !dirty;
    saveBtn.textContent = saving ? "保存中…" : (dirty ? "保存改动" : "保存");
    saveBtn.setAttribute("aria-busy", saving ? "true" : "false");
  }
}

function makeDrawer(title) {
  var sec = el("section", "drawer");
  var head = el("button", "drawer-head");
  head.type = "button";
  head.appendChild(el("span", null, title));
  head.appendChild(el("span", "caret", "▾"));
  var body = el("div", "drawer-body");
  var inner = el("div", "drawer-inner");
  var pad = el("div", "drawer-pad");
  inner.appendChild(pad);
  body.appendChild(inner);
  sec.appendChild(head);
  sec.appendChild(body);
  head.addEventListener("click", function () {
    var collapsed = sec.classList.toggle("collapsed");
    head.setAttribute("aria-expanded", String(!collapsed));
  });
  head.setAttribute("aria-expanded", "true");
  return { section: sec, pad: pad };
}

// ---- QQ 服务抽屉（运行控制：开关 + 状态 + 失败告示条）----
var qqSwitchEl = null;
var qqStatusEl = null;

function qqStatusText(st) {
  if (st.state === "running") {
    return st.connected ? "运行中 · SnowLuma 已连接" : "运行中 · 等待 SnowLuma 连接";
  }
  if (st.state === "starting") return "启动中…";
  if (st.state === "failed") return "启动失败（原因见上方告示条）";
  return "已停止";
}

function renderQQ(st) {
  if (qqSwitchEl) qqSwitchEl.checked = !!st.enabled;
  if (qqStatusEl) qqStatusEl.textContent = qqStatusText(st);
  var banner = document.getElementById("banner");
  var text = document.getElementById("bannerText");
  if (st.state === "failed") {
    // 滚动字展示"跳闸"原因；开关本身保持用户意图（不自动弹回）
    text.textContent = "QQ 服务启动失败：" + (st.detail || "未知原因") + " —— 处理后可点右侧「重试」";
    banner.hidden = false;
  } else {
    banner.hidden = true;
  }
}

function loadQQ() {
  getJSON("/api/platforms/qq").then(renderQQ).catch(function () {});
}

function postQQ(enabled) {
  return fetch("/api/platforms/qq", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enabled: enabled })
  }).then(function (r) { return r.json(); }).then(renderQQ);
}

function buildQQDrawer() {
  var d = makeDrawer("QQ 服务");

  var row = el("div", "field qq-row");
  row.appendChild(el("label", null, "QQ 适配器"));
  var sw = document.createElement("label");
  sw.className = "switch";
  var cb = document.createElement("input");
  cb.type = "checkbox";
  sw.appendChild(cb);
  sw.appendChild(el("span", "slider"));
  row.appendChild(sw);
  qqSwitchEl = cb;

  qqStatusEl = el("span", "qq-status", "加载中…");
  row.appendChild(qqStatusEl);
  d.pad.appendChild(row);
  d.pad.appendChild(el("div", "help",
    "开 = 启动反向 WS 服务（等 SnowLuma 连入）；关 = 停止。启动失败时页面顶部出告示条，可重试。"));
  d.pad.appendChild(el("div", "help",
    "改动 platforms 的 host / port / token 后，关一下再开即生效。"));

  cb.addEventListener("change", function () {
    cb.disabled = true;
    postQQ(cb.checked).catch(function () {}).finally(function () { cb.disabled = false; });
  });
  return d.section;
}

function getJSON(url) {
  return fetch(url).then(function (r) { return r.json(); });
}

function renderAll() {
  var jobs = DOMAINS.map(function (d) {
    return Promise.all([
      getJSON("/api/settings/fields?domain=" + encodeURIComponent(d.domain)),
      getJSON("/api/settings/values?domain=" + encodeURIComponent(d.domain))
    ]).then(function (res) { return { d: d, fields: res[0], values: res[1] }; });
  });
  return Promise.all(jobs);
}

function buildForm(groups) {
  bodyEl.textContent = "";   // 清空（清空不算塞内容）
  controls = {};

  groups.forEach(function (g) {
    if (!g.fields.ok) {
      bodyEl.appendChild(el("p", "empty", "域 " + g.d.domain + " 读取失败：" + (g.fields.error || "")));
      return;
    }
    var d = makeDrawer(g.d.title);
    g.fields.fields.forEach(function (spec) {
      spec.domain = g.d.domain;
      var v = g.values.values ? g.values.values[spec.key] : spec.default;
      d.pad.appendChild(makeControl(spec, v));
    });
    bodyEl.appendChild(d.section);
  });

  bodyEl.appendChild(buildQQDrawer());

  actionsEl = el("div", "actions");
  saveBtn = el("button", null, "保存");
  saveBtn.type = "button";
  var dirtyHint = el("span", "dirty-hint");
  dirtyHint.appendChild(el("span", "dot"));
  dirtyHint.appendChild(el("span", "hint-text", "有未保存的改动"));
  resultEl = el("span", "result");
  resultEl.setAttribute("aria-live", "polite");
  actionsEl.appendChild(saveBtn);
  actionsEl.appendChild(dirtyHint);
  actionsEl.appendChild(resultEl);
  bodyEl.appendChild(actionsEl);

  saveBtn.addEventListener("click", save);
  snapshotBaseline();
  updateDirtyUI();
}

function save() {
  if (saving) return;
  saving = true;
  updateDirtyUI();
  resultEl.className = "result show";
  resultEl.textContent = "保存中…";

  // 按域分组提交（两个域两次 POST）
  var byDomain = {};
  Object.keys(controls).forEach(function (k) {
    var c = controls[k];
    var domain = c.spec.domain;
    (byDomain[domain] = byDomain[domain] || {})[c.spec.key] = c.read();
  });

  var posts = Object.keys(byDomain).map(function (domain) {
    return fetch("/api/settings/values", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ domain: domain, values: byDomain[domain] })
    }).then(function (r) { return r.json().then(function (j) { return { domain: domain, j: j }; }); });
  });

  Promise.all(posts).then(function (results) {
    var bad = results.filter(function (r) { return !r.j.ok; });
    if (bad.length) {
      saving = false;
      updateDirtyUI();
      resultEl.className = "result show bad";
      resultEl.textContent = "保存失败：" + (bad[0].j.error || "未知错误");
      return;
    }
    resultEl.className = "result show ok";
    resultEl.textContent = "已保存。" + ((results[0].j && results[0].j.note) || "");
    // 原地刷新值（密钥打码状态、list 归一后的样子），**不重建 DOM**——
    // 重建会把上面这条 result 元素一起换掉，回执就没了；原地刷新还能保住焦点。
    // 刷新完再重设基线：此时"已保存"与磁盘一致，按钮回到禁用态。
    refreshValues().then(function () {
      snapshotBaseline();
      saving = false;
      updateDirtyUI();
    });
  }).catch(function (e) {
    saving = false;
    updateDirtyUI();
    resultEl.className = "result show bad";
    resultEl.textContent = "网络错误：" + e;
  });
}

// 重新拉一遍各域的值，写回已有控件（不动页面结构）。
function refreshValues() {
  return Promise.all(DOMAINS.map(function (d) {
    return getJSON("/api/settings/values?domain=" + encodeURIComponent(d.domain)).then(function (res) {
      if (!res.ok || !res.values) return;
      Object.keys(res.values).forEach(function (key) {
        var c = controls[d.domain + "|" + key];
        if (c) c.apply(res.values[key]);
      });
    }).catch(function () {});
  }));
}

document.getElementById("bannerRetry").addEventListener("click", function () {
  postQQ(true).catch(function () {});
});

// 有未保存改动时，关页面/刷新先拦一下（浏览器只显示自己的通用文案）
window.addEventListener("beforeunload", function (e) {
  if (!isDirty()) return;
  e.preventDefault();
  e.returnValue = "";
});

// Ctrl/Cmd + S 保存（与按钮同一套防重复提交逻辑）
document.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
    e.preventDefault();
    if (saveBtn && !saveBtn.disabled) save();
  }
});

renderAll().then(buildForm).then(loadQQ).catch(function (e) {
  bodyEl.textContent = "";
  bodyEl.appendChild(el("p", "empty", "加载设置失败：" + e));
});
</script>
</body>
</html>
