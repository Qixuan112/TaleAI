<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔利 · 设置</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8a8a;
    --tale: #6b7fd7;
    --tale-soft: #eef0fb;
    --line: #e6e3dc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(0,0,0,.05);
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }

  /* ---- 顶部导航：聊天 / 设置 / 日志（当前页高亮）---- */
  .nav {
    display: flex;
    gap: 2px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .nav a {
    padding: 8px 12px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .nav a:hover { color: var(--ink); }
  .nav a.active { color: var(--tale); border-bottom-color: var(--tale); font-weight: 600; }

  main { flex: 1; overflow-y: auto; padding: 20px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>塔利 · 设置</h1>
    <span class="spacer"></span>
  </header>

  <nav class="nav">
    <a href="/">聊天</a>
    <a class="active" href="/settings">设置</a>
    <a href="/logs">日志</a>
  </nav>

  <main id="body">
    <!-- UX-05 在这里按 /api/settings/fields 自动渲染表单。 -->
    <p class="empty" id="placeholder">配置面板施工中…</p>
  </main>
</div>

<script>
// 只在 index/logs 同一条纪律下工作：内容一律用 textContent 写入，不拼 HTML 字符串。
//
// UX-05 会在这里 fetch("/api/settings/fields")，按返回的字段定义渲染表单，
// 读 /api/settings/values 填初值，写回走 POST /api/settings/values。
// UX-01 只落页面骨架与导航，故此处暂不发起请求。
</script>
</body>
</html>
