<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔利 · TaleAI</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8a8a;
    --tale: #6b7fd7;
    --tale-soft: #eef0fb;
    --me: #f0efe9;
    --line: #e6e3dc;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(0,0,0,.05);
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: var(--muted); }
  header .status.ok::before { content: "● "; color: #5fbf7f; }
  header .status.off::before { content: "● "; color: #d98b8b; }
  header .spacer { flex: 1; }

  /* ---- 顶部导航：聊天 / 设置 / 日志（当前页高亮）---- */
  .nav {
    display: flex;
    gap: 2px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .nav a {
    padding: 8px 12px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .nav a:hover { color: var(--ink); }
  .nav a.active { color: var(--tale); border-bottom-color: var(--tale); font-weight: 600; }

  /* ---- 核弹发射钮：3D 红钮嵌在金属底座里，外裹黄黑警示带 ---- */
  .nuke {
    --nuke: #d21f1f;            /* 钮面主红 */
    --nuke-hi: #ff6a58;         /* 高光红 */
    --nuke-dk: #6e0b0b;         /* 暗部 */
    position: relative;
    width: 46px; height: 46px; padding: 0;
    border: 2px solid #260707;
    border-radius: 50%;
    cursor: pointer;
    /* 底座：上方受光的金属碗，外圈一道亮边（光从上方来） */
    background: radial-gradient(circle at 50% 34%,
                #5c1616 0 44%, #330b0b 60%, #170404 80%, #2c0909 88%, #7a2626 100%);
    box-shadow:
      inset 0 3px 3px rgba(255,255,255,.22),   /* 上内缘亮 */
      inset 0 -4px 8px rgba(0,0,0,.75),        /* 下内缘暗 */
      inset 0 0 0 2px rgba(0,0,0,.35),
      0 3px 6px rgba(0,0,0,.5),                /* 落地投影 */
      0 7px 16px rgba(0,0,0,.32);
    transition: transform .09s cubic-bezier(.3,.7,.4,1.2);
  }

  /* 黄黑警示带：45° 斜条 + 顶部光泽/底部压暗，做成有倒角的立体环 */
  .nuke::before {
    content: "";
    position: absolute; inset: -7px;
    border-radius: 50%;
    /* 上层：顶部高光 → 底部阴影的球面罩；下层：斜条纹 */
    background:
      radial-gradient(circle at 50% 26%,
                      rgba(255,255,255,.42) 0%, rgba(255,255,255,0) 46%,
                      rgba(0,0,0,.5) 100%),
      repeating-linear-gradient(45deg, #f5c518 0 9px, #141414 9px 18px);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.35),
      inset 0 -2px 4px rgba(0,0,0,.55),
      0 1px 3px rgba(0,0,0,.55),
      0 0 0 1.5px #0d0d0d;
    /* 挖空中心：露出钮面，只留环带（数值 = 钮半径 23 + 边框 2 = 25） */
    -webkit-mask: radial-gradient(circle, transparent 0 25px, #000 25px);
            mask: radial-gradient(circle, transparent 0 25px, #000 25px);
  }
  .nuke:focus-visible { outline: 3px solid #ffb4a8; outline-offset: 6px; }

  /* 钮盘：玻璃圆顶，嵌在底座里。待机时极缓呼吸，像通电待命 */
  .nuke .cap {
    position: absolute; inset: 8px; border-radius: 50%;
    background: radial-gradient(circle at 50% 30%,
                #ff9a86 0%, var(--nuke-hi) 20%, var(--nuke) 54%, var(--nuke-dk) 100%);
    box-shadow:
      inset 0 4px 5px rgba(255,255,255,.6),    /* 顶缘高光 */
      inset 0 -8px 11px rgba(0,0,0,.55),       /* 底部压暗 */
      inset 0 0 0 1px rgba(0,0,0,.25),
      0 3px 6px rgba(0,0,0,.5),                /* 圆顶投进碗里的影 */
      0 0 9px rgba(210,31,31,.7);
    transition: transform .09s cubic-bezier(.3,.7,.4,1.2),
                box-shadow .12s ease, filter .12s ease;
    animation: nuke-swell 2.4s ease-in-out infinite;
  }
  /* 玻璃反光：左上一道弧形高光片，圆顶的"立体灵魂" */
  .nuke .cap::after {
    content: "";
    position: absolute; left: 17%; top: 9%; width: 52%; height: 34%;
    border-radius: 50%;
    background: linear-gradient(to bottom,
                rgba(255,255,255,.9), rgba(255,255,255,0));
    filter: blur(1px);
    pointer-events: none;
  }
  .nuke:hover .cap { filter: brightness(1.12); }

  /* 按下：钮盘下沉进底座、发光收敛、整体微缩——"真的压进去了" */
  .nuke:active { transform: scale(.95); }
  .nuke:active .cap {
    animation: none;
    transform: translateY(3px) scale(.86);
    filter: brightness(.9);
    box-shadow:
      inset 0 5px 9px rgba(0,0,0,.85),
      inset 0 -2px 3px rgba(0,0,0,.4),
      inset 0 0 0 1px rgba(0,0,0,.3),
      0 1px 2px rgba(0,0,0,.4),
      0 0 5px rgba(210,31,31,.45);
  }
  .nuke:disabled { filter: grayscale(.6) brightness(.8); cursor: default; }
  .nuke:disabled .cap { animation: none; }
  /* 待发状态：第一下按过后，警示环急闪红——"再按一下就真发射了" */
  .nuke.armed::before {
    background:
      radial-gradient(circle at 50% 26%,
                      rgba(255,255,255,.4) 0%, rgba(255,255,255,0) 46%,
                      rgba(0,0,0,.5) 100%),
      repeating-linear-gradient(45deg, #ff3b2f 0 9px, #100000 9px 18px);
    animation: nuke-alarm .5s steps(2, jump-none) infinite;
  }
  .nuke.armed .cap {
    animation: none;
    box-shadow:
      inset 0 4px 5px rgba(255,255,255,.6),
      inset 0 -8px 11px rgba(0,0,0,.55),
      0 3px 6px rgba(0,0,0,.5),
      0 0 24px rgba(255,40,40,1);
  }
  @keyframes nuke-alarm {
    0%, 100% { filter: none; }
    50%      { filter: brightness(1.5) saturate(1.4); }
  }
  @keyframes nuke-swell {
    0%, 100% { box-shadow: inset 0 4px 5px rgba(255,255,255,.6),
                            inset 0 -8px 11px rgba(0,0,0,.55),
                            inset 0 0 0 1px rgba(0,0,0,.25),
                            0 3px 6px rgba(0,0,0,.5),
                            0 0 8px rgba(210,31,31,.5); }
    50%      { box-shadow: inset 0 4px 5px rgba(255,255,255,.6),
                            inset 0 -8px 11px rgba(0,0,0,.55),
                            inset 0 0 0 1px rgba(0,0,0,.25),
                            0 3px 6px rgba(0,0,0,.5),
                            0 0 20px rgba(255,90,77,.95); }
  }
  @media (prefers-reduced-motion: reduce) { .nuke .cap { animation: none; } }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.tale .bubble { background: var(--tale-soft); border-top-left-radius: 4px; }
  .row.me .bubble { background: var(--me); border-top-right-radius: 4px; }
  .meta { font-size: 11px; color: var(--muted); margin: 4px 2px 0; }
  .tool-note {
    align-self: center;
    font-size: 12px;
    color: var(--muted);
    background: #faf9f6;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 12px;
  }

  /* ---- 图片附件（UX-07）---- */
  /* 待发缩略图条：在消息区和输入框之间 */
  .thumbs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 16px 0;
  }
  .thumbs:empty { display: none; }   /* 没图就不占位 */
  .thumb {
    position: relative;
    width: 64px; height: 64px;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: #faf9f6;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .rm {
    position: absolute; top: 2px; right: 2px;
    width: 18px; height: 18px; padding: 0;
    border: 0; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 12px; line-height: 18px; text-align: center; cursor: pointer;
  }
  .thumb .rm:hover { background: rgba(0,0,0,.85); }
  /* 气泡里的图：限宽限高，不撑破布局 */
  .bubble img {
    display: block; max-width: 100%; max-height: 260px;
    border-radius: 8px; margin: 4px 0;
  }
  .attach {
    border: 0; background: transparent; color: var(--muted);
    font-size: 20px; line-height: 1; cursor: pointer; padding: 0 6px;
    align-self: center;
  }
  .attach:hover { color: var(--tale); }

  form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  textarea {
    flex: 1;
    resize: none;
    height: 46px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    font: inherit;
    color: inherit;
    outline: none;
  }
  textarea:focus { border-color: var(--tale); }
  button {
    border: 0;
    background: var(--tale);
    color: #fff;
    padding: 0 20px;
    border-radius: 12px;
    font: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>塔利</h1>
    <span id="status" class="status off">连接中…</span>
    <span class="spacer"></span>
    <button id="clear" class="nuke" type="button"
            aria-label="清空本次聊天历史" title="清空本次聊天历史">
      <span class="cap"></span>
    </button>
  </header>

  <nav class="nav">
    <a class="active" href="/">聊天</a>
    <a href="/settings">设置</a>
    <a href="/logs">日志</a>
  </nav>

  <div id="messages"></div>

  <div id="thumbs" class="thumbs"></div>
  <form id="composer">
    <button id="attach" class="attach" type="button" title="添加图片（也可直接粘贴）">＋</button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <textarea id="input" placeholder="跟塔利说点什么…" autofocus></textarea>
    <button id="send" type="submit">发送</button>
  </form>
</div>

<script>
// ---- 会话 ID：存 localStorage -------------------------------------------------
// 刷新页面会重连，带上同一个 session_id，历史才接得上（M0 验收⑤）。
function sessionId() {
  var k = "taleai.session_id";
  var v = localStorage.getItem(k);
  if (!v) {
    v = "web:" + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8)
                                     : Math.random().toString(36).slice(2, 10));
    localStorage.setItem(k, v);
  }
  return v;
}
var SID = sessionId();

// ---- DOM ---------------------------------------------------------------------
var messagesEl = document.getElementById("messages");
var formEl = document.getElementById("composer");
var inputEl = document.getElementById("input");
var sendEl = document.getElementById("send");
var statusEl = document.getElementById("status");
var clearEl = document.getElementById("clear");
var thumbsEl = document.getElementById("thumbs");
var attachEl = document.getElementById("attach");
var fileEl = document.getElementById("file");

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.className = "status " + (ok ? "ok" : "off");
}

// 一律用 textContent——绝不把内容塞 innerHTML，否则是 XSS 口子。
// images（可选）是**服务端文件名**列表（自己上传的，可信），用 <img src> 显示；
// 即便如此也走 createElement + .src，不拼 HTML 字符串。
function addBubble(text, who, images) {
  var row = document.createElement("div");
  row.className = "row " + who;
  var bubble = document.createElement("div");
  bubble.className = "bubble";
  if (text) bubble.appendChild(document.createTextNode(text));
  (images || []).forEach(function (name) {
    var img = document.createElement("img");
    img.src = "/api/img/" + encodeURIComponent(name);
    img.alt = "图片";
    // 图可能已被回收（data/temp 超限删最早）——显示占位而不是裂图
    img.onerror = function () {
      var ph = document.createElement("span");
      ph.textContent = "〔图片已不可用〕";
      ph.style.color = "var(--muted)";
      img.replaceWith(ph);
    };
    bubble.appendChild(img);
  });
  if (!bubble.childNodes.length) bubble.textContent = "";
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addToolNote(count) {
  var note = document.createElement("div");
  note.className = "tool-note";
  note.textContent = "〔塔利调用了 " + count + " 次工具〕";
  messagesEl.appendChild(note);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// 居中的一条系统提示（清空回执之类），跟工具提示同一视觉层级
function addSystemNote(text) {
  var note = document.createElement("div");
  note.className = "tool-note";
  note.textContent = "〔" + text + "〕";
  messagesEl.appendChild(note);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ---- WebSocket ---------------------------------------------------------------
var ws = null;
var pending = null;   // 等待回复时占位的那条气泡

// ---- 分条渲染：模拟真人打字 --------------------------------------------------
// 一条回复可能分好几条（先应一声、再答正文）。QQ 是在服务端逐条发、条间 sleep
// （见 src/core/adapter/pacing.py）；WebUI 这边整包一次到达，所以在**渲染时**补上
// 同样的节奏——第一条立即出现，之后每条等"真人打这么多字"的时间。
//
// 公式与 pacing.py 保持一致（那是权威定义，改一处要同步另一处）：
//   延迟 = 下一条字符数 × 0.22 秒 + 随机抖动，夹在 0.4 ~ 4.0 秒之间
// 停顿取决于**下一条有多长**——刚说完一句短的、下一句长，就多等一会儿；
// 随机量让同样字数的两条也不会停出一模一样的间隔。
var TYPING_PER_CHAR = 0.22;   // 每字 0.22 秒 ≈ 每秒 4.5 字
var TYPING_JITTER = 0.5;      // 抖动上限（秒）
var TYPING_MIN = 0.4;
var TYPING_MAX = 4.0;

function typingDelayMs(text) {
  var d = (text || "").length * TYPING_PER_CHAR + Math.random() * TYPING_JITTER;
  return Math.max(TYPING_MIN, Math.min(TYPING_MAX, d)) * 1000;
}

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// 渲染链：连续的回复帧排队渲染——上一条还在停顿、下一条就插进来会乱序
var renderChain = Promise.resolve();
function enqueueRender(data) {
  renderChain = renderChain.then(function () { return renderReply(data); });
}

async function renderReply(data) {
  var msgs = data.messages || [];
  // 重置回执（后端命令层 &newtale 的结果）：先抹掉页面上的旧气泡，再回执。
  // 跟后端"忘掉线之前"保持一致——记忆和界面看到的是同一段。不回执出气泡
  // （走系统提示），跟清空按钮的观感统一。
  if (data.stop_reason === "reset") {
    if (pending) { pending.remove(); pending = null; }
    messagesEl.innerHTML = "";
    sendEl.disabled = false;
    inputEl.focus();
    (msgs.length ? msgs : ["已重置"]).forEach(function (m) { addSystemNote(m); });
    return;
  }
  // 回复到了：先把"在想…"占位换成第一条，并立刻恢复输入——
  // 别让用户等所有气泡都敲完才轮到打字（真人聊天也不会这么等）
  if (pending) { pending.remove(); pending = null; }
  if (msgs.length) addBubble(msgs[0], "tale");
  sendEl.disabled = false;
  inputEl.focus();
  // 之后每条按真人打字节奏陆续出现
  for (var i = 1; i < msgs.length; i++) {
    await sleep(typingDelayMs(msgs[i]));
    addBubble(msgs[i], "tale");
  }
  if (data.tool_calls_made > 0) addToolNote(data.tool_calls_made);
  if (data.stop_reason && data.stop_reason !== "ok") {
    var meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "（结束原因：" + data.stop_reason + "）";
    messagesEl.appendChild(meta);
  }
}

function connect() {
  var proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(proto + "//" + location.host + "/ws?session_id=" + encodeURIComponent(SID));

  ws.onopen = function () {
    setStatus("已连接", true);
    sendEl.disabled = false;
  };
  ws.onclose = function () {
    setStatus("已断开，重连中…", false);
    sendEl.disabled = true;
    clearEl.disabled = false;   // 别让清空钮卡在禁用（发送时禁的）
    disarm();
    setTimeout(connect, 1500);   // 断线自动重连
  };
  ws.onerror = function () { setStatus("连接出错", false); };

  ws.onmessage = function (ev) {
    var data = JSON.parse(ev.data);

    // 历史帧：连上时服务端补发的旧消息，一次性渲染（刷新后历史完整的关键）。
    // 带图的消息 history_provider 会给 images 列表，一并渲染（UX-07）。
    if (data.type === "history") {
      messagesEl.innerHTML = "";
      (data.messages || []).forEach(function (m) {
        var who = m.role === "user" ? "me" : "tale";
        // 带图的消息 m.images 有值（UX-07），一并渲染。
        // assistant 行若带了分条数组（parts），每条一个气泡——否则刷新后
        // 一次多段的回复会挤成一个气泡。旧行/用户消息没有 parts，回落单气泡。
        // 图挂在**最后一条**上（图是随提问发的，不是分条内容的一部分）。
        if (m.parts && m.parts.length) {
          m.parts.forEach(function (p, i) {
            addBubble(p, who, i === m.parts.length - 1 ? m.images : null);
          });
        } else {
          addBubble(m.content, who, m.images);
        }
      });
      return;
    }

    // 清空回执：服务端删完库，前端把气泡一并抹掉
    if (data.type === "cleared") {
      messagesEl.innerHTML = "";
      clearEl.disabled = false;
      disarm();   // 发射完，退出待发状态
      if (!data.ok) {
        addSystemNote("清空失败，再看看日志");
      } else if (!data.deleted) {
        addSystemNote("本来就没有历史");
      } else {
        addSystemNote("已清空 " + data.deleted + " 条，重新开始");
      }
      return;
    }

    // 每条 <msg> 单独一个气泡，按真人打字节奏逐条出现（见 renderReply）。
    // 排队渲染：连着来两条回复时不会交叉错序。
    enqueueRender(data);
  };
}

// ---- 图片附件（UX-07）-------------------------------------------------------
// 待发图片：先 POST /api/upload 换回服务端文件名，再随消息帧发出。
// 为什么先上传：大图塞进 WS JSON 会卡、会顶爆帧；HTTP 上传能做大小/类型校验。
// pending[] 存 {name, url}——url 是本地 objectURL，仅用于缩略图预览。
var pendingImages = [];

function addPendingImage(file) {
  if (!file || !/^image\//.test(file.type)) return;
  if (pendingImages.length >= 4) { addSystemNote("一次最多 4 张图"); return; }
  // 先本地预览（objectURL），同时后台上传换服务端名字
  var url = URL.createObjectURL(file);
  var entry = { name: null, url: url, el: null };
  pendingImages.push(entry);
  renderThumbs();
  // 直接把文件当请求体发（原始字节 + 图片 Content-Type），后端读 request.body()
  // ——省掉 multipart 依赖，一图一请求刚好。
  fetch("/api/upload", {
    method: "POST",
    headers: { "Content-Type": file.type || "application/octet-stream" },
    body: file
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) { removePending(entry); addSystemNote("图片上传失败：" + (j.error || "")); return; }
      entry.name = j.name;
    })
    .catch(function (e) { removePending(entry); addSystemNote("图片上传失败：" + e); });
}

function removePending(entry) {
  var i = pendingImages.indexOf(entry);
  if (i >= 0) pendingImages.splice(i, 1);
  if (entry.url) URL.revokeObjectURL(entry.url);
  renderThumbs();
}

function renderThumbs() {
  thumbsEl.textContent = "";   // 清空（清空不算塞内容）
  pendingImages.forEach(function (entry) {
    var box = document.createElement("div");
    box.className = "thumb";
    var img = document.createElement("img");
    img.src = entry.url;
    var rm = document.createElement("button");
    rm.type = "button";
    rm.className = "rm";
    rm.textContent = "×";
    rm.title = "移除";
    rm.addEventListener("click", function () { removePending(entry); });
    box.appendChild(img);
    box.appendChild(rm);
    entry.el = box;
    thumbsEl.appendChild(box);
  });
}

// 只把**已上传完成**（name 非空）的图带进消息；还在传的先等一拍
function readyImageNames() {
  return pendingImages.filter(function (e) { return e.name; }).map(function (e) { return e.name; });
}

function clearPendingImages() {
  pendingImages.forEach(function (e) { if (e.url) URL.revokeObjectURL(e.url); });
  pendingImages = [];
  renderThumbs();
}

// 粘贴图片：从剪贴板里挑出图片项
inputEl.addEventListener("paste", function (e) {
  var items = (e.clipboardData && e.clipboardData.items) || [];
  var got = false;
  for (var i = 0; i < items.length; i++) {
    if (items[i].kind === "file" && /^image\//.test(items[i].type)) {
      addPendingImage(items[i].getAsFile());
      got = true;
    }
  }
  if (got) e.preventDefault();   // 有图就别把二进制粘进文本框
});

attachEl.addEventListener("click", function () { fileEl.click(); });
fileEl.addEventListener("change", function () {
  for (var i = 0; i < fileEl.files.length; i++) addPendingImage(fileEl.files[i]);
  fileEl.value = "";   // 允许再次选同一个文件
});

// ---- 聊天框命令（& 或 / 开头）------------------------------------------------
// &newtale 重置（忘掉前情、库保留）**由后端处理**——不再走前端本地拦截。
// 为什么改到后端：语义是"忘掉"（划重置线，不删库），这需要读写会话存储；
// 而且 QQ 也走同一条路，一份逻辑两个平台一致（前端再拦一次就是第二份实现，
// 迟早漂移）。前端只留 &help 这类纯本地说明。
// 前缀 & 与 / 都认——& 跟正文不撞，/ 是大家更熟的习惯，两个都放行省得记。
var HELP_CMD = "&help";

// 把一行文字归一成命令名（去掉首尾空白、去掉一个前缀、转小写）。
// 不是命令（没有 & / 前缀）返回 ""。
function commandOf(text) {
  var t = (text || "").trim();
  if (!t || (t[0] !== "&" && t[0] !== "/")) return "";
  return t.slice(1).toLowerCase();
}

function isHelpCommand(text) { return commandOf(text) === "help"; }

function showHelp() {
  addSystemNote("&newtale 或 /newtale —— 重置本次会话（忘掉前面聊的，重新开始）");
  addSystemNote("&help 或 /help —— 显示本说明");
  addSystemNote("也可以直接粘贴图片发给我看；Enter 发送，Shift+Enter 换行");
}

function send() {
  var text = inputEl.value.trim();
  var images = readyImageNames();
  // 有文字或有（已上传的）图，且连接通，才发得出
  if ((!text && !images.length) || !ws || ws.readyState !== WebSocket.OPEN) {
    if ((text || pendingImages.length) && pendingImages.some(function (e) { return !e.name; })) {
      addSystemNote("图片还在上传，稍等一下");
    }
    return;
  }

  // &help：本地显示命令说明，不发服务端、不出气泡。
  if (isHelpCommand(text) && !images.length) {
    inputEl.value = "";
    showHelp();
    return;
  }

  // 注意：&newtale **不再在这里拦截**——当普通消息发出去，由后端命令层统一
  // 处理（忘掉前情、不删库，与 QQ 同一条路）。这里只需照常发帧、等回执。
  addBubble(text, "me", images);
  ws.send(JSON.stringify({ content: text, session_id: SID, images: images }));
  inputEl.value = "";
  clearPendingImages();
  sendEl.disabled = true;
  pending = addBubble("塔利在想…", "tale");
  pending.classList.add("thinking");
}

formEl.addEventListener("submit", function (e) {
  e.preventDefault();
  send();
});

// 清空本次会话历史：两下确认。
//   第一下 → 按钮进入"待发"（警示环急闪红），弹一行提示；
//   第二下 → 真的发 clear 帧，服务端删库，等 cleared 回执到了才抹页面。
//   3 秒不按第二下 → 自动解除待发（防止手滑一直挂着）。
// 为什么不用浏览器的原生确认框：它在这个内嵌浏览器里会被静默吞掉（返回 false），
// 按钮点了没反应——这正是"没办法真正重置"的原因。改成页内两下确认，既可靠
// 又更贴"发射钮"的调性。
var armed = false;
var armTimer = null;

function disarm() {
  armed = false;
  clearEl.classList.remove("armed");
  clearEl.title = "清空本次聊天历史（按两下）";
  clearTimeout(armTimer);
}

clearEl.addEventListener("click", function () {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  if (!armed) {
    armed = true;
    clearEl.classList.add("armed");
    clearEl.title = "再按一下，就真的清空";
    addSystemNote("已待发：再按一次就清空本次聊天");
    armTimer = setTimeout(disarm, 3000);
    return;
  }

  // 第二下：真清
  clearTimeout(armTimer);
  clearEl.disabled = true;
  ws.send(JSON.stringify({ action: "clear", session_id: SID }));
});

// Enter 发送，Shift+Enter 换行
inputEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

connect();
</script>
</body>
</html>
