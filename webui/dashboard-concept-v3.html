<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>今天 · 林星遥</title>
<script>
(function () {
  try {
    var saved = localStorage.getItem("taleai.concept.theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
  } catch (e) {}
})();
</script>
<style>
  /* ============================================================
     概念稿 v3 · 一页诗

     整页只放六样东西：
       日期 / 一行状态 / 一句大字 / 一道脉搏 /
       一句它记得的话 / 今天最后一句
     没有 KPI、没有列表、没有用量卡。要看细节，去聊天、设置、日志。
     ============================================================ */

  :root,
  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #f4f1ea;
    --surface: #fffdf9;
    --ink: #1e1d1a;
    --ink-2: #3a3833;
    --muted: #6b675e;
    --faint: #9a958a;
    --line: #e4dfd4;
    --line-soft: #ece7dd;
    --accent: #4f5fb5;
    --accent-soft: #eef0fb;
    --mark: #6b7fd7;
    --good: #3f8a5f;
    --warn: #a8732a;
    --bad: #b04a43;
    --mono: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
    --ease: cubic-bezier(.22,.7,.3,1);
    --dur: .2s;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0e0d0b;
    --surface: #191815;
    --ink: #f4f1e9;
    --ink-2: #d8d3c7;
    --muted: #a09a8e;
    --faint: #777267;
    --line: #2c2a25;
    --line-soft: #24221e;
    --accent: #a7b4f2;
    --accent-soft: rgba(107,127,215,.16);
    --mark: #7a89dd;
    --good: #7fc59a;
    --warn: #d6a45e;
    --bad: #e08a83;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink-2);
    font: 14px/1.75 var(--sans);
    display: flex;
    justify-content: center;
    overflow: hidden;
    transition: background-color .3s var(--ease), color .3s var(--ease);
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  .app {
    position: relative;
    width: 100%;
    max-width: 1240px;
    height: 100%;
    display: flex;
    background: var(--paper);
    overflow: hidden;
  }

  /* ============ 左侧轨道 ============ */
  .rail {
    width: 236px;
    flex: none;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow: hidden;
    transition: width .26s var(--ease), transform .26s var(--ease);
    z-index: 30;
  }
  .rail-top {
    display: flex; align-items: center; gap: 8px;
    padding: 22px 16px 16px;
    min-height: 78px;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; color: inherit; text-decoration: none; }
  .brand .mark { flex: none; width: 26px; height: 26px; color: var(--accent); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .brand-text strong { font-size: 14px; font-weight: 600; color: var(--ink); }
  .brand-text small {
    margin-top: 3px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
    color: var(--faint); text-transform: uppercase;
  }
  .rail-toggle {
    flex: none; width: 26px; height: 26px;
    display: grid; place-items: center;
    border: 0; border-radius: 7px;
    background: transparent; color: var(--faint);
    cursor: pointer;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .rail-toggle:hover { background: var(--paper); color: var(--ink); }
  .rail-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rail-toggle svg { transition: transform .26s var(--ease); }

  .nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    height: 38px; padding: 0 10px;
    border-radius: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav-item svg { flex: none; color: var(--faint); transition: color var(--dur) var(--ease); }
  .nav-item:hover { background: var(--paper); color: var(--ink); }
  .nav-item:hover svg { color: var(--ink); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-item.active {
    color: var(--accent);
    background: var(--accent-soft);
    font-weight: 500;
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .nav-item.active svg { color: var(--accent); }

  .rail-foot {
    margin-top: auto;
    padding: 14px 16px 18px;
    border-top: 1px solid var(--line-soft);
    display: flex; flex-direction: column; gap: 5px;
    white-space: nowrap;
  }
  .life { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
  .life .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--good);
    animation: life 3.2s var(--ease) infinite;
  }
  @keyframes life {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63,138,95,.35); }
    50%      { box-shadow: 0 0 0 5px rgba(63,138,95,0); }
  }
  .rail-note { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--faint); }

  .app.rail .rail { width: 72px; }
  .app.rail .brand-text,
  .app.rail .nav-item span,
  .app.rail .rail-foot .rail-note,
  .app.rail .life span { display: none; }
  .app.rail .rail-top { padding: 22px 0 16px; justify-content: center; }
  .app.rail .brand { flex: none; }
  .app.rail .nav { padding: 4px 12px; }
  .app.rail .nav-item { justify-content: center; padding: 0; }
  .app.rail .rail-foot { align-items: center; padding: 14px 0 18px; }
  .app.rail .rail-toggle svg { transform: rotate(180deg); }

  /* ============ 舞台：一张纸，一屏读完 ============ */
  .stage {
    flex: 1; min-width: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: clamp(22px, 3.4vh, 36px) clamp(24px, 4vw, 48px) clamp(18px, 2.6vh, 28px);
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .stage::-webkit-scrollbar { width: 10px; }
  .stage::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 999px; border: 3px solid var(--paper);
  }
  .stage::-webkit-scrollbar-track { background: transparent; }
  .stage-inner {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 720px;
    min-height: 100%;
    margin: 0 auto;
  }

  /* ---- 页头 ---- */
  .masthead {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px;
    margin-bottom: clamp(22px, 4vh, 40px);
  }
  .masthead-left { display: flex; align-items: flex-start; gap: 10px; min-width: 0; flex: 1; }
  .menu-btn { display: none; }
  .date {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .masthead-actions { display: flex; align-items: center; gap: 4px; flex: none; }
  .live {
    margin-right: 10px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--faint);
    white-space: nowrap;
  }
  .live.syncing { animation: blink .6s var(--ease) infinite alternate; }
  @keyframes blink { from { opacity: .3; } to { opacity: 1; } }

  .primary {
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 13px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-size: 12px; font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: filter var(--dur) var(--ease), transform .1s var(--ease);
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: scale(.985); }
  .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 按钮文字单独一类：别和「它记得」的 .label 撞车（会继承灰色小字） */
  .primary .btn-label { color: #fff; font-size: 12px; letter-spacing: 0; }

  .icon-action {
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 0; border-radius: 8px;
    background: transparent; color: var(--faint);
    cursor: pointer;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .icon-action:hover { background: var(--surface); color: var(--ink); }
  .icon-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- 一行状态 ---- */
  .status-line {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 4px 2px;
    margin: 0 0 10px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .st .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
  .st .dot.ok { background: var(--good); }
  .st .dot.warn { background: var(--warn); }
  .st .dot.bad { background: var(--bad); }
  .st-sep { color: var(--faint); opacity: .7; margin: 0 4px; }

  .alert-line {
    display: flex; flex-wrap: wrap; align-items: baseline;
    gap: 6px;
    margin: 0 0 10px;
    font-size: 11.5px;
    color: var(--warn);
    line-height: 1.7;
  }
  .alert-line.bad { color: var(--bad); }
  .alert-line.info { color: var(--muted); }
  /* 借鉴 LobeChat 的 "Needs you"：先把"要你动手"标出来，再看句子 */
  .alert-tag {
    flex: none;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--warn);
    border: 1px solid rgba(168,115,42,.35);
    border-radius: 999px;
    padding: 1px 7px;
    line-height: 1.5;
  }
  .alert-line.bad .alert-tag { color: var(--bad); border-color: rgba(176,74,67,.35); }
  .alert-line.info .alert-tag { color: var(--faint); border-color: var(--line); }
  .alert-line[hidden] { display: none; }
  .alert-line a {
    color: var(--warn);
    text-decoration: none;
    border-bottom: 1px solid rgba(168,115,42,.35);
    margin-left: 4px;
  }
  .alert-line a:hover { border-bottom-color: var(--warn); }
  .alert-line a:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; border-radius: 3px; }

  /* ---- 一句大字 ---- */
  .hero {
    margin: 0;
    max-width: 19ch;
    font-size: clamp(30px, 4.8vh, 44px);
    line-height: 1.36;
    font-weight: 500;
    letter-spacing: -.025em;
    color: var(--ink);
    text-wrap: balance;
  }
  .hero em {
    font-style: normal;
    color: var(--accent);
    font-variant-numeric: proportional-nums;
  }
  .hero-sub {
    margin: clamp(8px, 1.4vh, 14px) 0 0;
    max-width: 38ch;
    font-size: 13px;
    line-height: 1.75;
    color: var(--muted);
  }
  .hero-sub .hl { color: var(--ink-2); }

  /* ---- 脉搏 ---- */
  .pulse { margin-top: clamp(22px, 4.2vh, 38px); }
  .pulse-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--faint);
  }
  .pulse-plot {
    position: relative;
    height: clamp(66px, 12vh, 96px);
    display: flex;
    align-items: flex-end;
    gap: 4px;
    border-bottom: 1px solid var(--line);
  }
  .pulse-col {
    position: relative;
    flex: 1;
    height: 100%;
    border: 0; padding: 0;
    background: transparent;
    display: flex; align-items: flex-end; justify-content: center;
    cursor: pointer;
    border-radius: 3px;
  }
  .pulse-col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pulse-bar {
    width: 6px;
    max-height: calc(100% - 2px);
    background: var(--mark);
    border-radius: 3px 3px 0 0;
    transform-origin: bottom;
    animation: grow .6s var(--ease) both;
    animation-delay: calc(var(--i) * 20ms);
    transition: background var(--dur) var(--ease);
  }
  .pulse-col:hover .pulse-bar,
  .pulse-col.active .pulse-bar { background: var(--accent); }
  .pulse-col.today .pulse-bar { background: var(--accent); }
  .pulse-bar.zero { height: 2px !important; background: var(--line); border-radius: 1px; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .pulse-readout {
    margin-top: 7px;
    min-height: 16px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }
  .pulse-readout .num { color: var(--ink); }
  .pulse-table { margin-top: 7px; }
  .pulse-table summary {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .06em;
    color: var(--faint);
    cursor: pointer;
    list-style: none;
  }
  .pulse-table summary::-webkit-details-marker { display: none; }
  .pulse-table summary:hover { color: var(--accent); }
  .pulse-table summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .pulse-table table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 9px;
  }
  .pulse-table th, .pulse-table td {
    text-align: left; padding: 3px 2px;
    border-bottom: 1px solid var(--line-soft);
    font-variant-numeric: tabular-nums;
  }
  .pulse-table th { color: var(--faint); font-weight: 500; }
  .pulse-table td { color: var(--muted); }
  .pulse-table td:last-child, .pulse-table th:last-child { text-align: right; }

  /* ---- 底部两栏：它记得 / 今天最后一句 ---- */
  .bottom-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    gap: clamp(26px, 5vw, 56px);
    margin-top: clamp(24px, 4.2vh, 42px);
    padding-top: clamp(14px, 2.4vh, 24px);
    border-top: 1px solid var(--line-soft);
  }
  .memory, .last-line { min-width: 0; }
  .section-head {
    display: flex; align-items: center; justify-content: flex-start;
    gap: 10px;
    margin-bottom: 9px;
  }
  .label {
    margin: 0;
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--muted);
  }
  /* 重要度：五颗无底的小圆点（v1 里留下的那点东西） */
  .importance { display: inline-flex; align-items: center; gap: 4px; }
  .importance i {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--line);
    display: inline-block;
  }
  .importance i.on { background: var(--accent); }
  .memory-text {
    margin: 0;
    max-width: 30ch;
    font-family: var(--serif);
    font-size: clamp(17px, 2.4vh, 20px);
    line-height: 1.8;
    color: var(--ink);
    text-wrap: pretty;
  }
  .memory-meta {
    margin: 9px 0 0;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .04em;
    color: var(--faint);
  }
  .memory-meta .sep { margin: 0 5px; opacity: .5; }
  .memory-more {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 2px;
  }
  .memory-more:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .memory-more:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .last-label {
    margin: 0 0 8px;
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .last-meta {
    margin: 0 0 3px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .04em;
    color: var(--faint);
  }
  .last-quote {
    margin: 0;
    max-width: 40ch;
    font-size: 13.5px;
    line-height: 1.8;
    color: var(--ink-2);
  }

  .empty { margin: 0; font-size: 12px; color: var(--faint); }

  /* 页脚压到纸的底部：内容少时也不悬在半空 */
  .foot {
    margin: auto 0 0;
    padding-top: clamp(18px, 3vh, 28px);
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .08em;
    color: var(--faint);
  }

  /* ---- 入场 ---- */
  .rise { animation: rise .55s var(--ease) both; }
  .rise.d1 { animation-delay: .05s; }
  .rise.d2 { animation-delay: .12s; }
  .rise.d3 { animation-delay: .18s; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- 浮层提示 ---- */
  .toast {
    position: fixed;
    left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--surface);
    font-size: 12px;
    padding: 9px 16px;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .backdrop { display: none; }

  /* ---- 窄屏 ---- */
  @media (max-width: 900px) {
    .app { max-width: none; }
    .rail {
      position: absolute; top: 0; bottom: 0; left: 0;
      width: 236px;
      transform: translateX(-100%);
      box-shadow: 0 0 40px rgba(0,0,0,.16);
    }
    .rail.open { transform: translateX(0); }
    .app.rail .rail { width: 236px; }
    .app.rail .brand-text, .app.rail .nav-item span,
    .app.rail .rail-foot .rail-note, .app.rail .life span { display: initial; }
    .app.rail .rail-top { padding: 22px 16px 16px; justify-content: flex-start; }
    .app.rail .nav { padding: 4px 10px; }
    .app.rail .nav-item { justify-content: flex-start; padding: 0 10px; }
    .app.rail .rail-foot { align-items: flex-start; padding: 14px 16px 18px; }
    .app.rail .rail-toggle svg { transform: none; }
    .menu-btn { display: grid; }
    .backdrop.show {
      display: block;
      position: absolute; inset: 0;
      z-index: 25;
      background: rgba(0,0,0,.28);
    }
    .stage { padding: 26px 28px 32px; }
    .masthead { margin-bottom: 34px; }
    .hero { font-size: 38px; }
    .memory-text { font-size: 18px; }
  }

  @media (max-width: 600px) {
    .stage { padding: 18px 18px 26px; }
    .masthead { margin-bottom: 30px; gap: 10px; }
    .live { display: none; }
    .primary { padding: 0 10px; }
    .primary .btn-label { display: none; }
    .status-line { font-size: 11px; margin-bottom: 8px; }
    .hero { font-size: 31px; }
    .hero-sub { font-size: 12.5px; }
    .pulse { margin-top: 26px; }
    .pulse-plot { height: 82px; gap: 3px; }
    .pulse-bar { width: 5px; }
    .bottom-grid {
      grid-template-columns: 1fr;
      gap: 26px;
      margin-top: 30px;
      padding-top: 18px;
    }
    .memory-text { font-size: 17px; }
    .foot { margin-top: 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-bar, .rise, .life .dot, .live.syncing { animation: none; }
    .rail, .toast, .pulse-bar, .nav-item, .icon-action { transition: none; }
  }

  @media print {
    body { background: #fff; overflow: visible; }
    .app { max-width: none; }
    .rail, .masthead-actions, .pulse-readout, .menu-btn { display: none !important; }
    .stage { overflow: visible; padding: 0; }
    .pulse-bar { animation: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="rail" id="rail">
    <div class="rail-top">
      <a class="brand" href="#" aria-label="塔利 · TaleAI">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="11.5" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
          <circle cx="16" cy="16" r="4.2" fill="currentColor"/>
          <circle cx="25.5" cy="9" r="2.1" fill="currentColor" opacity=".9"/>
        </svg>
        <span class="brand-text"><strong>塔利</strong><small>TaleAI</small></span>
      </a>
      <button class="rail-toggle" id="railToggle" type="button"

<script>
/* ============================================================
   概念稿 v3（一页诗）
   ------------------------------------------------------------
   只渲染六样：日期 / 状态 / 一句大字 / 脉搏 / 一句记忆 /
   今天最后一句。其余数字不往页面上放——要看就去聊天、设置、日志。
   ============================================================ */

var NOW = Math.floor(Date.now() / 1000);
var DAY = 86400;
var DATA = buildData();
var state = { theme: document.documentElement.getAttribute("data-theme") || "light" };

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function svg(tag, attrs) {
  var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  return e;
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function fmtNum(n) { return Number(n || 0).toLocaleString("zh-CN"); }

function clockOf(ts) {
  var d = new Date(ts * 1000);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

function dateLine(ts) {
  var months = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
  var d = new Date(ts * 1000);
  var day = d.getDate();
  var dayText;
  if (day <= 9) dayText = "初" + ["一", "二", "三", "四", "五", "六", "七", "八", "九"][day - 1];
  else if (day === 10) dayText = "十";
  else if (day < 20) dayText = "十" + ["一", "二", "三", "四", "五", "六", "七", "八", "九"][day - 11];
  else if (day === 20) dayText = "二十";
  else if (day < 30) dayText = "二十" + ["一", "二", "三", "四", "五", "六", "七", "八", "九"][day - 21];
  else if (day === 30) dayText = "三十";
  else dayText = "三十一";
  var week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
  return months[d.getMonth()] + "月" + dayText + "日，星期" + week;
}

function monthDay(ts) {
  var d = new Date(ts * 1000);
  return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
}

function relTime(ts) {
  if (!ts) return "—";
  var diff = NOW - ts;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < DAY) return Math.floor(diff / 3600) + " 小时前";
  if (diff < 2 * DAY) return "昨天";
  return (new Date(ts * 1000).getMonth() + 1) + "-" + new Date(ts * 1000).getDate();
}

/* ---------- 示例数据（与 /api/overview 同构） ---------- */
function buildData() {
  var events = [12, 9, 4, 18, 22, 7, 3, 15, 26, 11, 6, 19, 26, 31];
  var series = [];
  for (var i = 0; i < 14; i++) {
    var ts = NOW - (13 - i) * DAY;
    var d = new Date(ts * 1000);
    series.push({ date: (d.getMonth() + 1) + "-" + pad2(d.getDate()), ts: ts, events: events[i] });
  }

  return {
    now: NOW,
    bot: { name: "林星遥", model: "deepseek-v4.1-flash-w", base_url: "api.polar112.top" },
    counts: { sessions: 12, messages: 1284, events: 342, memories: 47 },
    today: { messages: 23, events: 31, memories: 3 },
    deltas: { messages: 11, events: 5, memories: 2 },
    series: series,
    alerts: [
      { level: "warn", title: "今天有 1 次模型调用失败", detail: "其余 127 次正常。", action: "去日志" },
    ],
    platforms: { qq: { state: "running", connected: true, enabled: true } },
    memory: { last_at: NOW - 3600, active: 47 },
    llm_key_set: true,
    recent_events: [
      { type: "message.received", ts: NOW - 60, preview: "今天的面板改得怎么样？" },
      { type: "message.sent", ts: NOW - 95, preview: "还在收尾。侧栏折叠那个 bug 找着了，是 flex 的自动最小宽度。" },
      { type: "message.received", ts: NOW - 150, preview: "听起来很细。" },
      { type: "message.sent", ts: NOW - 185, preview: "嗯，越小的东西越容易藏 bug。" },
    ],
    recent_memories: [
      {
        content: "下周去北京，周二早上 7:30 的高铁。", importance: 5,
        tags: ["计划", "出行"], created_at: NOW - 2 * DAY,
      },
      { content: "最近在改 TaleAI 的面板，反复提到「留白」和「一致性」。", importance: 4, created_at: NOW - 2 * 3600 },
      { content: "喜欢在晚上十点以后聊天，白天通常很忙。", importance: 3, created_at: NOW - 4 * DAY },
    ],
  };
}

/* ---------- 页头 ---------- */
function renderHead(d) {
  document.getElementById("dateLine").textContent = dateLine(d.now);
  document.getElementById("live").textContent = "已同步 · " + clockOf(d.now);
  document.title = "今天 · " + (d.bot.name || "塔利");
}

/* ---------- 一行状态 ---------- */
function phrase(text, cls) {
  var s = el("span", "st");
  s.appendChild(el("i", "dot " + (cls || "")));
  s.appendChild(el("span", null, text));
  return s;
}

function renderStatus(d) {
  var box = document.getElementById("statusLine");
  box.textContent = "";
  var qq = (d.platforms || {}).qq || {};
  var mem = d.memory || {};
  var list = [];

  list.push(phrase("服务在", "ok"));

  var qqText, qqCls;
  if (!qq.state) { qqText = "QQ 没接入"; qqCls = ""; }
  else if (qq.state === "running" && qq.connected) { qqText = "QQ 在"; qqCls = "ok"; }
  else if (qq.state === "running") { qqText = "QQ 在等人"; qqCls = "warn"; }
  else if (qq.state === "failed") { qqText = "QQ 没连上"; qqCls = "bad"; }
  else if (qq.enabled === false) { qqText = "QQ 关着"; qqCls = ""; }
  else { qqText = "QQ 停了"; qqCls = "warn"; }
  list.push(phrase(qqText, qqCls));

  list.push(phrase(d.llm_key_set ? "模型在" : "模型还没配好",
                   d.llm_key_set ? "ok" : "bad"));

  if (!mem.last_at) list.push(phrase("记忆还没醒", "warn"));
  else list.push(phrase("记忆停在 " + relTime(mem.last_at),
                        NOW - mem.last_at > 2 * DAY ? "warn" : "ok"));

  list.forEach(function (p, i) {
    if (i) box.appendChild(el("span", "st-sep", "·"));
    box.appendChild(p);
  });

  var alertLine = document.getElementById("alertLine");
  var alerts = d.alerts || [];
  if (!alerts.length) {
    alertLine.hidden = true;
    return;
  }
  var a = alerts[0];
  alertLine.hidden = false;
  alertLine.className = "alert-line " + (a.level || "");
  alertLine.textContent = "";
  alertLine.appendChild(el("span", "alert-tag",
    a.level === "info" ? "提示" : "需要你"));
  alertLine.appendChild(el("span", null, a.title + "。"));
  var link = document.createElement("a");
  link.href = "#";
  link.textContent = (a.action || "去看看") + " →";
  link.addEventListener("click", function (e) {
    e.preventDefault();
    showToast("概念稿：这里会去日志");
  });
  alertLine.appendChild(link);
  if (alerts.length > 1) {
    alertLine.appendChild(document.createTextNode("还有 " + (alerts.length - 1) + " 件。"));
  }
}

/* ---------- 一句大字 ---------- */
function renderHero(d) {
  var hero = document.getElementById("heroLine");
  hero.textContent = "";
  if (!d.today.messages) {
    hero.appendChild(document.createTextNode("今天还很安静。"));
  } else {
    // 故意断在数字前：让"23"单独落在第二行，是这句话的重音
    hero.appendChild(document.createTextNode("今天，你们说了"));
    hero.appendChild(document.createElement("br"));
    hero.appendChild(el("em", null, fmtNum(d.today.messages)));
    hero.appendChild(document.createTextNode(" 句话。"));
  }

  var sub = document.getElementById("heroSub");
  sub.textContent = "";
  if (!d.today.messages) {
    sub.textContent = "说句话，它就醒了。";
    return;
  }
  var delta = Number(d.deltas.messages || 0);
  var trend = delta > 0 ? "比昨天多 " + fmtNum(delta) + " 句"
            : delta < 0 ? "比昨天少 " + fmtNum(-delta) + " 句"
            : "和昨天差不多";
  sub.appendChild(document.createTextNode(trend + "。"));
  if (d.today.memories) {
    sub.appendChild(document.createTextNode("它今天记住了 "));
    sub.appendChild(el("span", "hl", fmtNum(d.today.memories) + " 件小事"));
    sub.appendChild(document.createTextNode("。"));
  }
}

/* ---------- 脉搏 ---------- */
function setPulseReadout(day) {
  var out = document.getElementById("pulseReadout");
  out.textContent = "";
  out.appendChild(el("span", "num", fmtNum(day.events) + " 起事件"));
  out.appendChild(document.createTextNode(" · " + monthDay(day.ts)));
}

function markPulse(i) {
  Array.prototype.forEach.call(document.querySelectorAll(".pulse-col"), function (c, idx) {
    c.classList.toggle("active", idx === i);
  });
}

function resetPulse(d) {
  var last = d.series[d.series.length - 1];
  setPulseReadout(last);
  markPulse(d.series.length - 1);
}

function renderPulse(d) {
  var series = d.series || [];
  var max = 1;
  series.forEach(function (s) { if (s.events > max) max = s.events; });

  var plot = document.getElementById("pulsePlot");
  plot.textContent = "";

  series.forEach(function (s, i) {
    var col = document.createElement("button");
    col.type = "button";
    col.className = "pulse-col" + (i === series.length - 1 ? " today" : "");
    col.setAttribute("aria-label", monthDay(s.ts) + "，" + s.events + " 起事件");
    col.style.setProperty("--i", String(i));

    var bar = el("div", "pulse-bar" + (s.events ? "" : " zero"));
    bar.style.height = s.events ? Math.max(4, (s.events / max) * 100) + "%" : "2px";
    col.appendChild(bar);

    col.addEventListener("pointerenter", function () { setPulseReadout(s); markPulse(i); });
    col.addEventListener("focus", function () { setPulseReadout(s); markPulse(i); });
    col.addEventListener("pointerleave", function () { resetPulse(d); });
    col.addEventListener("blur", function () { resetPulse(d); });
    col.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault();
      var next = i + (e.key === "ArrowRight" ? 1 : -1);
      if (next < 0) next = series.length - 1;
      if (next >= series.length) next = 0;
      plot.querySelectorAll(".pulse-col")[next].focus();
      setPulseReadout(series[next]);
    });

    plot.appendChild(col);
  });

  resetPulse(d);

  var tbody = document.getElementById("pulseTable");
  tbody.textContent = "";
  series.slice().reverse().forEach(function (s) {
    var tr = document.createElement("tr");
    tr.appendChild(el("td", null, s.date));
    tr.appendChild(el("td", null, fmtNum(s.events)));
    tbody.appendChild(tr);
  });
}

/* ---------- 它记得 ---------- */
function renderMemory(d) {
  var text = document.getElementById("memoryText");
  var meta = document.getElementById("memoryMeta");
  var more = document.getElementById("memoryMore");
  var dots = document.getElementById("importance");
  text.textContent = "";
  meta.textContent = "";
  dots.textContent = "";

  var list = d.recent_memories || [];
  if (!list.length) {
    text.textContent = "它还没有记住什么。再聊一会儿吧。";
    meta.hidden = true;
    more.hidden = true;
    dots.hidden = true;
    return;
  }

  var m = list[0];
  text.textContent = m.content;
  meta.hidden = false;
  dots.hidden = false;

  var level = Math.max(0, Math.min(5, Number(m.importance) || 0));
  dots.setAttribute("aria-label", "重要度 " + level + " / 5");
  dots.title = "重要度 " + level + " / 5";
  for (var i = 0; i < 5; i++) {
    var dot = document.createElement("i");
    if (i < level) dot.className = "on";
    dots.appendChild(dot);
  }

  var parts = [relTime(m.created_at)];
  if (m.tags && m.tags.length) parts.push(m.tags.join(" · "));
  parts.forEach(function (t, idx) {
    if (idx) meta.appendChild(el("span", "sep", "·"));
    meta.appendChild(document.createTextNode(t));
  });

  more.hidden = false;
  more.textContent = "它还记得 " + Math.max(0, d.counts.memories - 1) + " 件 →";
  more.onclick = function (e) {
    e.preventDefault();
    showToast("接入后会打开完整的记忆页");
  };
}

/* ---------- 今天最后一句 ---------- */
function renderLastLine(d) {
  var list = (d.recent_events || []).filter(function (ev) {
    return ev.type === "message.received" || ev.type === "message.sent";
  });
  var meta = document.getElementById("lastMeta");
  var quote = document.getElementById("lastQuote");
  meta.textContent = "";
  quote.textContent = "";

  if (!list.length) {
    quote.textContent = "今天还没有人说话。";
    return;
  }

  var ev = list[0];
  var who = ev.type === "message.sent" ? "它说" : "你说";
  meta.textContent = clockOf(ev.ts) + " · " + who;
  quote.appendChild(document.createTextNode("「" + ev.preview + "」"));
}

/* ---------- 主题 ---------- */
function paintTheme() {
  var icon = document.getElementById("themeIcon");
  icon.textContent = "";
  if (state.theme === "dark") {
    icon.appendChild(svg("path", {
      d: "M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z",
    }));
  } else {
    icon.appendChild(svg("circle", { cx: "12", cy: "12", r: "4.2" }));
    [[12, 2.5, 12, 5], [12, 19, 12, 21.5], [2.5, 12, 5, 12], [19, 12, 21.5, 12],
     [5.3, 5.3, 7, 7], [17, 17, 18.7, 18.7], [18.7, 5.3, 17, 7], [7, 17, 5.3, 18.7]]
      .forEach(function (p) {
        icon.appendChild(svg("line", {
          x1: p[0], y1: p[1], x2: p[2], y2: p[3], "stroke-linecap": "round",
        }));
      });
  }
  document.getElementById("themeBtn").setAttribute(
    "aria-label", state.theme === "dark" ? "切换到浅色主题" : "切换到深色主题"
  );
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  try { localStorage.setItem("taleai.concept.theme", state.theme); } catch (e) {}
  paintTheme();
}

/* ---------- 复制摘要 ---------- */
function copySummary() {
  var d = DATA;
  var lines = [
    dateLine(d.now),
    "今天和" + d.bot.name + "说了 " + d.today.messages + " 句话，" +
      d.today.events + " 起事件，新记住 " + d.today.memories + " 件事。",
  ];
  if (d.recent_memories[0]) {
    lines.push("它记得：「" + d.recent_memories[0].content + "」");
  }
  var text = lines.join("\n");

  function done() { showToast("今日摘要已复制"); }
  function fail() { showToast("复制失败，浏览器没给权限"); }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();

  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); }
    catch (e) { fail(); }
    ta.remove();
  }
}

/* ---------- 提示 / 侧栏 ---------- */
var toastTimer = null;
function showToast(text) {
  var toast = document.getElementById("toast");
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1900);
}

var rail = document.getElementById("rail");
var backdrop = document.getElementById("backdrop");
var railToggle = document.getElementById("railToggle");
var RAIL_KEY = "taleai.concept.rail";

function isNarrow() { return window.matchMedia("(max-width: 900px)").matches; }
function applyRail(collapsed) {
  document.getElementById("app").classList.toggle("rail", collapsed);
  railToggle.setAttribute("aria-expanded", String(!collapsed));
  railToggle.setAttribute("aria-label", collapsed ? "展开侧栏" : "收起侧栏");
  railToggle.title = collapsed ? "展开侧栏" : "收起侧栏";
}

if (!isNarrow()) {
  try { if (localStorage.getItem(RAIL_KEY) === "1") applyRail(true); } catch (e) {}
}

railToggle.addEventListener("click", function () {
  if (isNarrow()) {
    var open = rail.classList.toggle("open");
    backdrop.classList.toggle("show", open);
    return;
  }
  var collapsed = !document.getElementById("app").classList.contains("rail");
  applyRail(collapsed);
  try { localStorage.setItem(RAIL_KEY, collapsed ? "1" : "0"); } catch (e) {}
});

document.getElementById("menuBtn").addEventListener("click", function () {
  rail.classList.add("open");
  backdrop.classList.add("show");
});
backdrop.addEventListener("click", function () {
  rail.classList.remove("open");
  backdrop.classList.remove("show");
});

document.querySelectorAll(".nav-item").forEach(function (a) {
  a.addEventListener("click", function (e) {
    e.preventDefault();
    if (a.classList.contains("active")) return;
    showToast("概念稿：这里会去「" + a.textContent.trim() + "」");
  });
});
document.querySelector(".brand").addEventListener("click", function (e) { e.preventDefault(); });
document.getElementById("openChat").addEventListener("click", function (e) {
  e.preventDefault();
  showToast("接入后会打开聊天页");
});

/* ---------- 刷新 ---------- */
function refresh() {
  var live = document.getElementById("live");
  live.classList.add("syncing");
  live.textContent = "同步中";
  setTimeout(function () {
    live.classList.remove("syncing");
    live.textContent = "已同步 · " + clockOf(Math.floor(Date.now() / 1000));
    renderAll();
    showToast("已是最新");
  }, 520);
}

/* ---------- 总入口 ---------- */
function renderAll() {
  var d = DATA;
  renderHead(d);
  renderStatus(d);
  renderHero(d);
  renderPulse(d);
  renderMemory(d);
  renderLastLine(d);
}

document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("copyBtn").addEventListener("click", copySummary);
document.getElementById("reloadBtn").addEventListener("click", refresh);

document.addEventListener("keydown", function (e) {
  if (e.key === "r" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    refresh();
  }
});

paintTheme();
renderAll();
</script>
</body>
</html>
