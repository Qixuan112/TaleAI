<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塔利 · 实时日志</title>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #2b2b2b;
    --muted: #8a8a8a;
    --line: #e6e3dc;
    --tale: #6b7fd7;
    --ev-received: #6b7fd7;   /* 收到消息 */
    --ev-tool: #d98b3b;       /* 调工具 */
    --ev-sent: #5fbf7f;       /* 回复完成 */
    --lv-info: #6b7fd7;
    --lv-warning: #d98b3b;
    --lv-error: #d9534f;
    --lv-debug: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.55 "SFMono-Regular", Consolas, "Microsoft YaHei", monospace;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 900px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(0,0,0,.05);
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  header .status { font-size: 12px; color: var(--muted); }
  header .status.ok::before { content: "● "; color: #5fbf7f; }
  header .status.off::before { content: "● "; color: #d98b8b; }
  header .spacer { flex: 1; }
  header button {
    font: inherit; font-size: 12px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 8px; padding: 3px 10px;
  }
  header button:hover { border-color: var(--tale); }

  /* ---- 顶部导航：聊天 / 设置 / 日志（当前页高亮）---- */
  .nav {
    display: flex;
    gap: 2px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  .nav a {
    padding: 7px 12px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .nav a:hover { color: var(--ink); }
  .nav a.active { color: var(--tale); border-bottom-color: var(--tale); font-weight: 600; }

  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  section { display: flex; flex-direction: column; overflow: hidden; }
  section.events { flex: 0 0 38%; border-bottom: 2px solid var(--line); }
  section.logs { flex: 1; }
  section h2 {
    font-size: 12px; font-weight: 600; color: var(--muted);
    margin: 0; padding: 8px 16px 6px; letter-spacing: .04em;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .feed { flex: 1; overflow-y: auto; padding: 0 16px 14px; }

  .row { padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
  .row .ts { color: var(--muted); flex: 0 0 auto; }
  .row .tag { flex: 0 0 auto; font-weight: 600; }
  .row .body { flex: 1; white-space: pre-wrap; word-break: break-word; }

  .ev .tag { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .ev-received .tag { color: var(--ev-received); }
  .ev-tool .tag { color: var(--ev-tool); }
  .ev-sent .tag { color: var(--ev-sent); }
  .ev-tool.bad .tag::after { content: " ✗"; }

  .log .tag.lv-INFO { color: var(--lv-info); }
  .log .tag.lv-WARNING { color: var(--lv-warning); }
  .log .tag.lv-ERROR, .log .tag.lv-CRITICAL { color: var(--lv-error); }
  .log .tag.lv-DEBUG { color: var(--lv-debug); }
  .log .where { color: var(--muted); }

  .empty { color: var(--muted); padding: 8px 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>塔利 · 实时日志</h1>
    <span id="status" class="status off">连接中…</span>
    <span class="spacer"></span>
    <button id="pause" type="button">暂停滚动</button>
    <button id="clear" type="button">清屏</button>
  </header>

  <nav class="nav">
    <a href="/">聊天</a>
    <a href="/settings">设置</a>
    <a class="active" href="/logs">日志</a>
  </nav>

  <main>
    <section class="events">
      <h2>事件流水（收到消息 / 调用工具 / 回复完成）</h2>
      <div id="events" class="feed"></div>
    </section>
    <section class="logs">
      <h2>详细日志（INFO 以上）</h2>
      <div id="logs" class="feed"></div>
    </section>
  </main>
</div>

<script>
// 一律用 textContent —— 绝不把内容塞 innerHTML（跟聊天页同一条 XSS 纪律）。
var eventsEl = document.getElementById("events");
var logsEl = document.getElementById("logs");
var statusEl = document.getElementById("status");
var pauseEl = document.getElementById("pause");
var clearEl = document.getElementById("clear");

var paused = false;   // 暂停后不再自动滚到底（看历史时不被抢走视野）

var EVENT_LABEL = {
  "message.received": "收到消息",
  "tool.called": "调用工具",
  "message.sent": "回复完成"
};

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.className = "status " + (ok ? "ok" : "off");
}

function hhmmss(ts) {
  if (!ts) return "--:--:--";
  var d = new Date(ts * 1000);
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function rowEl(kind, tagText, tagClass) {
  var row = document.createElement("div");
  row.className = "row " + kind;
  var ts = document.createElement("span");
  ts.className = "ts";
  var tag = document.createElement("span");
  tag.className = "tag " + tagClass;
  tag.textContent = tagText;
  var body = document.createElement("span");
  body.className = "body";
  row.appendChild(ts);
  row.appendChild(tag);
  row.appendChild(body);
  return { row: row, ts: ts, body: body };
}

function scrollIfNeeded(feed) {
  if (!paused) feed.scrollTop = feed.scrollHeight;
}

function addEvent(frame) {
  var cls;
  if (frame.name === "tool.called") {
    cls = "ev ev-tool" + (frame.ok ? "" : " bad");
  } else if (frame.name === "message.received") {
    cls = "ev ev-received";
  } else if (frame.name === "message.sent") {
    cls = "ev ev-sent";
  } else {
    cls = "ev";
  }
  var label = EVENT_LABEL[frame.name] || frame.name;
  var parts = rowEl(cls, label, "");
  parts.ts.textContent = hhmmss(frame.ts);

  var text;
  if (frame.name === "message.received") {
    text = "[" + (frame.session_id || "?") + "] " + (frame.content || "");
  } else if (frame.name === "tool.called") {
    text = "[" + (frame.session_id || "?") + "] " + frame.tool +
           (frame.ok ? " ✓" : " ✗ " + (frame.error || "失败"));
  } else if (frame.name === "message.sent") {
    text = "[" + (frame.session_id || "?") + "] " + (frame.stop_reason || "ok");
  } else {
    text = JSON.stringify(frame);
  }
  parts.body.textContent = text;

  eventsEl.appendChild(parts.row);
  scrollIfNeeded(eventsEl);
}

function addLog(frame) {
  var cls = "log " + frame.level;
  var parts = rowEl(cls, frame.level, "tag lv-" + frame.level);
  parts.ts.textContent = hhmmss(frame.ts);

  var where = document.createElement("span");
  where.className = "where";
  where.textContent = " [" + frame.logger + "] ";
  parts.body.appendChild(where);
  var msg = document.createElement("span");
  msg.textContent = frame.message;
  parts.body.appendChild(msg);

  logsEl.appendChild(parts.row);
  scrollIfNeeded(logsEl);
}

function connect() {
  var es = new EventSource("/events");

  es.onopen = function () { setStatus("已连接", true); };
  es.onerror = function () {
    setStatus("已断开，重连中…", false);
    // EventSource 自带重连；无需手动。断了就等它自己回来。
  };

  es.onmessage = function (ev) {
    var frame;
    try { frame = JSON.parse(ev.data); } catch (e) { return; }
    if (frame.type === "event") addEvent(frame);
    else if (frame.type === "log") addLog(frame);
  };
}

pauseEl.addEventListener("click", function () {
  paused = !paused;
  pauseEl.textContent = paused ? "恢复滚动" : "暂停滚动";
});

clearEl.addEventListener("click", function () {
  eventsEl.innerHTML = "";
  logsEl.innerHTML = "";
});

connect();
</script>
</body>
</html>
