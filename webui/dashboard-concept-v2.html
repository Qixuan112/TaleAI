<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>林星遥 · 今日</title>
<script>
// 首屏前定主题，避免亮→暗闪一下。默认跟随系统，手动切过就记住。
(function () {
  try {
    var saved = localStorage.getItem("taleai.concept.theme");
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
  } catch (e) {}
})();
</script>
<style>
  /* ============================================================
     概念稿 v2：先回答"现在怎么样、要不要我管"，再讲故事。

     参考拆解：
       KiraAI 概览 —— 取：四张 KPI 卡、状态与用量分区、左侧常驻导航；
                      去：空图表占位、大色块图标、卡片阴影堆叠。
       AstrBot 面板 —— 取：页头一句说明 + 主操作、可执行的任务行、
                        分组导航与底部系统入口；
                        去：首启弹窗、过大的空白、表格化的管理感。
       SillyTavern —— 取：对话优先的轻量感；
                      去：深色角色扮演工具的视觉语言。

     数据形状与 /api/overview 同构（含 alerts / deltas / llm /
     platform_counts）。接真实数据时把 DATA 换成一次 fetch 即可。
     ============================================================ */

  :root,
  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #f1eee7;          /* 桌面 / 画布底 */
    --surface: #fffdf9;        /* 卡片 */
    --sunken: #faf7f0;
    --ink: #1e1d1a;
    --ink-2: #3a3833;
    --muted: #6b675e;
    --faint: #9c978c;
    --line: #e4dfd4;
    --line-soft: #efeae0;
    --accent: #4f5fb5;
    --accent-soft: #eef0fb;
    --mark: #6b7fd7;           /* 平台 A（Web） */
    --mark-2: #b07d3a;         /* 平台 B（QQ）——与 A 的组合已过校验 */
    --good: #3f8a5f;
    --good-soft: #ecf6ef;
    --warn: #a8732a;
    --warn-soft: #fdf5e6;
    --bad: #b04a43;
    --bad-soft: #fbeeed;
    --mono: "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    --shadow: 0 1px 0 rgba(30,29,26,.03), 0 20px 60px rgba(30,29,26,.06);
    --ease: cubic-bezier(.22,.7,.3,1);
    --dur: .2s;
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0d0c0a;
    --surface: #191815;
    --sunken: #131210;
    --ink: #f4f1e9;
    --ink-2: #d8d3c7;
    --muted: #a09a8e;
    --faint: #777267;
    --line: #2c2a25;
    --line-soft: #24221e;
    --accent: #a7b4f2;
    --accent-soft: rgba(107,127,215,.16);
    --mark: #7a89dd;
    --mark-2: #b9823f;
    --good: #7fc59a;
    --good-soft: rgba(63,138,95,.14);
    --warn: #d6a45e;
    --warn-soft: rgba(168,115,42,.16);
    --bad: #e08a83;
    --bad-soft: rgba(176,74,67,.16);
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 24px 70px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink-2);
    font: 14px/1.7 var(--sans);
    display: flex;
    justify-content: center;
    overflow: hidden;
    transition: background-color .3s var(--ease), color .3s var(--ease);
  }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: var(--accent-soft); color: var(--ink); }

  .app {
    position: relative;
    width: 100%;
    max-width: 1240px;
    height: 100%;
    display: flex;
    background: var(--paper);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ============ 左侧轨道 ============ */
  .rail {
    width: 236px;
    flex: none;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--line);
    overflow: hidden;
    transition: width .26s var(--ease), transform .26s var(--ease);
    z-index: 30;
  }
  .rail-top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 22px 16px 16px;
    min-height: 78px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    flex: 1; min-width: 0;
    color: inherit; text-decoration: none;
  }
  .brand .mark { flex: none; width: 26px; height: 26px; color: var(--accent); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .brand-text strong { font-size: 14px; font-weight: 600; color: var(--ink); }
  .brand-text small {
    margin-top: 3px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .16em;
    color: var(--faint); text-transform: uppercase;
  }
  .rail-toggle {
    flex: none;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: 0; border-radius: 7px;
    background: transparent; color: var(--faint);
    cursor: pointer;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .rail-toggle:hover { background: var(--sunken); color: var(--ink); }
  .rail-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rail-toggle svg { transition: transform .26s var(--ease); }

  .nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    height: 38px; padding: 0 10px;
    border-radius: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    white-space: nowrap;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav-item svg { flex: none; color: var(--faint); transition: color var(--dur) var(--ease); }
  .nav-item:hover { background: var(--sunken); color: var(--ink); }
  .nav-item:hover svg { color: var(--ink); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-item.active {
    color: var(--accent);
    background: var(--accent-soft);
    font-weight: 500;
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .nav-item.active svg { color: var(--accent); }

  .rail-foot {
    margin-top: auto;
    padding: 14px 16px 18px;
    border-top: 1px solid var(--line-soft);
    display: flex; flex-direction: column; gap: 5px;
    white-space: nowrap;
  }
  .life { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
  .life .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--good);
    animation: life 3.2s var(--ease) infinite;
  }
  @keyframes life {
    0%, 100% { box-shadow: 0 0 0 0 rgba(63,138,95,.35); }
    50%      { box-shadow: 0 0 0 5px rgba(63,138,95,0); }
  }
  .rail-note { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--faint); }

  .app.rail .rail { width: 72px; }
  .app.rail .brand-text,
  .app.rail .nav-item span,
  .app.rail .rail-foot .rail-note,
  .app.rail .life span { display: none; }
  .app.rail .rail-top { padding: 22px 0 16px; justify-content: center; }
  .app.rail .brand { flex: none; }
  .app.rail .nav { padding: 4px 12px; }
  .app.rail .nav-item { justify-content: center; padding: 0; }
  .app.rail .rail-foot { align-items: center; padding: 14px 0 18px; }
  .app.rail .rail-toggle svg { transform: rotate(180deg); }

  /* ============ 主舞台 ============ */
  .stage {
    flex: 1; min-width: 0;
    overflow-y: auto;
    padding: 26px 30px 34px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .stage::-webkit-scrollbar { width: 10px; }
  .stage::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 999px; border: 3px solid var(--paper);
  }
  .stage::-webkit-scrollbar-track { background: transparent; }
  .stage-inner { max-width: 980px; margin: 0 auto; }

  /* ---- 页头 ---- */
  .masthead {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 24px;
    margin-bottom: 16px;
  }
  .masthead-left { display: flex; align-items: flex-start; gap: 10px; min-width: 0; flex: 1; }
  .menu-btn { display: none; }
  .titles { min-width: 0; }
  .date {
    margin: 0 0 3px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .titles h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--ink);
    line-height: 1.3;
  }
  .titles .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  .masthead-actions { display: flex; align-items: center; gap: 6px; flex: none; }
  .live {
    display: inline-flex; align-items: center; gap: 6px;
    margin-right: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--faint);
    white-space: nowrap;
  }
  .live .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--good); }
  .live.syncing .dot { animation: blink .6s var(--ease) infinite alternate; }
  @keyframes blink { from { opacity: .3; } to { opacity: 1; } }

  .primary {
    display: inline-flex; align-items: center; gap: 7px;
    height: 34px; padding: 0 14px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 12px; font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: filter var(--dur) var(--ease), transform .1s var(--ease);
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: scale(.985); }
  .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary svg { flex: none; }

  .icon-action {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 0; border-radius: 8px;
    background: transparent; color: var(--faint);
    cursor: pointer;
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .icon-action:hover { background: var(--surface); color: var(--ink); }
  .icon-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- 卡片通用 ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .card-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 12px;
  }
  .card-head h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .card-head .note {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .05em;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ---- 状态条 ---- */
  .status-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    overflow: hidden;
  }
  .status-item {
    display: flex; align-items: center; gap: 9px;
    min-width: 0;
    padding: 13px 16px;
    text-decoration: none;
    transition: background var(--dur) var(--ease);
    border-radius: 12px;
  }
  .status-item:hover { background: var(--sunken); }
  .status-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .status-item + .status-item { border-left: 1px solid var(--line-soft); border-radius: 0; }
  .s-dot {
    flex: none;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--faint);
  }
  .s-dot.ok { background: var(--good); }
  .s-dot.warn { background: var(--warn); }
  .s-dot.bad { background: var(--bad); }
  .s-label {
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .s-value {
    flex: 1; min-width: 0;
    font-size: 12px;
    color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status-item.bad .s-value { color: var(--bad); }
  .status-item.warn .s-value { color: var(--warn); }
  .s-note {
    flex: none;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--faint);
    white-space: nowrap;
  }

  /* ---- 首屏：今日 + 脉搏 ---- */
  .hero-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
    gap: 14px;
    margin-top: 14px;
  }
  .today-card { padding: 20px 22px; min-width: 0; }
  .card-kicker {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .12em;
    color: var(--faint);
  }
  .card-kicker .tag {
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--good-soft);
    color: var(--good);
    letter-spacing: .04em;
  }
  .today-line {
    display: flex; align-items: baseline; gap: 8px;
    margin-top: 8px;
  }
  .today-line .big {
    font-size: 46px;
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -.03em;
    color: var(--ink);
    font-variant-numeric: proportional-nums;
  }
  .today-line .unit { font-size: 14px; color: var(--muted); }
  .today-line .delta {
    margin-left: 4px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--good-soft);
    color: var(--good);
    font-family: var(--mono);
    font-size: 10px;
    white-space: nowrap;
  }
  .today-sub {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    max-width: 42ch;
  }
  .today-sub .hl { color: var(--ink-2); }
  .today-mini {
    display: flex; flex-wrap: wrap; gap: 6px 18px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line-soft);
  }
  .mini-item {
    display: inline-flex; align-items: baseline; gap: 5px;
    font-size: 11px;
    color: var(--muted);
  }
  .mini-item b {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: proportional-nums;
  }

  .pulse-card { padding: 18px 20px 14px; min-width: 0; }
  .pulse-plot {
    position: relative;
    height: 82px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
  }
  .pulse-col {
    position: relative;
    flex: 1;
    height: 100%;
    border: 0; padding: 0;
    background: transparent;
    display: flex; align-items: flex-end; justify-content: center;
    cursor: pointer;
    border-radius: 3px;
  }
  .pulse-col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pulse-bar {
    width: 7px;
    max-height: 100%;
    background: var(--mark);
    border-radius: 3px 3px 0 0;
    transform-origin: bottom;
    animation: grow .6s var(--ease) both;
    animation-delay: calc(var(--i) * 20ms);
    transition: background var(--dur) var(--ease);
  }
  .pulse-col:hover .pulse-bar,
  .pulse-col.active .pulse-bar { background: var(--accent); }
  .pulse-col.today .pulse-bar { background: var(--accent); }
  .pulse-bar.zero { height: 2px !important; background: var(--line); border-radius: 1px; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .pulse-foot {
    display: flex; justify-content: space-between;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .pulse-readout {
    margin-top: 4px;
    min-height: 16px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
  }
  .pulse-readout .num { color: var(--ink); }
  .pulse-table { margin-top: 6px; }
  .pulse-table summary {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .06em;
    color: var(--muted);
    cursor: pointer;
    list-style: none;
  }
  .pulse-table summary::-webkit-details-marker { display: none; }
  .pulse-table summary:hover { color: var(--accent); }
  .pulse-table table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 9px;
  }
  .pulse-table th, .pulse-table td {
    text-align: left; padding: 3px 2px;
    border-bottom: 1px solid var(--line-soft);
    font-variant-numeric: tabular-nums;
  }
  .pulse-table th { color: var(--faint); font-weight: 500; }
  .pulse-table td { color: var(--muted); }
  .pulse-table td:last-child, .pulse-table th:last-child { text-align: right; }

  /* ---- KPI 行 ---- */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin-top: 14px;
  }
  .kpi {
    padding: 15px 18px;
    min-width: 0;
  }
  .kpi + .kpi { border-left: 1px solid var(--line-soft); }
  .kpi-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .kpi-value {
    margin-top: 3px;
    font-size: 27px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -.02em;
    color: var(--ink);
    font-variant-numeric: proportional-nums;
  }
  .kpi-foot {
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }  .kpi-foot .up { color: var(--good); }
  .kpi-foot .down { color: var(--muted); }
  .kpi-foot .flat { color: var(--faint); }

  /* ---- 第二屏：需要你 / LLM / 分布 ---- */
  .scan-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, .86fr);
    gap: 14px;
    margin-top: 14px;
  }
  .scan-card { padding: 16px 18px; min-width: 0; }
  .count-badge {
    display: inline-flex; align-items: center;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--warn);
    background: var(--warn-soft);
    border-radius: 999px;
    padding: 1px 7px;
  }

  .alert {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .alert:last-child { border-bottom: 0; padding-bottom: 0; }
  .a-dot {
    flex: none;
    width: 6px; height: 6px; border-radius: 50%;
    margin-top: 7px;
    background: var(--warn);
  }
  .alert.bad .a-dot { background: var(--bad); }
  .alert.info .a-dot { background: var(--accent); }
  .a-body { flex: 1; min-width: 0; }
  .a-title { margin: 0; font-size: 12.5px; color: var(--ink); }
  .a-detail { margin: 1px 0 0; font-size: 11px; color: var(--muted); }
  .a-action {
    flex: none;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
    margin-top: 1px;
  }
  .a-action:hover { text-decoration: underline; }
  .a-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .all-clear {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0 2px;
    font-size: 12px;
    color: var(--muted);
  }
  .all-clear .check {
    flex: none;
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--good-soft);
    color: var(--good);
  }
  .all-clear b { color: var(--ink); font-weight: 500; }
  .all-clear small { display: block; font-size: 11px; color: var(--faint); }

  .llm-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
  }
  .llm-stat .l-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .04em;
    color: var(--muted);
  }
  .llm-stat .l-value {
    margin-top: 2px;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
  }
  .llm-stat .l-note { font-size: 10px; color: var(--muted); }
  .llm-stat .l-note.bad { color: var(--bad); }
  .llm-empty { padding: 10px 0; font-size: 11px; color: var(--faint); }

  .dist-bar {
    display: flex;
    gap: 2px;
    height: 10px;
    margin: 4px 0 10px;
  }
  .dist-seg { height: 100%; border-radius: 999px; }
  .dist-seg.web { background: var(--mark); }
  .dist-seg.qq { background: var(--mark-2); }
  .dist-legend { display: flex; flex-direction: column; gap: 5px; }
  .legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--muted);
  }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .legend-dot.web { background: var(--mark); }
  .legend-dot.qq { background: var(--mark-2); }
  .legend-item .l-name { color: var(--ink-2); }
  .legend-item .l-num { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--faint); }
  .dist-note { margin: 8px 0 0; font-family: var(--mono); font-size: 9px; color: var(--faint); }

  /* ---- 细节：记忆 / 事件 / 会话 / 系统 ---- */
  .section-rule {
    display: flex; align-items: center; gap: 12px;
    margin: 28px 0 2px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .14em;
    color: var(--faint);
  }
  .section-rule::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  .columns {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 48px;
    padding-top: 14px;
  }
  .col { min-width: 0; }
  .chapter { margin-bottom: 34px; }
  .chapter:last-child { margin-bottom: 0; }
  .chapter-head {
    display: flex; align-items: baseline; gap: 9px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .chapter-head .index { font-family: var(--mono); font-size: 9px; color: var(--faint); flex: none; }
  .chapter-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink); flex: none; }
  .chapter-head .note {
    margin-left: auto;
    font-family: var(--mono); font-size: 9px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .memory { border-bottom: 1px solid var(--line-soft); }
  .memory:last-child { border-bottom: 0; }
  .memory-head {
    width: 100%;
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 2px;
    border: 0; background: transparent;
    text-align: left; cursor: pointer;
    border-radius: 6px;
    transition: background var(--dur) var(--ease);
  }
  .memory-head:hover { background: var(--sunken); }
  .memory-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .memory-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.7; color: var(--ink-2); }
  .memory-side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 2px; }
  .memory-head::after {
    content: "›";
    flex: none; align-self: center; margin-left: 2px;
    font-size: 13px; line-height: 1; color: var(--faint);
    transition: transform .2s var(--ease), color .2s var(--ease);
  }
  .memory:hover .memory-head::after { color: var(--muted); }
  .memory.open .memory-head::after { transform: rotate(90deg); color: var(--accent); }
  .memory-time { font-family: var(--mono); font-size: 9px; color: var(--muted); white-space: nowrap; }
  .ticks { display: inline-flex; gap: 2px; }
  .ticks i { width: 3px; height: 7px; border-radius: 1px; background: var(--line); }
  .ticks i.on { background: var(--mark); }
  .memory-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .24s var(--ease); }
  .memory.open .memory-body { grid-template-rows: 1fr; }
  .memory-body-inner { overflow: hidden; min-height: 0; }
  .memory-detail { padding: 0 2px 13px 0; }
  .memory-quote {
    margin: 0 0 8px;
    padding-left: 13px;
    border-left: 2px solid var(--accent-soft);
    font-size: 12.5px; line-height: 1.7; color: var(--muted);
  }
  .memory-meta {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .03em; color: var(--faint);
  }

  .ledger { list-style: none; margin: 0; padding: 0; }
  .entry {
    display: grid;
    grid-template-columns: 58px 50px minmax(0, 1fr);
    gap: 9px;
    align-items: baseline;
    padding: 9px 2px;
    border-bottom: 1px solid var(--line-soft);
  }
  .entry:last-child { border-bottom: 0; }
  .entry time { font-family: var(--mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kind {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--muted); white-space: nowrap;
  }
  .kind::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
  .kind.recv::before { background: var(--mark); }
  .kind.sent::before { background: var(--good); }
  .kind.closed::before { background: var(--line); }
  .entry p {
    margin: 0;
    font-size: 12px; line-height: 1.65; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .entry p.quiet { color: var(--faint); }

  .session {
    width: 100%;
    display: flex; align-items: baseline; gap: 12px;
    padding: 11px 2px;
    border: 0; border-bottom: 1px solid var(--line-soft);
    background: transparent; text-align: left; cursor: pointer;
    border-radius: 6px;
    transition: background var(--dur) var(--ease);
  }
  .session:last-child { border-bottom: 0; }
  .session:hover { background: var(--sunken); }
  .session:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .session-title {
    flex: 1; min-width: 0;
    font-size: 12.5px; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-meta { flex: none; font-family: var(--mono); font-size: 9px; color: var(--muted); white-space: nowrap; }
  .session .arrow {
    flex: none; color: var(--faint); opacity: 0; transform: translateX(-3px);
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .session:hover .arrow, .session:focus-visible .arrow { opacity: 1; transform: translateX(0); }

  .system { margin: 0; padding-top: 2px; }
  .system .row {
    display: grid; grid-template-columns: 60px minmax(0, 1fr);
    gap: 12px; padding: 7px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 11px;
  }
  .system .row:last-child { border-bottom: 0; }
  .system dt { color: var(--muted); font-family: var(--mono); font-size: 9px; letter-spacing: .05em; }
  .system dd {
    margin: 0; color: var(--muted);
    font-family: var(--mono); font-size: 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status-line { display: inline-flex; align-items: center; gap: 6px; }
  .status-line .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
  .status-line.ok .dot { background: var(--good); }
  .status-line.warn .dot { background: var(--warn); }
  .status-line.bad .dot { background: var(--bad); }

  .empty { padding: 16px 2px; font-size: 11.5px; color: var(--faint); line-height: 1.7; }

  .colophon {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 40px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .05em;
    color: var(--faint);
  }
  .colophon .sep { opacity: .5; }

  /* ---- 入场 ---- */
  .rise { animation: rise .55s var(--ease) both; }
  .rise.d1 { animation-delay: .04s; }
  .rise.d2 { animation-delay: .1s; }
  .rise.d3 { animation-delay: .16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- 浮层提示 ---- */
  .toast {
    position: fixed;
    left: 50%; bottom: 28px;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--surface);
    font-size: 12px;
    padding: 9px 16px;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .backdrop { display: none; }

  /* ---- 中等宽度：先保信息，再保并排 ---- */
  @media (max-width: 1100px) {
    .scan-grid { grid-template-columns: 1fr 1fr; }
    .dist-card { grid-column: 1 / -1; }
    .dist-legend { flex-direction: row; flex-wrap: wrap; gap: 6px 18px; }
    .legend-item .l-num { margin-left: 6px; }
    .dist-note { margin-top: 4px; }
  }
  @media (max-width: 980px) {
    .stage { padding: 22px 24px 30px; }
    .hero-grid { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
    .kpi:nth-child(3) { border-left: 0; border-top: 1px solid var(--line-soft); }
    .kpi:nth-child(4) { border-top: 1px solid var(--line-soft); }
    .columns { grid-template-columns: 1fr; gap: 0; }
    .scan-grid { grid-template-columns: 1fr; }
    .dist-card { grid-column: auto; }
  }

  /* ---- 窄屏：轨道变抽屉 ---- */
  @media (max-width: 900px) {
    .app { max-width: none; box-shadow: none; }
    .rail {
      position: absolute; top: 0; bottom: 0; left: 0;
      width: 236px;
      transform: translateX(-100%);
      box-shadow: 0 0 40px rgba(0,0,0,.16);
    }
    .rail.open { transform: translateX(0); }
    .app.rail .rail { width: 236px; }
    .app.rail .brand-text, .app.rail .nav-item span,
    .app.rail .rail-foot .rail-note, .app.rail .life span { display: initial; }
    .app.rail .rail-top { padding: 22px 16px 16px; justify-content: flex-start; }
    .app.rail .nav { padding: 4px 10px; }
    .app.rail .nav-item { justify-content: flex-start; padding: 0 10px; }
    .app.rail .rail-foot { align-items: flex-start; padding: 14px 16px 18px; }
    .app.rail .rail-toggle svg { transform: none; }
    .menu-btn { display: grid; }
    .backdrop.show {
      display: block;
      position: absolute; inset: 0;
      z-index: 25;
      background: rgba(0,0,0,.28);
    }
    .stage { padding: 20px 20px 26px; }
    .masthead { margin-bottom: 14px; }
    .status-strip { grid-template-columns: 1fr 1fr; }
    .status-item:nth-child(3) { border-left: 0; border-top: 1px solid var(--line-soft); border-radius: 0; }
    .status-item:nth-child(4) { border-top: 1px solid var(--line-soft); }
    .status-item:nth-child(1) { border-top-left-radius: 12px; }
    .status-item:nth-child(2) { border-top-right-radius: 12px; }
    .status-item:nth-child(3) { border-bottom-left-radius: 12px; }
    .status-item:nth-child(4) { border-bottom-right-radius: 12px; }
  }

  @media (max-width: 620px) {
    .stage { padding: 16px 14px 22px; }
    .masthead { gap: 10px; }
    .titles h1 { font-size: 19px; }
    .titles .sub { font-size: 11px; }
    .live { display: none; }
    .primary { padding: 0 11px; }
    .primary span.label { display: none; }
    .today-card { padding: 16px 16px; }
    .today-line .big { font-size: 38px; }
    .today-sub { font-size: 12px; }
    .kpi { padding: 12px 14px; }
    .kpi-value { font-size: 23px; }
    .scan-card { padding: 14px 16px; }
    .entry { grid-template-columns: 50px 46px minmax(0, 1fr); gap: 7px; }
    .chapter-head .note { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse-bar, .rise, .life .dot, .live.syncing .dot { animation: none; }
    .rail, .memory-body, .toast, .pulse-bar, .nav-item, .session, .icon-action,
    .status-item, .memory-head { transition: none; }
  }

  @media print {
    body { background: #fff; overflow: visible; }
    .app { box-shadow: none; max-width: none; }
    .rail, .masthead-actions, .pulse-readout, .menu-btn { display: none !important; }
    .stage { overflow: visible; padding: 0; }
    .memory-body { grid-template-rows: 1fr; }
    .pulse-bar { animation: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ 左侧轨道 ============ -->
  <aside class="rail" id="rail">
    <div class="rail-top">
      <a class="brand" href="#" aria-label="塔利 · TaleAI">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="11.5" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
          <circle cx="16" cy="16" r="4.2" fill="currentColor"/>
          <circle cx="25.5" cy="9" r="2.1" fill="currentColor" opacity=".9"/>
        </svg>
        <span class="brand-text"><strong>塔利</strong><small>TaleAI</small></span>
      </a>
      <button class="rail-toggle" id="railToggle" type="button"
              aria-label="收起侧栏" title="收起侧栏" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="14 6 8 12 14 18"/>
        </svg>
      </button>
    </div>

    <nav class="nav" aria-label="主导航">
      <a class="nav-item" href="#" title="聊天">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16v10H9l-4 3v-3H4z"/>
        </svg>
        <span>聊天</span>
      </a>
      <a class="nav-item active" href="#" aria-current="page" title="今日">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2"/>
          <path d="M12 7.5v5l3 1.8"/>
        </svg>
        <span>今日</span>
      </a>
      <a class="nav-item" href="#" title="设置">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="7.5" x2="20" y2="7.5"/><circle cx="9" cy="7.5" r="2"/>
          <line x1="4" y1="16.5" x2="20" y2="16.5"/><circle cx="15" cy="16.5" r="2"/>
        </svg>
        <span>设置</span>
      </a>
      <a class="nav-item" href="#" title="日志">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
          <polyline points="7.5 9.5 10.5 12 7.5 14.5"/><line x1="12.5" y1="14.5" x2="16.5" y2="14.5"/>
        </svg>
        <span>日志</span>
      </a>
    </nav>

    <div class="rail-foot">
      <div class="life"><span class="dot"></span><span>运行中</span></div>
      <div class="rail-note">TaleAI · M1</div>
    </div>
  </aside>

  <!-- ============ 主舞台 ============ -->
  <main class="stage" id="stage">
    <div class="stage-inner" id="stageInner">

      <header class="masthead rise">
        <div class="masthead-left">
          <button class="icon-action menu-btn" id="menuBtn" type="button"
                  aria-label="打开导航" title="打开导航">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="16" y2="12"/>
              <line x1="4" y1="17" x2="20" y2="17"/>
            </svg>
          </button>
          <div class="titles">
            <p class="date" id="dateLine">—</p>
            <h1>今天</h1>
            <p class="sub" id="subLine">正在读取…</p>
          </div>
        </div>
        <div class="masthead-actions">
          <span class="live" id="live"><span class="dot"></span><span id="liveText">已同步</span></span>
          <a class="primary" id="openChat" href="#">
            <span class="label">打开聊天</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 6 19 12 13 18"/>
            </svg>
          </a>
          <button class="icon-action" id="copyBtn" type="button"
                  aria-label="复制今日摘要" title="复制今日摘要">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="8" y="8" width="11" height="12" rx="2"/>
              <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/>
            </svg>
          </button>
          <button class="icon-action" id="themeBtn" type="button"
                  aria-label="切换深浅主题" title="切换深浅主题">
            <svg id="themeIcon" viewBox="0 0 24 24" width="16" height="16" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"></svg>
          </button>
          <button class="icon-action" id="reloadBtn" type="button"
                  aria-label="刷新" title="刷新">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 12a8 8 0 1 1-2.3-5.6"/>
              <polyline points="20 4 20 9 15 9"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- 状态条：先回答"是否正常" -->
      <section class="card status-strip rise d1" id="statusStrip" aria-label="系统状态"></section>

      <!-- 首屏：今天 + 脉搏 -->
      <div class="hero-grid rise d1">
        <section class="card today-card">
          <div class="card-kicker">
            今天的对话
            <span class="tag" id="todayTag">较昨天 +0</span>
          </div>
          <div class="today-line">
            <span class="big" id="todayMessages">—</span>
            <span class="unit">句话</span>
          </div>
          <p class="today-sub" id="todaySub">正在读取今天的记录…</p>
          <div class="today-mini" id="todayMini"></div>
        </section>

        <section class="card pulse-card">
          <div class="card-head">
            <h2>近十四日</h2>
            <span class="note" id="pulseTotal"></span>
          </div>
          <div class="pulse-plot" id="pulsePlot" role="group" aria-label="近十四天事件柱状图"></div>
          <div class="pulse-foot"><span id="pulseStart"></span><span>今天</span></div>
          <div class="pulse-readout" id="pulseReadout" aria-live="polite"></div>
          <details class="pulse-table">
            <summary>数据表</summary>
            <table>
              <thead><tr><th>日期</th><th>事件</th><th>记忆</th></tr></thead>
              <tbody id="pulseTable"></tbody>
            </table>
          </details>
        </section>
      </div>

      <!-- KPI：四个总量 -->
      <section class="card kpi-row rise d2" id="kpis"></section>

      <!-- 第二屏：需要你 / LLM 用量 / 平台分布 -->
      <div class="scan-grid rise d2">
        <section class="card scan-card alerts-card">
          <div class="card-head">
            <h2>需要你</h2>
            <span class="note" id="alertNote"></span>
          </div>
          <div id="alerts"></div>
        </section>

        <section class="card scan-card llm-card">
          <div class="card-head">
            <h2>LLM 用量</h2>
            <span class="note">今日</span>
          </div>
          <div class="llm-grid" id="llmStats"></div>
        </section>

        <section class="card scan-card dist-card">
          <div class="card-head">
            <h2>平台分布</h2>
            <span class="note">消息</span>
          </div>
          <div class="dist-bar" id="distBar"></div>
          <div class="dist-legend" id="distLegend"></div>
          <p class="dist-note" id="distNote"></p>
        </section>
      </div>

      <div class="section-rule">细节</div>

      <div class="columns">
        <div class="col">
          <section class="chapter rise d2">
            <div class="chapter-head">
              <span class="index">01</span><h2>记忆</h2>
              <span class="note" id="memNote"></span>
            </div>
            <div id="memories"></div>
          </section>

          <section class="chapter rise d3">
            <div class="chapter-head">
              <span class="index">03</span><h2>会话</h2>
              <span class="note" id="sessNote"></span>
            </div>
            <div id="sessions"></div>
          </section>
        </div>

        <div class="col">
          <section class="chapter rise d2">
            <div class="chapter-head">
              <span class="index">02</span><h2>最近发生</h2>
              <span class="note" id="evNote"></span>
            </div>
            <ol class="ledger" id="events"></ol>
          </section>

          <section class="chapter rise d3">
            <div class="chapter-head">
              <span class="index">04</span><h2>系统</h2>
            </div>
            <dl class="system" id="system"></dl>
          </section>
        </div>
      </div>

      <footer class="colophon rise d3">
        <span>概念稿 v2 · 示例数据</span>
        <span class="sep">/</span>
        <span>数据形状与 /api/overview 同构</span>
        <span class="sep">/</span>

<script>
/* ============================================================
   概念稿 v2
   ------------------------------------------------------------
   信息优先级（从高到低）：
     1. 状态条       —— 现在是否正常
     2. 今天          —— 今天怎么样（一句话 + 三个数）
     3. 近十四日      —— 最近有没有变化
     4. KPI           —— 总量与今日增量
     5. 需要你        —— 有没有要我动手的事
     6. LLM 用量      —— 花了多少、稳不稳
     7. 平台分布      —— 消息从哪来
     8. 记忆/事件/会话 —— 细节，向下滚动再看

   数据形状与 /api/overview 同构；接真实数据时把 DATA 换成：
       fetch("/api/overview").then(r => r.json())
   所有文本用 createElement + textContent（XSS 纪律）。
   ============================================================ */

var NOW = Math.floor(Date.now() / 1000);
var DAY = 86400;
var DATA = buildData();
var state = { theme: document.documentElement.getAttribute("data-theme") || "light" };

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function svg(tag, attrs) {
  var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  return e;
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function fmtNum(n) { return Number(n || 0).toLocaleString("zh-CN"); }

// 1,234 / 12.9K / 1.2M —— 大数字压缩，卡片里不撑破
function compact(n) {
  n = Number(n || 0);
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K";
  return fmtNum(n);
}

function clockOf(ts) {
  var d = new Date(ts * 1000);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

function eventTime(ts) {
  var d = new Date(ts * 1000), now = new Date();
  if (d.toDateString() === now.toDateString()) return clockOf(ts);
  return (d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + clockOf(ts);
}

function monthDay(ts) {
  var d = new Date(ts * 1000);
  return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
}

function weekday(ts) {
  return ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][new Date(ts * 1000).getDay()];
}

function relTime(ts) {
  if (!ts) return "—";
  var diff = NOW - ts;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < DAY) return Math.floor(diff / 3600) + " 小时前";
  if (diff < 2 * DAY) return "昨天";
  return (new Date(ts * 1000).getMonth() + 1) + "-" + new Date(ts * 1000).getDate();
}

function greetingOf(h) {
  if (h < 6) return "凌晨好";
  if (h < 9) return "早上好";
  if (h < 12) return "上午好";
  if (h < 14) return "中午好";
  if (h < 18) return "下午好";
  return "晚上好";
}

function clip(s, n) {
  s = String(s || "");
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

function signed(n) { return (n > 0 ? "+" : "") + fmtNum(n); }

/* ---------- 示例数据 ----------

      },

    platforms: { qq: { state: "running", connected: true, enabled: true } },
    memory: { last_at: NOW - 3600, active: 47, forgotten: 6 },
    llm_key_set: true,
    recent_events: [
      {
        seq: 342, type: "message.received", ts: NOW - 60,
        session_id: "web:panel", preview: "今天的面板改得怎么样？",
      },
      {
        seq: 341, type: "message.sent", ts: NOW - 95,

      },
      {

      {

      },
      {
        seq: 337, type: "message.received", ts: NOW - 3600 * 2.6,
        session_id: "web:beijing", preview: "周二早上七点半的高铁，别让我睡过头。",
      },
      {

      },
      {

      },
    ],
    recent_memories: [
      {
        id: "m1", content: "下周去北京，周二早上 7:30 的高铁。", importance: 5,
        tags: ["计划", "出行"], created_at: NOW - 2 * DAY, session_id: "web:beijing",

    ],
    sessions: [

      { id: "web:beijing", title: "北京出差", count: 11, last_active: NOW - 7200 },
      { id: "web:midnight", title: "深夜闲聊", count: 27, last_active: NOW - DAY },

}

/* ---------- 页头 + 状态条 ---------- */
function renderMasthead(d) {
  var now = new Date(d.now * 1000);
  document.getElementById("dateLine").textContent =
    greetingOf(now.getHours()) + " · " + monthDay(d.now) + " " + weekday(d.now);
  document.getElementById("subLine").textContent =
    d.bot.name + " 的日常观测站 · 只读";
  document.title = (d.bot.name || "塔利") + " · 今日";
  document.getElementById("liveText").textContent = "已同步 · " + clockOf(d.now);
}

function statusItem(label, value, note, cls, page) {
  var a = document.createElement("a");
  a.className = "status-item" + (cls ? " " + cls : "");
  a.href = "#";
  a.appendChild(el("span", "s-dot " + (cls || "")));
  a.appendChild(el("span", "s-label", label));
  a.appendChild(el("span", "s-value", value));
  if (note) a.appendChild(el("span", "s-note", note));
  a.addEventListener("click", function (e) {
    e.preventDefault();
    showToast(page ? "概念稿：这里会去「" + page + "」" : label + "：" + value);
  });
  return a;
}

function renderStatus(d) {
  var strip = document.getElementById("statusStrip");
  strip.textContent = "";
  var qq = (d.platforms || {}).qq || {};
  var mem = d.memory || {};
  var keyOk = !!d.llm_key_set;

  strip.appendChild(statusItem("服务", "运行中", "本机", "ok", "系统"));
  var qqText = !qq.state ? "未接入"
    : (qq.state === "running"
        ? (qq.connected ? "已连接" : "等待连接")
        : (qq.state === "failed" ? "启动失败" : (qq.enabled === false ? "未启用" : "已停止")));
  var qqCls = !qq.state ? ""
    : (qq.state === "running" && qq.connected ? "ok"
    : (qq.state === "failed" ? "bad"
    : (qq.enabled === false ? "" : "warn")));
  strip.appendChild(statusItem("QQ", qqText, qq.state === "running" ? "SnowLuma" : "", qqCls, "设置"));

  var model = d.bot.model || "未配置";
  strip.appendChild(statusItem("模型", model, keyOk ? "密钥已设置" : "未设置", keyOk ? "ok" : "bad", "设置"));

  strip.appendChild(statusItem(
    "记忆",
    mem.last_at ? relTime(mem.last_at) : "未提炼",
    (mem.active || 0) + " 条",
    mem.last_at ? (NOW - mem.last_at > 2 * DAY ? "warn" : "ok") : "warn",
    "日志"
  ));
}

/* ---------- 今天 ---------- */
function renderToday(d) {
  document.getElementById("todayMessages").textContent = fmtNum(d.today.messages);

  var tag = document.getElementById("todayTag");
  var delta = Number(d.deltas.messages || 0);
  tag.textContent = delta === 0 ? "与昨天持平" : "较昨天 " + signed(delta);
  tag.style.background = delta > 0 ? "var(--good-soft)" : "var(--sunken)";
  tag.style.color = delta > 0 ? "var(--good)" : "var(--muted)";

  var sub = document.getElementById("todaySub");
  sub.textContent = "";
  var first = (d.recent_memories || [])[0];
  if (!d.today.messages) {
    sub.textContent = "今天还很安静。说句话，它就醒了。";
  } else if (d.today.memories && first) {
    sub.appendChild(document.createTextNode("它今天记住了 "));
    sub.appendChild(el("span", "hl", fmtNum(d.today.memories) + " 件事"));
    var snippet = clip(first.content, 22).replace(/[。.!！?？]+$/, "");
    sub.appendChild(document.createTextNode("，最近的一件是「" + snippet + "」。"));
  } else if (d.counts.memories) {
    sub.appendChild(document.createTextNode("今天没有新记忆。它仍记得 "));
    sub.appendChild(el("span", "hl", fmtNum(d.counts.memories) + " 件事"));
    sub.appendChild(document.createTextNode("。"));
  } else {
    sub.textContent = "它还没有记住什么。再聊一会儿吧。";
  }

  var mini = document.getElementById("todayMini");
  mini.textContent = "";
  [
    ["事件", d.today.events, "起"],
    ["记忆", d.today.memories, "条"],
    ["会话", d.counts.sessions, "个"],
  ].forEach(function (row) {
    var item = el("span", "mini-item");
    item.appendChild(el("b", null, fmtNum(row[1])));
    item.appendChild(document.createTextNode(" " + row[0] + " / " + row[2]));
    mini.appendChild(item);
  });
}

/* ---------- 14 天脉搏 ---------- */
function pulseDayLabel(day) {
  return monthDay(day.ts) + " · " + fmtNum(day.events) + " 起事件 · " +
         fmtNum(day.memories) + " 条记忆";
}

function setPulseReadout(day) {
  var out = document.getElementById("pulseReadout");
  out.textContent = "";
  out.appendChild(el("span", "num", fmtNum(day.events) + " 起事件"));
  out.appendChild(document.createTextNode(" · " + monthDay(day.ts) + " · " +
                                          fmtNum(day.memories) + " 条记忆"));
}

function markPulse(i) {
  Array.prototype.forEach.call(document.querySelectorAll(".pulse-col"), function (c, idx) {
    c.classList.toggle("active", idx === i);
  });
}

function resetPulse(d) {
  var last = d.series[d.series.length - 1];
  setPulseReadout(last);
  markPulse(d.series.length - 1);
}

function renderPulse(d) {
  var series = d.series || [];
  var total = series.reduce(function (a, s) { return a + s.events; }, 0);
  document.getElementById("pulseTotal").textContent = "合计 " + fmtNum(total) + " 起";
  document.getElementById("pulseStart").textContent = series.length ? monthDay(series[0].ts) : "";

  var max = 1;
  series.forEach(function (s) { if (s.events > max) max = s.events; });

  var plot = document.getElementById("pulsePlot");
  plot.textContent = "";

  series.forEach(function (s, i) {
    var col = document.createElement("button");
    col.type = "button";
    col.className = "pulse-col" + (i === series.length - 1 ? " today" : "");
    col.setAttribute("aria-label", pulseDayLabel(s));
    col.style.setProperty("--i", String(i));

    var bar = el("div", "pulse-bar" + (s.events ? "" : " zero"));
    bar.style.height = s.events ? Math.max(4, (s.events / max) * 100) + "%" : "2px";
    col.appendChild(bar);

    col.addEventListener("pointerenter", function () { setPulseReadout(s); markPulse(i); });
    col.addEventListener("focus", function () { setPulseReadout(s); markPulse(i); });
    col.addEventListener("pointerleave", function () { resetPulse(d); });
    col.addEventListener("blur", function () { resetPulse(d); });
    col.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      e.preventDefault();
      var next = i + (e.key === "ArrowRight" ? 1 : -1);
      if (next < 0) next = series.length - 1;
      if (next >= series.length) next = 0;
      plot.querySelectorAll(".pulse-col")[next].focus();
      setPulseReadout(series[next]);
    });

    plot.appendChild(col);
  });

  resetPulse(d);

  var tbody = document.getElementById("pulseTable");
  tbody.textContent = "";
  series.slice().reverse().forEach(function (s) {
    var tr = document.createElement("tr");
    tr.appendChild(el("td", null, s.date));
    tr.appendChild(el("td", null, fmtNum(s.events)));
    tr.appendChild(el("td", null, fmtNum(s.memories)));
    tbody.appendChild(tr);
  });
}

/* ---------- KPI ---------- */
function renderKpis(d) {
  var box = document.getElementById("kpis");
  box.textContent = "";
  var rows = [
    {
      label: "会话",
      value: d.counts.sessions,
      foot: "网页 " + fmtNum(d.counts.web_sessions) + " · QQ " +
            fmtNum((d.platform_counts && d.platform_counts.qq && d.platform_counts.qq.sessions) || 0),
      cls: "flat",
    },
    {
      label: "消息",
      value: d.counts.messages,
      foot: "较昨天 " + signed(d.deltas.messages),
      cls: d.deltas.messages > 0 ? "up" : (d.deltas.messages < 0 ? "down" : "flat"),
    },
    {
      label: "事件",
      value: d.counts.events,
      foot: "较昨天 " + signed(d.deltas.events),
      cls: d.deltas.events > 0 ? "up" : (d.deltas.events < 0 ? "down" : "flat"),
    },
    {
      label: "记忆",
      value: d.counts.memories,
      foot: "较昨天 " + signed(d.deltas.memories) +
            (d.counts.memories_forgotten ? " · 遗忘 " + d.counts.memories_forgotten : ""),
      cls: d.deltas.memories > 0 ? "up" : (d.deltas.memories < 0 ? "down" : "flat"),
    },
  ];
  rows.forEach(function (r) {
    var k = el("div", "kpi");
    k.appendChild(el("div", "kpi-label", r.label));
    k.appendChild(el("div", "kpi-value", fmtNum(r.value)));
    var foot = el("div", "kpi-foot");
    foot.appendChild(el("span", r.cls, r.foot));
    k.appendChild(foot);
    box.appendChild(k);
  });
}

/* ---------- 需要你 ---------- */
function renderAlerts(d) {
  var box = document.getElementById("alerts");
  box.textContent = "";
  var list = d.alerts || [];
  var note = document.getElementById("alertNote");
  note.textContent = list.length ? list.length + " 项" : "";

  if (!list.length) {
    var clear = el("div", "all-clear");
    var check = el("span", "check");
    var tick = svg("svg", {
      viewBox: "0 0 24 24", width: "12", height: "12", fill: "none",
      stroke: "currentColor", "stroke-width": "2.2",
      "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true",
    });
    tick.appendChild(svg("polyline", { points: "4 12.5 9.5 18 20 6.5" }));
    check.appendChild(tick);
    clear.appendChild(check);
    var text = el("span");
    text.appendChild(el("b", null, "没有需要你处理的事"));
    text.appendChild(el("small", null, "它自己在跑。"));
    clear.appendChild(text);
    box.appendChild(clear);
    return;
  }

  list.forEach(function (a) {
    var row = el("div", "alert " + (a.level || ""));
    row.appendChild(el("span", "a-dot"));
    var body = el("div", "a-body");
    body.appendChild(el("p", "a-title", a.title));
    if (a.detail) body.appendChild(el("p", "a-detail", a.detail));
    row.appendChild(body);
    if (a.action) {
      var link = el("a", "a-action", a.action + " →");
      link.href = "#";
      link.addEventListener("click", function (e) {
        e.preventDefault();
        showToast("接入后会打开 " + (a.href || "对应页面"));
      });
      row.appendChild(link);
    }
    box.appendChild(row);
  });
}

/* ---------- LLM 用量 ---------- */
function renderLlm(d) {
  var box = document.getElementById("llmStats");
  box.textContent = "";
  var l = d.llm || {};

  if (!l.calls) {
    box.appendChild(el("div", "llm-empty", "今天还没有调用。"));
    return;
  }

  var latency = l.avg_latency_ms == null
    ? "—"
    : (l.avg_latency_ms >= 1000
        ? (l.avg_latency_ms / 1000).toFixed(2) + "s"
        : l.avg_latency_ms + "ms");

  var rows = [
    ["调用", fmtNum(l.calls), "次"],
    ["Token", compact(l.tokens_total), "in " + compact(l.tokens_in) + " / out " + compact(l.tokens_out)],
    ["平均响应", latency, ""],
    ["成功率", l.success_rate == null ? "—" : l.success_rate + "%",
      l.errors ? l.errors + " 次失败" : "无失败"],
  ];

  rows.forEach(function (r, i) {
    var s = el("div", "llm-stat");
    s.appendChild(el("div", "l-label", r[0]));
    s.appendChild(el("div", "l-value", r[1]));
    if (r[2]) {
      var note = el("div", "l-note" + (i === 3 && l.errors ? " bad" : ""), r[2]);
      s.appendChild(note);
    }
    box.appendChild(s);
  });
}

/* ---------- 平台分布 ---------- */
function renderDistribution(d) {
  var bar = document.getElementById("distBar");
  var legend = document.getElementById("distLegend");
  var note = document.getElementById("distNote");
  bar.textContent = "";
  legend.textContent = "";

  var counts = d.platform_counts || {};
  var web = (counts.web && counts.web.messages) || 0;
  var qq = (counts.qq && counts.qq.messages) || 0;
  var total = web + qq;

  if (!total) {
    bar.appendChild(el("div", "dist-seg web", ""));
    bar.firstChild.style.width = "100%";
    bar.firstChild.style.opacity = ".15";
    legend.appendChild(el("div", "empty", "还没有消息。"));
    note.textContent = "按消息条数";
    return;
  }

  var webPct = Math.round(web * 1000 / total) / 10;
  var qqPct = Math.round((100 - webPct) * 10) / 10;

  var a = el("div", "dist-seg web");
  a.style.width = webPct + "%";
  a.title = "Web " + fmtNum(web) + " 条";
  var b = el("div", "dist-seg qq");
  b.style.width = qqPct + "%";
  b.title = "QQ " + fmtNum(qq) + " 条";
  bar.appendChild(a);
  bar.appendChild(b);

  [
    { cls: "web", name: "Web", n: web, pct: webPct },
    { cls: "qq", name: "QQ", n: qq, pct: qqPct },
  ].forEach(function (s) {
    var item = el("div", "legend-item");
    item.appendChild(el("span", "legend-dot " + s.cls));
    item.appendChild(el("span", "l-name", s.name));
    item.appendChild(el("span", "l-num", fmtNum(s.n) + " 条 · " + s.pct + "%"));
    legend.appendChild(item);
  });

  note.textContent = "按消息条数 · 共 " + fmtNum(total) + " 条";
}

/* ---------- 记忆 ---------- */
function ticks(level) {
  var box = el("span", "ticks");
  box.setAttribute("aria-label", "重要度 " + level + " / 5");
  box.title = "重要度 " + level + " / 5";
  for (var i = 0; i < 5; i++) {
    var t = document.createElement("i");
    if (i < level) t.className = "on";
    box.appendChild(t);
  }
  return box;
}

function sessionTitle(d, id) {
  for (var i = 0; i < (d.sessions || []).length; i++) {
    if (d.sessions[i].id === id) return d.sessions[i].title;
  }
  return id || "一段对话";
}

function renderMemories(d) {
  var box = document.getElementById("memories");
  box.textContent = "";
  document.getElementById("memNote").textContent =
    fmtNum(d.counts.memories) + " 条 · 今日 +" + fmtNum(d.today.memories);

  var list = d.recent_memories || [];
  if (!list.length) {
    box.appendChild(el("p", "empty", "还没有提炼出记忆。安静地聊一会儿，它会自己想起来。"));
    return;
  }

  list.forEach(function (m) {
    var item = el("article", "memory");
    var head = document.createElement("button");
    head.type = "button";
    head.className = "memory-head";
    head.setAttribute("aria-expanded", "false");
    head.appendChild(el("span", "memory-text", m.content));

    var side = el("span", "memory-side");
    side.appendChild(ticks(Number(m.importance) || 0));
    side.appendChild(el("span", "memory-time", relTime(m.created_at)));
    head.appendChild(side);

    var body = el("div", "memory-body");
    var inner = el("div", "memory-body-inner");
    var detail = el("div", "memory-detail");
    if (m.quote) {
      var q = el("p", "memory-quote");
      q.appendChild(document.createTextNode("“" + m.quote + "”"));
      detail.appendChild(q);
    }
    var meta = el("div", "memory-meta");
    (m.tags || []).slice(0, 4).forEach(function (t) { meta.appendChild(el("span", null, "#" + t)); });
    meta.appendChild(el("span", null, "来自 " + sessionTitle(d, m.session_id)));
    meta.appendChild(el("span", null, "重要度 " + (m.importance || 0) + "/5"));
    detail.appendChild(meta);

    inner.appendChild(detail);
    body.appendChild(inner);
    item.appendChild(head);
    item.appendChild(body);
    head.addEventListener("click", function () {
      var open = item.classList.toggle("open");
      head.setAttribute("aria-expanded", String(open));
    });
    box.appendChild(item);
  });
}

/* ---------- 事件 ---------- */
function eventLabel(type) {
  if (type === "message.received") return "收到";
  if (type === "message.sent") return "回复";
  if (type === "session.closed") return "结束";
  return type || "事件";
}

function eventDot(type) {
  if (type === "message.received") return "recv";
  if (type === "message.sent") return "sent";
  if (type === "session.closed") return "closed";
  return "";
}

function renderEvents(d) {
  var box = document.getElementById("events");
  box.textContent = "";
  var list = d.recent_events || [];
  document.getElementById("evNote").textContent = fmtNum(d.today.events) + " 起 · 今日";

  if (!list.length) {
    box.appendChild(el("li", "empty", "还没有事件记录。发一条消息，这里就会有动静。"));
    return;
  }

  list.forEach(function (ev) {
    var li = document.createElement("li");
    li.className = "entry";
    li.appendChild(el("time", null, eventTime(ev.ts)));
    li.appendChild(el("span", "kind " + eventDot(ev.type), eventLabel(ev.type)));
    li.appendChild(el("p", ev.preview ? "" : "quiet",
      ev.preview || (ev.type === "session.closed" ? "这条会话先搁下了" : "—")));
    box.appendChild(li);
  });
}

/* ---------- 会话 ---------- */
function renderSessions(d) {
  var box = document.getElementById("sessions");
  box.textContent = "";
  document.getElementById("sessNote").textContent =
    "网页 " + fmtNum(d.counts.web_sessions) + " 个";

  var list = d.sessions || [];
  if (!list.length) {
    box.appendChild(el("p", "empty", "还没有网页会话。"));
    return;
  }

  list.forEach(function (s) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "session";
    btn.appendChild(el("span", "session-title", s.title || s.id));
    btn.appendChild(el("span", "session-meta", fmtNum(s.count) + " 条 · " + relTime(s.last_active)));
    var arrow = svg("svg", {
      viewBox: "0 0 24 24", width: "13", height: "13", fill: "none",
      stroke: "currentColor", "stroke-width": "1.8", "stroke-linecap": "round",
      "stroke-linejoin": "round", class: "arrow", "aria-hidden": "true",
    });
    arrow.appendChild(svg("polyline", { points: "9 6 15 12 9 18" }));
    btn.appendChild(arrow);
    btn.title = "打开「" + (s.title || s.id) + "」";
    btn.addEventListener("click", function () {
      showToast("接入后会打开「" + (s.title || s.id) + "」");
    });
    box.appendChild(btn);
  });
}

/* ---------- 系统 ---------- */
function qqStatus(qq) {
  if (!qq) return { cls: "", text: "未接入" };
  if (qq.state === "running") {
    return qq.connected ? { cls: "ok", text: "运行中 · 已连接" }
                        : { cls: "warn", text: "运行中 · 等待连接" };
  }
  if (qq.state === "starting") return { cls: "warn", text: "启动中" };
  if (qq.state === "failed") return { cls: "bad", text: "启动失败" };
  return { cls: "", text: qq.enabled === false ? "未启用" : "已停止" };
}

function renderSystem(d) {
  var box = document.getElementById("system");
  box.textContent = "";
  var bot = d.bot || {};
  var qq = (d.platforms || {}).qq;

  function row(label, valueNode) {
    var r = el("div", "row");
    r.appendChild(el("dt", null, label));
    var dd = document.createElement("dd");
    if (typeof valueNode === "string") dd.textContent = valueNode;
    else dd.appendChild(valueNode);
    r.appendChild(dd);
    box.appendChild(r);
  }

  row("模型", bot.model || "未配置");
  row("网关", bot.base_url || "未配置");
  row("密钥", d.llm_key_set ? "已设置" : "未设置");

  var q = qqStatus(qq);
  var line = el("span", "status-line " + q.cls);
  line.appendChild(el("span", "dot"));
  line.appendChild(el("span", null, q.text));
  row("QQ", line);

  row("记忆", d.memory && d.memory.last_at
    ? "上次 " + relTime(d.memory.last_at) + " · " + fmtNum(d.memory.active) + " 条"
    : "还没有提炼");
  row("存储", "SQLite + JSONL");
}

/* ---------- 主题 ---------- */
function paintTheme() {
  var icon = document.getElementById("themeIcon");
  icon.textContent = "";
  if (state.theme === "dark") {
    icon.appendChild(svg("path", {
      d: "M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z",
    }));
  } else {
    icon.appendChild(svg("circle", { cx: "12", cy: "12", r: "4.2" }));
    [[12, 2.5, 12, 5], [12, 19, 12, 21.5], [2.5, 12, 5, 12], [19, 12, 21.5, 12],
     [5.3, 5.3, 7, 7], [17, 17, 18.7, 18.7], [18.7, 5.3, 17, 7], [7, 17, 5.3, 18.7]]
      .forEach(function (p) {
        icon.appendChild(svg("line", {
          x1: p[0], y1: p[1], x2: p[2], y2: p[3], "stroke-linecap": "round",
        }));
      });
  }
  document.getElementById("themeBtn").setAttribute(
    "aria-label", state.theme === "dark" ? "切换到浅色主题" : "切换到深色主题"
  );
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  try { localStorage.setItem("taleai.concept.theme", state.theme); } catch (e) {}
  paintTheme();
}

/* ---------- 摘要复制 ---------- */
function copySummary() {
  var d = DATA;
  var lines = [
    monthDay(d.now) + " · " + weekday(d.now),
    "今天和" + d.bot.name + "说了 " + d.today.messages + " 句话，" +
      d.today.events + " 起事件，新记住 " + d.today.memories + " 件事。",
  ];
  if (d.alerts && d.alerts.length) {
    lines.push("待处理：" + d.alerts.map(function (a) { return a.title; }).join("；"));
  }
  if (d.recent_memories[0]) {
    lines.push("最近记住：「" + d.recent_memories[0].content + "」");
  }
  var text = lines.join("\n");

  function done() { showToast("今日摘要已复制"); }
  function fail() { showToast("复制失败，浏览器没给权限"); }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); }
    catch (e) { fail(); }
    ta.remove();
  }
}

/* ---------- 浮层提示 ---------- */
var toastTimer = null;
function showToast(text) {
  var toast = document.getElementById("toast");
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1900);
}

/* ---------- 侧栏 / 抽屉 ---------- */
var rail = document.getElementById("rail");
var backdrop = document.getElementById("backdrop");
var railToggle = document.getElementById("railToggle");
var RAIL_KEY = "taleai.concept.rail";

function isNarrow() { return window.matchMedia("(max-width: 900px)").matches; }
function applyRail(collapsed) {
  document.getElementById("app").classList.toggle("rail", collapsed);
  railToggle.setAttribute("aria-expanded", String(!collapsed));
  railToggle.setAttribute("aria-label", collapsed ? "展开侧栏" : "收起侧栏");
  railToggle.title = collapsed ? "展开侧栏" : "收起侧栏";
}

if (!isNarrow()) {
  try { if (localStorage.getItem(RAIL_KEY) === "1") applyRail(true); } catch (e) {}
}

railToggle.addEventListener("click", function () {
  if (isNarrow()) {
    var open = rail.classList.toggle("open");
    backdrop.classList.toggle("show", open);
    return;
  }
  var collapsed = !document.getElementById("app").classList.contains("rail");
  applyRail(collapsed);
  try { localStorage.setItem(RAIL_KEY, collapsed ? "1" : "0"); } catch (e) {}
});

document.getElementById("menuBtn").addEventListener("click", function () {
  rail.classList.add("open");
  backdrop.classList.add("show");
});
backdrop.addEventListener("click", function () {
  rail.classList.remove("open");
  backdrop.classList.remove("show");
});

document.querySelectorAll(".nav-item").forEach(function (a) {
  a.addEventListener("click", function (e) {
    e.preventDefault();
    if (a.classList.contains("active")) return;
    showToast("概念稿：这里会去「" + a.textContent.trim() + "」");
  });
});
document.querySelector(".brand").addEventListener("click", function (e) { e.preventDefault(); });
document.getElementById("openChat").addEventListener("click", function (e) {
  e.preventDefault();
  showToast("接入后会打开聊天页");
});

/* ---------- 刷新 ---------- */
function refresh() {
  var live = document.getElementById("live");
  live.classList.add("syncing");
  document.getElementById("liveText").textContent = "同步中";
  setTimeout(function () {
    live.classList.remove("syncing");
    document.getElementById("liveText").textContent =
      "已同步 · " + clockOf(Math.floor(Date.now() / 1000));
    renderAll();
    showToast("已是最新");
  }, 520);
}

/* ---------- 渲染总入口 ---------- */
function renderAll() {
  var d = DATA;
  renderMasthead(d);
  renderStatus(d);
  renderToday(d);
  renderPulse(d);
  renderKpis(d);
  renderAlerts(d);
  renderLlm(d);
  renderDistribution(d);
  renderMemories(d);
  renderEvents(d);
  renderSessions(d);
  renderSystem(d);
}

document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("copyBtn").addEventListener("click", copySummary);
document.getElementById("reloadBtn").addEventListener("click", refresh);

document.addEventListener("keydown", function (e) {
  if (e.key === "r" && !e.ctrlKey && !e.metaKey && !e.altKey) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    refresh();
  }
});

paintTheme();
renderAll();
</script>
</body>
</html>
